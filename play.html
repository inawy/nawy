<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>العب مع ناوي 🎮</title>
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#fff;color:#0f172a;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
  }
  body{display:flex;justify-content:center;align-items:center;}

  .game{
    width:min(100%,900px);height:100%;max-height:700px;
    position:relative;display:flex;flex-direction:column;
    padding:10px 14px 6px;gap:6px;
  }

  /* ====== TOP BAR ====== */
  .topbar{display:flex;align-items:center;gap:10px;min-height:56px;}
  .brand{font-size:18px;font-weight:900;white-space:nowrap;letter-spacing:-.3px;}
  .brand em{font-style:normal;color:#2563eb;}

  .stats{
    margin-inline-start:auto;display:flex;gap:7px;align-items:center;
    font-size:12px;color:#64748b;font-weight:700;white-space:nowrap;
  }
  .stat{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:52px;height:40px;padding:3px 9px;
    border:1px solid #e8edf3;border-radius:12px;
    background:rgba(255,255,255,.9);
    box-shadow:0 4px 14px rgba(24,42,65,.05);
    line-height:1;
  }
  .stat span{font-size:9px;color:#94a3b8;font-weight:800;margin-bottom:2px;letter-spacing:.2px;}
  .stat b{font-size:15px;color:#0f172a;font-weight:900;font-variant-numeric:tabular-nums;}

  .icon-btn{
    border:1px solid #e8edf3;background:#fff;
    font-size:16px;line-height:1;
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;cursor:pointer;
    display:grid;place-items:center;transition:transform .12s;
    color:#526174;box-shadow:0 4px 14px rgba(24,42,65,.05);
  }
  .icon-btn:active{transform:scale(.92);}

  /* ====== STAGE ====== */
  .stage{position:relative;flex:1;min-height:240px;border-radius:20px;overflow:hidden;isolation:isolate;}
  canvas{width:100%;height:100%;display:block;touch-action:none;}

  /* ====== HUD ====== */
  .hud{
    position:absolute;top:12px;left:12px;right:12px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;z-index:5;
  }
  .hud-side{display:flex;gap:6px;}
  .chip{
    padding:5px 10px;border-radius:999px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(225,232,240,.9);
    box-shadow:0 4px 14px rgba(20,45,75,.06);
    font-size:11px;font-weight:800;color:#536174;
    display:none;
  }
  .chip.show{display:inline-flex;align-items:center;gap:5px;}
  .chip.shield{color:#1f6feb;border-color:#c9dfff;background:rgba(230,242,255,.9);}
  .chip.magnet{color:#b45309;border-color:#fde6b5;background:rgba(255,247,230,.9);}

  /* ====== OVERLAY ====== */
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:18px;z-index:10;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.75));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .overlay.hidden{display:none;}
  .overlay-inner{
    padding:22px 24px;border-radius:24px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(224,231,239,.95);
    box-shadow:0 20px 60px rgba(21,45,72,.12);
    max-width:380px;
  }
  .overlay h1{margin:0 0 6px;font-size:24px;font-weight:950;letter-spacing:-.4px;}
  .overlay p{margin:0;color:#64748b;font-size:13px;font-weight:650;line-height:1.6;}
  .overlay .emoji{font-size:44px;line-height:1;margin-bottom:8px;}
  .badge{
    display:inline-block;margin-top:9px;padding:4px 12px;border-radius:999px;
    background:#fef3c7;color:#92400e;font-weight:900;font-size:12px;
  }
  .button{
    margin-top:16px;border:0;border-radius:14px;padding:12px 26px;
    background:linear-gradient(135deg,#1489ff,#0069e5);color:#fff;
    font-size:15px;font-weight:900;letter-spacing:.2px;
    cursor:pointer;pointer-events:auto;font-family:inherit;
    box-shadow:0 8px 22px rgba(0,105,229,.28),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .12s;
  }
  .button:active{transform:scale(.96) translateY(1px);}

  .toast{
    position:absolute;top:13%;left:50%;transform:translate(-50%,10px);
    background:rgba(22,32,48,.92);color:#fff;padding:9px 18px;border-radius:999px;
    font-weight:850;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
    white-space:nowrap;box-shadow:0 10px 30px rgba(20,30,45,.18);
    z-index:8;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .hint{text-align:center;color:#94a3b8;font-size:11px;padding:2px 0;font-weight:600;}

  @media (prefers-color-scheme: dark){
    html,body{background:#0b1220;color:#e2e8f0;}
    .stat{background:rgba(20,30,45,.7);border-color:rgba(60,80,110,.5);}
    .stat b{color:#e2e8f0;}
    .icon-btn{background:#141d2e;border-color:rgba(60,80,110,.5);color:#94a3b8;}
    .overlay-inner{background:rgba(18,26,42,.96);border-color:rgba(60,80,110,.4);}
    .overlay p{color:#94a3b8;}
    .chip{background:rgba(20,30,45,.85);border-color:rgba(60,80,110,.5);color:#cbd5e1;}
    .badge{background:#422006;color:#fcd34d;}
  }
  @media (prefers-reduced-motion: reduce){
    .toast,.button,.icon-btn{transition:none;}
  }
</style>
</head>
<body>

<div class="game">

  <div class="topbar">
    <div class="brand">🎮 العب مع <em>ناوي</em></div>
    <div class="stats">
      <div class="stat"><span>النقاط</span><b id="score">0</b></div>
      <div class="stat"><span>الأفضل</span><b id="best">0</b></div>
      <div class="stat"><span>سلسلة</span><b id="combo">0</b></div>
      <button class="icon-btn" id="muteBtn" aria-label="الصوت">🔊</button>
      <button class="icon-btn" id="pauseBtn" aria-label="إيقاف">Ⅱ</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-side">
        <div class="chip shield" id="shieldChip">🛡️ <b id="shieldTime">0</b></div>
        <div class="chip magnet" id="magnetChip">🧲 <b id="magnetTime">0</b></div>
      </div>
      <div class="hud-side">
        <div class="chip" id="starChip" style="display:inline-flex;align-items:center;gap:5px;color:#b45309;border-color:#fde6b5;background:rgba(255,247,230,.9);">
          ⭐ <b id="stars">0</b>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <div class="emoji" id="ovEmoji">🔵</div>
        <h1 id="ovTitle">ناوي جاهز؟</h1>
        <p id="ovText">اضغط في أي مكان عشان تبدأ</p>
        <button class="button" id="ovBtn">يلا نبدأ</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="hint">اضغط في أي مكان — أو Space على الكيبورد</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   0) أدوات
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];

function roundRectPath(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function circleRect(cx,cy,r,rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw);
  const ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}

function onMQ(mq, fn){
  if (mq.addEventListener) mq.addEventListener('change', fn);
  else if (mq.addListener) mq.addListener(fn);
}

/* ============================================================
   1) عناصر الصفحة
   ============================================================ */
const stage       = document.getElementById('stage');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('best');
const comboEl     = document.getElementById('combo');
const starsEl     = document.getElementById('stars');
const overlay     = document.getElementById('overlay');
const ovEmoji     = document.getElementById('ovEmoji');
const ovTitle     = document.getElementById('ovTitle');
const ovText      = document.getElementById('ovText');
const ovBtn       = document.getElementById('ovBtn');
const toastEl     = document.getElementById('toast');
const muteBtn     = document.getElementById('muteBtn');
const pauseBtn    = document.getElementById('pauseBtn');
const shieldChip  = document.getElementById('shieldChip');
const shieldTime  = document.getElementById('shieldTime');
const magnetChip  = document.getElementById('magnetChip');
const magnetTime  = document.getElementById('magnetTime');

/* ============================================================
   2) الثيم
   ============================================================ */
const darkMQ   = window.matchMedia('(prefers-color-scheme: dark)');
const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

let isDark       = darkMQ.matches;
let reduceMotion = reduceMQ.matches;

onMQ(darkMQ, e => { isDark = e.matches; buildGradient(); });
onMQ(reduceMQ, e => { reduceMotion = e.matches; });

/* ============================================================
   3) ثوابت
   ============================================================ */
const GRAVITY  = 2300;
const JUMP_V   = -800;
const MAX_FALL = 1900;
const BASE_SPEED = 6;
const MAX_SPEED  = 11;
const COYOTE     = 0.10;
const JUMP_BUF   = 0.13;

const MILESTONES = [
  'برافو! 🔥','كمّل يا بطل! 💪','إيه الحلاوة دي! ✨',
  'ناوي مبسوط! 😄','ماشي صح! 🚀','تركيز عالي! 🎯'
];

/* ============================================================
   4) حالة اللعبة
   ============================================================ */
let W=0, H=0, groundY=0, bgGrad=null;

let state = 'ready'; // ready | playing | paused | over
let score = 0, lastShown = -1, milestone = 0;
let starCount = 0, combo = 0;
let speed = BASE_SPEED;
let best = 0;
try { best = Number(localStorage.getItem('nawy.best.v5')) || 0; } catch(e){}

let shake = 0;
let obstacleTimer = 0, starTimer = 0, powerTimer = 0, cloudTimer = 0;
let hillOff1 = 0, hillOff2 = 0, groundOff = 0;
let lastT = 0, overAt = 0;

const obstacles = [];
const stars     = [];
const powerups  = [];
const clouds    = [];
const particles = [];

/* ============================================================
   5) ناوي — شخصية بسيطة ب ريأكشنات Red Ball 4
   ============================================================ */
const player = {
  x: 80, y: 0, size: 40,
  vy: 0, grounded: true, coyote: 0, jumpBuf: 0,
  squash: 1,
  rotation: 0,
  blinkTimer: 2, blinking: 0,
  mood: 'idle',       // idle | jump | fall | happy | hit | focus | record
  moodTimer: 0,
  shield: 0,
  magnet: 0,
  pupilX: 0, pupilY: 0,  // بؤبؤ ناعم الحركة
  pupilTargetX: 0, pupilTargetY: 0
};

function setMood(mood, duration){
  player.mood = mood;
  player.moodTimer = duration || 0;
}

/* ============================================================
   6) الصوت
   ============================================================ */
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem('nawy.muted.v5') === '1'; } catch(e){}

function unlockAudio(){
  if (muted) return;
  try {
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function beep(freq, dur, type, vol, slideTo, delay){
  if (muted) return;
  try {
    unlockAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

function sfx(name){
  switch(name){
    case 'jump':      beep(430, 0.13, 'square',   0.045, 720);  break;
    case 'land':      beep(160, 0.07, 'sine',     0.035, 110);  break;
    case 'coin':      beep(1000,0.09, 'sine',     0.055, 1500);
                      beep(1500,0.09, 'sine',     0.030, 1900, 0.06); break;
    case 'hit':       beep(220, 0.40, 'sawtooth', 0.070, 55);   break;
    case 'power':     beep(500,0.09, 'sine',      0.045, 800);  break;
    case 'shield':    beep(360,0.10, 'triangle',  0.055, 560);  break;
    case 'milestone': beep(660, 0.12, 'triangle', 0.050, 660);
                      beep(880, 0.16, 'triangle', 0.050, 880, 0.11); break;
    case 'record':    beep(660,0.10,'sine',0.055,660);
                      beep(880,0.10,'sine',0.055,880,0.10);
                      beep(1200,0.16,'sine',0.045,1200,0.20); break;
  }
}

function vibrate(ms){
  if (muted) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

/* ============================================================
   7) الجزيئات
   ============================================================ */
function addP(p){
  if (particles.length > 260) return;
  p.rot     = p.rot     || 0;
  p.rotSpd  = p.rotSpd  || 0;
  p.g       = p.g       || 0;
  p.drag    = p.drag    || 0;
  p.maxLife = p.life;
  particles.push(p);
}

function burstDust(x, y, n){
  if (reduceMotion) n = Math.ceil(n/2);
  for (let i=0;i<n;i++){
    addP({
      type:'dust', x: x + rand(-8,8), y: y + rand(-4,2),
      vx: rand(-90,-20), vy: rand(-70,-8),
      g: 220, drag: 2.4, size: rand(2,4.5),
      life: rand(0.3,0.6),
      color: isDark ? '#475569' : '#cbd5e1'
    });
  }
}

function burstSparkle(x, y, n){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU), sp = rand(40,150);
    addP({
      type:'spark', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
      g: 260, drag: 1.8, size: rand(2,4),
      life: rand(0.3,0.55),
      color: pick(['#fbbf24','#fcd34d','#f59e0b','#fff7cc'])
    });
  }
}

function burstConfetti(x, y, n){
  const colors = ['#2563eb','#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa'];
  for (let i=0;i<n;i++){
    const a = rand(-Math.PI, 0), sp = rand(120, 380);
    addP({
      type:'confetti', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      g: 700, drag: 0.6, size: rand(6,11),
      rot: rand(0,TAU), rotSpd: rand(-12,12),
      life: rand(0.8,1.6),
      color: pick(colors)
    });
  }
}

function spawnText(x, y, text, color){
  addP({ type:'text', x, y, vx:0, vy:-58, life:0.85, size:15,
         color: color || '#f59e0b', text });
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.vy += p.g * dt;
    if (p.drag){ const d = Math.max(0, 1 - p.drag*dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotSpd * dt;
  }
}

/* ============================================================
   8) المقاس
   ============================================================ */
function buildGradient(){
  const g = ctx.createLinearGradient(0,0,0,Math.max(groundY,1));
  if (isDark){ g.addColorStop(0,'#0b1220'); g.addColorStop(1,'#141d2e'); }
  else       { g.addColorStop(0,'#e8f1ff'); g.addColorStop(1,'#ffffff'); }
  bgGrad = g;
}

function resize(){
  const rect = canvas.getBoundingClientRect();
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const nw = Math.max(1, Math.round(rect.width));
  const nh = Math.max(1, Math.round(rect.height));

  canvas.width  = Math.round(nw * dpr);
  canvas.height = Math.round(nh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const oldGround = groundY;
  W = nw; H = nh;
  groundY = Math.round(H - Math.max(52, H * 0.16));

  player.size = clamp(Math.round(H * 0.082), 30, 42);

  if (!oldGround){
    player.y = groundY - player.size;
  } else if (oldGround !== groundY){
    const dy = groundY - oldGround;
    for (const o of obstacles) o.y += dy;
    for (const s of stars)     s.y += dy;
    for (const p of powerups)  p.y += dy;
    if (state === 'playing') player.y += dy;
    else player.y = groundY - player.size;
  }

  player.x = Math.max(46, W * 0.14);
  buildGradient();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ============================================================
   9) الرسومات — خلفية
   ============================================================ */
function drawSky(){
  ctx.fillStyle = bgGrad || '#ffffff';
  ctx.fillRect(0, 0, W, groundY + 1);

  ctx.save();
  ctx.fillStyle = '#2563eb';
  ctx.globalAlpha = isDark ? 0.10 : 0.16;
  ctx.beginPath(); ctx.arc(W-64, 62, 68, 0, TAU); ctx.fill();
  ctx.globalAlpha = isDark ? 0.16 : 0.28;
  ctx.beginPath(); ctx.arc(W-64, 62, 44, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawClouds(){
  ctx.save();
  ctx.fillStyle = isDark ? 'rgba(148,163,184,0.14)' : 'rgba(148,163,184,0.28)';
  for (const c of clouds){
    const r = c.w * 0.30;
    ctx.beginPath();
    ctx.arc(c.x,            c.y,           r,        0, TAU);
    ctx.arc(c.x + r*1.10,   c.y - r*0.50,  r*1.25,   0, TAU);
    ctx.arc(c.x + r*2.30,   c.y,           r*0.95,   0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function hillLayer(off, wl, amp, color){
  ctx.beginPath();
  ctx.moveTo(-2, groundY + 2);
  for (let x = -2; x <= W + 2; x += 12){
    const y = groundY - 26
      - Math.sin((x + off) / wl) * amp
      - Math.sin((x + off) / (wl * 0.42)) * amp * 0.35;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 2, groundY + 2);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawHills(){
  hillLayer(hillOff1, 130, 22, isDark ? 'rgba(37,99,235,0.10)' : 'rgba(37,99,235,0.07)');
  hillLayer(hillOff2,  95, 16, isDark ? 'rgba(37,99,235,0.16)' : 'rgba(37,99,235,0.11)');
}

function drawGround(){
  ctx.fillStyle = isDark ? '#0d1522' : '#ffffff';
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.strokeStyle = isDark ? '#334155' : '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY + 1);
  ctx.lineTo(W, groundY + 1);
  ctx.stroke();

  const gap = 44;
  const start = -((groundOff % gap) + gap) % gap;
  ctx.strokeStyle = isDark ? '#1e293b' : '#e2e8f0';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = start; x < W + gap; x += gap){
    ctx.moveTo(x, groundY + 18);
    ctx.lineTo(x + 20, groundY + 18);
  }
  ctx.stroke();
  ctx.lineCap = 'butt';
}

/* ============================================================
   10) النجوم والعقبات والقوى
   ============================================================ */
function drawStars(){
  for (const s of stars){
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    // هالة ناعمة
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, s.r * 1.6, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a  = -Math.PI/2 + i * Math.PI/5;
      const rr = (i % 2) ? s.r * 0.45 : s.r;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#f59e0b';
    ctx.stroke();
    ctx.restore();
  }
}

function drawObstacles(){
  for (const o of obstacles){
    // ظل
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w/2, groundY + 4, o.w*0.55, 4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // الجسم
    ctx.fillStyle = isDark ? '#334155' : '#1e293b';
    roundRectPath(ctx, o.x, o.y, o.w, o.h, 7);
    ctx.fill();

    // سطح
    ctx.fillStyle = isDark ? '#475569' : '#334155';
    roundRectPath(ctx, o.x, o.y, o.w, Math.min(9, o.h*0.22), 7);
    ctx.fill();

    // شبابيك
    ctx.fillStyle = isDark ? '#93c5fd' : '#bfdbfe';
    const cols = o.w >= 46 ? 3 : 2;
    const rows = o.h >= 46 ? 2 : 1;
    const bw = 5, bh = 5;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const px = o.x + (o.w/(cols+1))*(c+1) - bw/2;
        const py = o.y + (rows === 1 ? o.h*0.55 : o.h*(0.38 + r*0.34)) - bh/2;
        roundRectPath(ctx, px, py, bw, bh, 1.5);
        ctx.fill();
      }
    }
  }
}

function drawPowerups(){
  for (const p of powerups){
    const y = p.y + Math.sin(p.bob) * 6;
    ctx.save();

    // هالة
    ctx.shadowBlur = 18;
    ctx.shadowColor = p.type === 'shield'
      ? 'rgba(31,139,255,.35)'
      : 'rgba(255,177,40,.35)';

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, y, p.r, 0, TAU);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = p.type === 'shield' ? '#55a9ff' : '#f1b72f';
    ctx.stroke();

    ctx.font = '900 15px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'shield' ? '🛡️' : '🧲', p.x, y + 1);

    ctx.restore();
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

/* ============================================================
   11) ناوي — شخصية بسيطة ب ريأكشنات
   ============================================================ */
function drawPlayer(){
  const s  = player.size;
  const cx = player.x + s/2;
  const cy = player.y + s/2;
  const R  = s/2;

  /* ---------- ظل أرضي ---------- */
  const airH = clamp((groundY - player.y - s) / 170, 0, 1);
  ctx.save();
  ctx.globalAlpha = (isDark ? 0.30 : 0.13) * (1 - airH*0.7);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, groundY + 5,
              s*0.42*(1-airH*0.4),
              5*(1-airH*0.4),
              0, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* ---------- هالة المغناطيس ---------- */
  if (player.magnet > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(performance.now()/140) * 0.15;
    ctx.strokeStyle = '#f1b72f';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.arc(cx, cy, R + 9, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* ---------- هالة الحماية ---------- */
  if (player.shield > 0){
    const pulse = 1 + Math.sin(performance.now()/140) * 0.05;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    const sGrad = ctx.createRadialGradient(0,0,R-2, 0,0,R+16);
    sGrad.addColorStop(0,   'rgba(49,154,255,0)');
    sGrad.addColorStop(.65, 'rgba(49,154,255,.30)');
    sGrad.addColorStop(1,   'rgba(49,154,255,0)');
    ctx.fillStyle = sGrad;
    ctx.beginPath(); ctx.arc(0, 0, R + 16, 0, TAU); ctx.fill();

    ctx.strokeStyle = 'rgba(90,175,255,.75)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, R + 10, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* ---------- الجسم ---------- */
  ctx.save();
  ctx.translate(cx, cy);

  // squash خفيف جدًا (15% بس عشان يفضل دايرة)
  const squashClamped = clamp(player.squash, 0.85, 1.15);
  const sqX = 1 / Math.sqrt(squashClamped);
  const sqY = squashClamped;
  ctx.scale(sqX, sqY);

  // دوران خفيف
  ctx.rotate(player.rotation * 0.4);

  // ظل خارجي
  ctx.save();
  ctx.shadowColor = 'rgba(20,90,200,.30)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 3;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = '#2563eb';
  ctx.fill();
  ctx.restore();

  // تدرج ناعم
  const g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0,   '#4A96F0');
  g.addColorStop(.55, '#2563EB');
  g.addColorStop(1,   '#1A4FBF');
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  // لمعة علوية
  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-R*0.32, -R*0.44, R*0.30, R*0.15, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* ---------- الوش (ريأكشنات) ---------- */

  // رمش
  player.blinkTimer -= 1/60;
  if (player.blinkTimer <= 0){
    player.blinking = 0.13;
    player.blinkTimer = rand(2.2, 5.5);
  }
  if (player.blinking > 0) player.blinking -= 1/60;
  const blinkingNow = player.blinking > 0;

  // بؤبؤ ناعم الحركة
  player.pupilX += (player.pupilTargetX - player.pupilX) * 0.18;
  player.pupilY += (player.pupilTargetY - player.pupilY) * 0.18;

  const mood = player.mood;

  if (mood === 'hit'){
    // X X عيون
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.13);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.05, er = R*0.22;
    ctx.beginPath();
    ctx.moveTo(-ex-er, ey-er); ctx.lineTo(-ex+er, ey+er);
    ctx.moveTo(-ex+er, ey-er); ctx.lineTo(-ex-er, ey+er);
    ctx.moveTo( ex-er, ey-er); ctx.lineTo( ex+er, ey+er);
    ctx.moveTo( ex+er, ey-er); ctx.lineTo( ex-er, ey+er);
    ctx.stroke();

    // فم زجزاج
    ctx.beginPath();
    ctx.moveTo(-R*0.28, R*0.32);
    ctx.lineTo(-R*0.14, R*0.22);
    ctx.lineTo( 0,      R*0.32);
    ctx.lineTo( R*0.14, R*0.22);
    ctx.lineTo( R*0.28, R*0.32);
    ctx.stroke();

  } else if (mood === 'happy'){
    // ^ ^ عيون
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.12);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.10, er = R*0.22;
    ctx.beginPath();
    ctx.arc(-ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc( ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();

    // ابتسامة كبيرة
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.stroke();

  } else if (mood === 'record'){
    // نجوم في العيون
    ctx.fillStyle = '#fbbf24';
    for (const dir of [-1, 1]){
      ctx.save();
      ctx.translate(dir * R*0.40, -R*0.08);
      ctx.beginPath();
      for (let i = 0; i < 10; i++){
        const a  = -Math.PI/2 + i * Math.PI/5;
        const rr = (i%2) ? R*0.10 : R*0.22;
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // ابتسامة
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.stroke();

  } else if (mood === 'focus'){
    // عيون ضيقة + بؤبؤ
    const eyeW = R*0.28, eyeH = R*0.10;
    const ex = R*0.40, ey = -R*0.06;
    ctx.fillStyle = '#fff';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(dir*ex, ey, eyeW, eyeH, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#0f172a';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.arc(dir*ex + player.pupilX*R*0.4, ey + player.pupilY*R*0.3, R*0.07, 0, TAU);
      ctx.fill();
    }
    // فم مستقيم
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.22, R*0.30);
    ctx.lineTo( R*0.22, R*0.30);
    ctx.stroke();

  } else {
    // عادي — jump/fall/idle

    // العيون البيضا
    const eyeR = R*0.30;
    const eyeX = R*0.38;
    const baseEyeY = -R*0.08;

    if (blinkingNow){
      // رمش
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = Math.max(2, R*0.10);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo(-eyeX + eyeR*0.8, baseEyeY);
      ctx.moveTo( eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo( eyeX + eyeR*0.8, baseEyeY);
      ctx.stroke();
    } else {
      // بيضا العين
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.arc( eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.fill();

      // بؤبؤ
      const pupilR = eyeR * 0.55;
      ctx.fillStyle = '#0f172a';
      for (const dir of [-1, 1]){
        ctx.beginPath();
        ctx.arc(dir*eyeX + player.pupilX*eyeR*0.5,
                baseEyeY + player.pupilY*eyeR*0.5,
                pupilR, 0, TAU);
        ctx.fill();
      }

      // لمعة صغيرة
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (const dir of [-1, 1]){
        ctx.beginPath();
        ctx.arc(dir*eyeX + player.pupilX*eyeR*0.5 - pupilR*0.35,
                baseEyeY + player.pupilY*eyeR*0.5 - pupilR*0.35,
                pupilR*0.35, 0, TAU);
        ctx.fill();
      }
    }

    // فم حسب الريأكشن
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';

    if (mood === 'jump'){
      // فم "o" صغير
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.10, R*0.13, 0, 0, TAU);
      ctx.stroke();

    } else if (mood === 'fall'){
      // فم "o" أكبر
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.14, R*0.16, 0, 0, TAU);
      ctx.stroke();

    } else {
      // ابتسامة خفيفة
      ctx.beginPath();
      if (player.grounded){
        ctx.arc(0, R*0.10, R*0.30, Math.PI*0.25, Math.PI*0.75);
      } else {
        ctx.arc(0, R*0.28, R*0.14, 0, TAU);
      }
      ctx.stroke();
    }
  }

  // خدود وردية (خفيفة)
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#fb7185';
  ctx.beginPath();
  ctx.arc(-R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.arc( R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;

    if (p.type === 'text'){
      ctx.font = '900 ' + p.size + 'px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);

    } else if (p.type === 'confetti'){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();

    } else if (p.type === 'spark'){
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, TAU); ctx.fill();

    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function render(){
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.2 && !reduceMotion) {
    ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);
  }

  drawSky();
  drawClouds();
  drawHills();
  drawGround();
  drawStars();
  drawPowerups();
  drawObstacles();
  drawParticles();
  if (state !== 'over') drawPlayer();

  ctx.restore();
}

/* ============================================================
   12) التوليد
   ============================================================ */
function spawnObstacle(){
  const r = Math.random();
  let w, h;
  if      (r < 0.42){ w = 26; h = 38; }
  else if (r < 0.78){ w = 22; h = 54; }
  else              { w = 50; h = 30; }
  obstacles.push({ x: W + 40, w, h, y: groundY - h, passed:false });
}

function spawnStarArc(){
  const startX = W + 90;
  for (const o of obstacles){
    if (o.x < startX + 130 && o.x + o.w > startX - 30) return;
  }
  const n = 3;
  const baseY = groundY - rand(95, 140);
  for (let i = 0; i < n; i++){
    stars.push({
      x: startX + i*36,
      y: baseY - Math.sin((i/(n-1)) * Math.PI) * 22,
      r: 10,
      rot: rand(0, TAU)
    });
  }
}

function spawnCloud(){
  const w = rand(60, 110);
  clouds.push({ x: W + w, y: rand(H*0.08, groundY*0.45), w, spd: rand(6, 16) });
}

function spawnPowerup(force){
  if (powerups.length >= 1 && !force) return;
  const type = Math.random() < 0.55 ? 'shield' : 'magnet';
  powerups.push({
    x: W + 60,
    y: groundY - rand(100, 160),
    r: 15,
    type,
    bob: Math.random() * TAU
  });
}

/* ============================================================
   13) التحديث
   ============================================================ */
function updateAmbient(dt){
  const worldSpeed = (state === 'playing') ? speed * 60 : 70;

  hillOff1  += worldSpeed * 0.06 * dt;
  hillOff2  += worldSpeed * 0.14 * dt;
  groundOff += worldSpeed * dt;

  cloudTimer -= dt;
  if (cloudTimer <= 0){ spawnCloud(); cloudTimer = rand(2.5, 6); }

  for (let i = clouds.length-1; i >= 0; i--){
    const c = clouds[i];
    c.x -= (c.spd + worldSpeed * 0.05) * dt;
    if (c.x + c.w < -40) clouds.splice(i, 1);
  }
}

function updatePlayerMood(dt){
  // reset after timers
  if (player.moodTimer > 0){
    player.moodTimer -= dt;
    if (player.moodTimer <= 0){
      player.mood = player.grounded ? 'idle' : (player.vy < 0 ? 'jump' : 'fall');
    }
  } else {
    // default mood based on state
    if (!player.grounded){
      player.mood = player.vy < 0 ? 'jump' : 'fall';
    } else {
      player.mood = 'idle';
    }
  }

  // pupil target based on velocity (Red Ball 4 style)
  if (player.mood === 'jump'){
    player.pupilTargetX = 0.4;
    player.pupilTargetY = -0.7;
  } else if (player.mood === 'fall'){
    player.pupilTargetX = 0.4;
    player.pupilTargetY = 0.7;
  } else if (player.mood === 'focus'){
    player.pupilTargetX = 0.6;
    player.pupilTargetY = 0;
  } else {
    // idle — ينظر للأمام باتجاه الحركة
    player.pupilTargetX = 0.35;
    player.pupilTargetY = 0;
  }
}

function update(dt){
  /* ---------- فيزياء اللاعب ---------- */
  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  player.y += player.vy * dt;

  const floor = groundY - player.size;

  if (player.y >= floor){
    if (!player.grounded){
      player.squash = 0.82;
      if (!reduceMotion) shake = Math.min(shake + 2, 4);
      burstDust(player.x + player.size/2, groundY, 7);
      sfx('land');
    }
    player.y = floor;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  player.squash += (1 - player.squash) * 12 * dt;
  if (Math.abs(player.squash - 1) < 0.002) player.squash = 1;

  // coyote + jump buffer
  if (player.grounded) player.coyote = COYOTE;
  else player.coyote = Math.max(0, player.coyote - dt);

  player.jumpBuf = Math.max(0, player.jumpBuf - dt);

  // تحديث الريأكشن
  updatePlayerMood(dt);

  /* ---------- النقاط والصعوبة ---------- */
  score += dt * 12;
  const shown = Math.floor(score);
  if (shown !== lastShown){ lastShown = shown; scoreEl.textContent = shown; }

  speed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.02);

  /* ---------- محطات ---------- */
  const ms = Math.floor(score / 100);
  if (ms > milestone){
    milestone = ms;
    showToast(pick(MILESTONES));
    sfx('milestone');
    setMood('happy', 0.6);
  }

  /* ---------- توليد العقبات ---------- */
  obstacleTimer -= dt;
  if (obstacleTimer <= 0){
    spawnObstacle();
    obstacleTimer = Math.max(0.82, 1.5 - score * 0.006) * rand(0.92, 1.12);
  }

  const dx = speed * 60 * dt;

  /* ---------- حركة + تصادم العقبات ---------- */
  for (let i = obstacles.length-1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= dx;

    if (o.x + o.w < -30){ obstacles.splice(i,1); continue; }

    if (circleRect(
      player.x + player.size/2,
      player.y + player.size/2,
      player.size * 0.38,
      o.x, o.y, o.w, o.h
    )){
      if (player.shield > 0){
        player.shield = 0;
        burstSparkle(player.x + player.size/2, player.y + player.size/2, 16);
        showToast('🛡️ الحماية أنقذتك!');
        sfx('shield');
        obstacles.splice(i,1);
        setMood('happy', 0.5);
        continue;
      }
      gameOver();
      return;
    }

    if (!o.passed && o.x + o.w < player.x){
      o.passed = true;
      combo++;
      comboEl.textContent = combo;
      if (combo % 3 === 0){
        showToast('🔥 سلسلة ' + combo);
        setMood('focus', 0.4);
      }
    }
  }

  /* ---------- النجوم ---------- */
  starTimer -= dt;
  if (starTimer <= 0){ spawnStarArc(); starTimer = rand(2.4, 4.8); }

  const pcx = player.x + player.size/2;
  const pcy = player.y + player.size/2;
  const pickupR = player.size * 0.48;

  for (let i = stars.length-1; i >= 0; i--){
    const s = stars[i];
    s.x   -= dx;
    s.rot += dt * 2.2;

    if (s.x < -30){ stars.splice(i,1); continue; }

    // magnet attraction
    if (player.magnet > 0){
      const ddx = pcx - s.x;
      const ddy = pcy - s.y;
      const d = Math.hypot(ddx, ddy);
      if (d < 200 && d > 1){
        const f = 1 - d/200;
        s.x += ddx * dt * (5 + f*8);
        s.y += ddy * dt * (5 + f*8);
      }
    }

    const ddx = pcx - s.x, ddy = pcy - s.y;
    const rr  = s.r + pickupR;
    if (ddx*ddx + ddy*ddy < rr*rr){
      stars.splice(i,1);
      score += 10;
      starCount++;
      starsEl.textContent = starCount;
      combo++;
      comboEl.textContent = combo;
      burstSparkle(s.x, s.y, 8);
      spawnText(s.x, s.y - 10, '+10', '#f59e0b');
      sfx('coin');
      setMood('happy', 0.45);
    }
  }

  /* ---------- القوى (Powers) ---------- */
  powerTimer -= dt;
  if (powerTimer <= 0){
    spawnPowerup();
    powerTimer = rand(9, 13);
  }

  for (let i = powerups.length-1; i >= 0; i--){
    const p = powerups[i];
    p.x -= dx;
    p.bob += dt * 4;

    const py = p.y + Math.sin(p.bob) * 6;
    const d = Math.hypot(pcx - p.x, pcy - py);

    if (d < player.size * 0.7 + p.r){
      if (p.type === 'shield'){
        player.shield = 7;
        showToast('🛡️ حماية 7 ثواني');
        sfx('shield');
      } else {
        player.magnet = 7;
        showToast('🧲 المغناطيس شغال!');
        sfx('power');
      }
      burstSparkle(p.x, py, 14);
      powerups.splice(i,1);
      setMood('happy', 0.5);
      continue;
    }

    if (p.x < -60) powerups.splice(i,1);
  }

  /* ---------- مؤقتات القوى ---------- */
  if (player.shield > 0){
    player.shield -= dt;
    if (player.shield < 0) player.shield = 0;
    shieldChip.classList.add('show');
    shieldTime.textContent = Math.ceil(player.shield) + 'ث';
  } else {
    shieldChip.classList.remove('show');
  }

  if (player.magnet > 0){
    player.magnet -= dt;
    if (player.magnet < 0) player.magnet = 0;
    magnetChip.classList.add('show');
    magnetTime.textContent = Math.ceil(player.magnet) + 'ث';
  } else {
    magnetChip.classList.remove('show');
  }
}

/* ============================================================
   14) التحكم
   ============================================================ */
function jump(){
  if (state !== 'playing') return;
  if (player.grounded || player.coyote > 0){
    player.vy = JUMP_V;
    player.grounded = false;
    player.squash = 1.18;
    player.coyote = 0;
    player.jumpBuf = 0;
    burstDust(player.x + player.size/2, groundY, 5);
    sfx('jump');
    setMood('jump', 0.25);
  } else {
    // سجل النية للقفز القادم
    player.jumpBuf = JUMP_BUF;
  }
}

function onTap(e){
  if (e && e.preventDefault) e.preventDefault();

  if (state === 'playing'){ jump(); return; }
  if (state === 'paused'){ resumeGame(); return; }
  if (state === 'over' && performance.now() - overAt < 500) return;
  startGame();
}

canvas.addEventListener('pointerdown', onTap, { passive:false });
ovBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
    e.preventDefault();
    if (e.repeat) return;
    onTap(null);
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});

muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('nawy.muted.v5', muted ? '1' : '0'); } catch(err){}
  if (!muted) sfx('coin');
});

pauseBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (state === 'playing') pauseGame();
  else if (state === 'paused') resumeGame();
});

/* ============================================================
   15) الواجهة
   ============================================================ */
let toastTimeout = null;
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1300);
}

function showOverlay(opt){
  ovEmoji.textContent = opt.emoji;
  ovTitle.textContent = opt.title;
  ovText.innerHTML    = opt.text;
  ovBtn.textContent   = opt.btn;

  let badge = overlay.querySelector('.badge');
  if (opt.badge){
    if (!badge){
      badge = document.createElement('div');
      badge.className = 'badge';
      overlay.querySelector('.overlay-inner').appendChild(badge);
    }
    badge.textContent = opt.badge;
  } else if (badge){
    badge.remove();
  }

  overlay.classList.remove('hidden');
}

/* ============================================================
   16) دورة اللعبة
   ============================================================ */
function startGame(){
  score = 0; lastShown = -1; milestone = 0;
  starCount = 0; combo = 0;
  speed = BASE_SPEED;
  obstacleTimer = 1.1;
  starTimer = rand(1.5, 3);
  powerTimer = 3;
  shake = 0;

  obstacles.length = 0;
  stars.length = 0;
  powerups.length = 0;
  particles.length = 0;

  player.x = Math.max(46, W * 0.14);
  player.y = groundY - player.size;
  player.vy = 0;
  player.grounded = true;
  player.squash = 1;
  player.blinking = 0;
  player.blinkTimer = rand(1, 3);
  player.coyote = COYOTE;
  player.jumpBuf = 0;
  player.shield = 0;
  player.magnet = 0;
  player.mood = 'idle';
  player.moodTimer = 0;
  player.pupilX = 0; player.pupilY = 0;
  player.pupilTargetX = 0.3; player.pupilTargetY = 0;

  scoreEl.textContent = '0';
  comboEl.textContent = '0';
  starsEl.textContent = '0';
  shieldChip.classList.remove('show');
  magnetChip.classList.remove('show');

  overlay.classList.add('hidden');
  pauseBtn.textContent = 'Ⅱ';

  unlockAudio();
  state = 'playing';
  spawnPowerup(true);
}

function pauseGame(){
  if (state !== 'playing') return;
  state = 'paused';
  showOverlay({
    emoji: '⏸️',
    title: 'وقفة صغيرة',
    text : 'خد نفس... ولما تكون جاهز نكمل.',
    btn  : 'كمّل اللعب'
  });
  pauseBtn.textContent = '▶';
}

function resumeGame(){
  if (state !== 'paused') return;
  state = 'playing';
  overlay.classList.add('hidden');
  pauseBtn.textContent = 'Ⅱ';
}

function gameOver(){
  state = 'over';
  overAt = performance.now();
  score = Math.floor(score);

  if (!reduceMotion) shake = 12;
  sfx('hit');
  vibrate(80);

  setMood('hit', 5);

  burstConfetti(
    player.x + player.size/2,
    player.y + player.size/2,
    reduceMotion ? 10 : 24
  );

  let record = false;
  if (score > best){
    best = score;
    record = true;
    try { localStorage.setItem('nawy.best.v5', String(best)); } catch(e){}
    bestEl.textContent = best;
    sfx('record');
  }

  showOverlay({
    emoji: record ? '🏆' : '😵',
    title: record ? 'رقم قياسي جديد!' : 'ناوي خبط! 😅',
    text : 'نتيجتك: <b>' + score + '</b> — الأفضل: <b>' + best + '</b>',
    btn  : 'حاول تاني',
    badge: record ? 'أحسنت! 🎉' : null
  });

  if (record && !reduceMotion){
    burstConfetti(W/2, H*0.35, 28);
  }
}

/* ============================================================
   17) الحلقة الرئيسية
   ============================================================ */
let lastFrameTime = 0;

function frame(t){
  requestAnimationFrame(frame);

  if (!lastFrameTime) lastFrameTime = t;
  let dt = (t - lastFrameTime) / 1000;
  lastFrameTime = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1/30);

  if (state === 'playing') update(dt);
  updateAmbient(dt);
  updateParticles(dt);

  shake *= Math.exp(-9 * dt);
  if (shake < 0.15) shake = 0;

  render();
}

/* ============================================================
   18) الإيقاف التلقائي عند الخروج
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') pauseGame();
});

/* ============================================================
   19) التشغيل
   ============================================================ */
function init(){
  bestEl.textContent = best;
  muteBtn.textContent = muted ? '🔇' : '🔊';

  resize();

  for (let i = 0; i < 3; i++) spawnCloud();

  requestAnimationFrame(frame);
}

init();

})();
</script>
