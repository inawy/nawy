<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>العب مع ناوي</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
}

body{
  color:#152033;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

.game{
  width:100%;
  height:100dvh;
  min-height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      #ffffff 58%,
      #f8fafc 100%
    );
}

/* =========================
   TOP BAR
========================= */

.topbar{
  width:100%;
  min-height:64px;
  padding:
    max(10px,env(safe-area-inset-top))
    max(14px,env(safe-area-inset-right))
    8px
    max(14px,env(safe-area-inset-left));

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.logo{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:22px;
  font-weight:900;

  background:
    linear-gradient(
      145deg,
      #1791ff,
      #0069e5
    );

  box-shadow:
    0 7px 18px rgba(0,103,223,.14),
    inset 0 1px 0 rgba(255,255,255,.45);
}

.brandText{
  line-height:1.05;
}

.brandText strong{
  display:block;
  font-size:15px;
  font-weight:950;
}

.brandText span{
  display:block;
  margin-top:3px;
  color:#8a96a5;
  font-size:10px;
  font-weight:700;
}

.stats{
  display:flex;
  align-items:center;
  gap:7px;
}

.stat{
  min-width:60px;
  height:40px;
  padding:5px 9px;

  border:1px solid #e9eef3;
  border-radius:13px;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(24,42,65,.038);

  text-align:center;
}

.stat span{
  display:block;
  color:#8b98a8;
  font-size:9px;
  font-weight:800;
  line-height:12px;
}

.stat b{
  display:block;
  color:#172235;
  font-size:15px;
  line-height:17px;
  font-weight:950;
}

.iconBtn{
  width:40px;
  height:40px;
  flex:0 0 40px;

  border:1px solid #e8edf3;
  border-radius:13px;

  background:#fff;
  color:#526174;

  box-shadow:
    0 5px 18px rgba(24,42,65,.038);

  display:grid;
  place-items:center;

  font-size:17px;

  transition:
    transform .12s ease,
    background .12s ease;
}

.iconBtn:active{
  transform:scale(.92);
  background:#f8fafc;
}

/* =========================
   GAME AREA
========================= */

.stageWrap{
  position:relative;
  flex:1;
  min-height:0;
  width:100%;
  padding:0 8px 8px;
}

.stage{
  position:relative;
  width:100%;
  height:100%;
  min-height:260px;

  overflow:hidden;
  border-radius:25px;

  background:#fff;

  /* ثابت تمامًا — بدون Border Flash */
  box-shadow:none;

  isolation:isolate;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;

  z-index:10;

  display:flex;
  align-items:center;
  justify-content:space-between;

  pointer-events:none;
}

.hudLeft,
.hudRight{
  display:flex;
  align-items:center;
  gap:7px;
}

.chip{
  min-height:30px;
  padding:6px 10px;

  border:1px solid rgba(225,232,240,.92);
  border-radius:999px;

  background:rgba(255,255,255,.86);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  box-shadow:
    0 5px 18px rgba(20,45,75,.045);

  color:#536174;
  font-size:11px;
  font-weight:800;
}

.chip strong{
  color:#172235;
}

#powerChip,
#shieldChip{
  display:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:absolute;
  inset:0;

  z-index:30;

  display:grid;
  place-items:center;

  padding:20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.26),
      rgba(255,255,255,.72)
    );

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.panel{
  width:min(420px,92%);

  padding:27px 24px 22px;

  border:1px solid rgba(224,231,239,.95);
  border-radius:28px;

  background:rgba(255,255,255,.97);

  box-shadow:
    0 25px 80px rgba(21,45,72,.11),
    0 2px 4px rgba(21,45,72,.035);

  text-align:center;
}

.panelEmoji{
  width:64px;
  height:64px;

  margin:0 auto 14px;

  border-radius:21px;

  display:grid;
  place-items:center;

  font-size:32px;

  background:
    linear-gradient(
      145deg,
      #eef7ff,
      #ffffff
    );

  box-shadow:
    inset 0 1px 0 #fff,
    0 12px 25px rgba(22,136,255,.07);
}

.panel h1{
  margin:0;

  font-size:27px;
  line-height:1.2;
  font-weight:950;
  letter-spacing:-.6px;

  color:#111c2d;
}

.panel p{
  margin:10px auto 18px;

  max-width:340px;

  color:#6c7888;

  font-size:13px;
  line-height:1.8;
  font-weight:650;
}

.powerPreview{
  display:flex;
  justify-content:center;

  gap:9px;

  margin:0 auto 19px;
}

.powerPreviewItem{
  min-width:108px;

  padding:10px 12px;

  border:1px solid #edf1f5;
  border-radius:15px;

  background:#fafcfe;

  color:#536174;

  font-size:11px;
  font-weight:850;
}

.powerPreviewItem span{
  font-size:17px;
  margin-left:4px;
}

.mainBtn{
  width:100%;
  min-height:52px;

  border-radius:16px;

  color:#fff;

  font-size:15px;
  font-weight:950;

  background:
    linear-gradient(
      135deg,
      #1489ff,
      #0069e5
    );

  box-shadow:
    0 12px 25px rgba(0,105,229,.18),
    inset 0 1px 0 rgba(255,255,255,.35);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.mainBtn:active{
  transform:
    translateY(2px)
    scale(.99);

  box-shadow:
    0 7px 15px rgba(0,105,229,.15);
}

.secondaryBtn{
  margin-top:9px;

  width:100%;
  min-height:44px;

  border-radius:14px;

  background:#f4f7fa;
  color:#526174;

  font-size:12px;
  font-weight:850;
}

/* =========================
   TOAST
========================= */

.toast{
  position:absolute;

  z-index:40;

  left:50%;
  bottom:24px;

  transform:
    translate(-50%,12px);

  opacity:0;

  pointer-events:none;

  padding:10px 15px;

  border-radius:999px;

  background:rgba(22,32,48,.91);
  color:#fff;

  box-shadow:
    0 10px 30px rgba(20,30,45,.14);

  font-size:12px;
  font-weight:850;

  white-space:nowrap;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================
   FOOTER
========================= */

.bottomHint{
  min-height:30px;

  padding:
    3px
    max(15px,env(safe-area-inset-right))
    max(8px,env(safe-area-inset-bottom))
    max(15px,env(safe-area-inset-left));

  text-align:center;

  color:#98a4b2;

  font-size:10px;
  font-weight:750;
}

/* =========================
   DESKTOP
========================= */

@media (min-width:800px){

  .stageWrap{
    padding:0 14px 10px;
  }

  .stage{
    border-radius:30px;
  }

  .topbar{
    min-height:70px;

    padding-left:20px;
    padding-right:20px;
  }

  .bottomHint{
    min-height:32px;
  }
}

@media (max-height:620px){

  .topbar{
    min-height:54px;
    padding-top:5px;
  }

  .logo{
    width:34px;
    height:34px;
    border-radius:11px;
    font-size:20px;
  }

  .brandText span{
    display:none;
  }

  .stat{
    height:35px;
    min-width:56px;
  }

  .iconBtn{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .panel{
    padding:19px;
  }

  .panelEmoji{
    width:50px;
    height:50px;
    font-size:27px;
    margin-bottom:9px;
  }

  .panel h1{
    font-size:23px;
  }

  .panel p{
    margin:7px auto 12px;
  }

  .powerPreview{
    margin-bottom:12px;
  }

  .mainBtn{
    min-height:45px;
  }
}
</style>
</head>

<body>

<main class="game">

  <header class="topbar">

    <div class="brand">
      <div class="logo">ن</div>

      <div class="brandText">
        <strong>ناوي</strong>
        <span>العب وارفع رقمك</span>
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <span>النقاط</span>
        <b id="score">0</b>
      </div>

      <div class="stat">
        <span>أفضل</span>
        <b id="best">0</b>
      </div>

      <button
        class="iconBtn"
        id="muteBtn"
        type="button"
        aria-label="الصوت"
      >🔊</button>

      <button
        class="iconBtn"
        id="pauseBtn"
        type="button"
        aria-label="إيقاف مؤقت"
      >Ⅱ</button>

    </div>

  </header>

  <section class="stageWrap">

    <div class="stage">

      <canvas id="gameCanvas"></canvas>

      <div class="hud">

        <div class="hudLeft">

          <div class="chip" id="powerChip"></div>
          <div class="chip" id="shieldChip"></div>

        </div>

        <div class="hudRight">

          <div class="chip">
            ⭐ <strong id="stars">0</strong>
          </div>

        </div>

      </div>

      <div class="overlay" id="overlay">

        <div class="panel">

          <div class="panelEmoji" id="panelEmoji">🏃</div>

          <h1 id="panelTitle">
            ناوي جاهز؟
          </h1>

          <p id="panelText">
            اقفز فوق العقبات، اجمع النجوم،
            وحاول تكسر أفضل نتيجة ليك.
          </p>

          <div class="powerPreview">

            <div class="powerPreviewItem">
              <span>🛡️</span>
              حماية
            </div>

            <div class="powerPreviewItem">
              <span>🧲</span>
              مغناطيس
            </div>

          </div>

          <button
            class="mainBtn"
            id="mainBtn"
            type="button"
          >
            يلا نبدأ
          </button>

          <button
            class="secondaryBtn"
            id="shareBtn"
            type="button"
            hidden
          >
            📤 شارك نتيجتك
          </button>

        </div>

      </div>

      <div class="toast" id="toast"></div>

    </div>

  </section>

  <div class="bottomHint">
    لمس الشاشة أو Space للقفز
  </div>

</main>


<script>
"use strict";

/* =========================================================
   NAWY RUNNER
   Premium + Simple + Offline
========================================================= */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d",{alpha:false});

const stage =
  document.querySelector(".stage");

const scoreEl =
  document.getElementById("score");

const bestEl =
  document.getElementById("best");

const starsEl =
  document.getElementById("stars");

const powerChip =
  document.getElementById("powerChip");

const shieldChip =
  document.getElementById("shieldChip");

const overlay =
  document.getElementById("overlay");

const panelEmoji =
  document.getElementById("panelEmoji");

const panelTitle =
  document.getElementById("panelTitle");

const panelText =
  document.getElementById("panelText");

const mainBtn =
  document.getElementById("mainBtn");

const shareBtn =
  document.getElementById("shareBtn");

const pauseBtn =
  document.getElementById("pauseBtn");

const muteBtn =
  document.getElementById("muteBtn");

const toast =
  document.getElementById("toast");


/* =========================================================
   STORAGE
========================================================= */

const BEST_KEY =
  "nawy_runner_best_v3";

const SOUND_KEY =
  "nawy_runner_sound_v3";

function loadNumber(key,fallback=0){

  try{

    const value =
      Number(localStorage.getItem(key));

    return Number.isFinite(value)
      ? value
      : fallback;

  }catch{

    return fallback;
  }
}

function saveNumber(key,value){

  try{
    localStorage.setItem(
      key,
      String(value)
    );
  }catch{}
}


/* =========================================================
   GAME STATE
========================================================= */

let W = 800;
let H = 500;
let DPR = 1;

let state = "ready";

let score = 0;
let best =
  loadNumber(BEST_KEY,0);

let starCount = 0;

let muted =
  loadNumber(SOUND_KEY,0) === 1;

let worldSpeed = 5.3;
let targetSpeed = 5.3;

let obstacleTimer = 1.55;
let starTimer = 1.15;
let powerTimer = 4.2;

let elapsed = 0;
let lastTime = 0;

let coyoteTime = 0;
let jumpBuffer = 0;

let shake = 0;

let toastTimer = 0;

let milestone = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:0,
  y:0,

  r:21,

  vy:0,

  grounded:true,

  shield:0,
  magnet:0,

  squash:1,
  rotation:0,

  blink:0,
  blinkTimer:2.5,

  expression:"happy"
};

const GRAVITY = 2480;
const JUMP_VELOCITY = -850;


/* =========================================================
   WORLD OBJECTS
========================================================= */

const obstacles = [];
const stars = [];
const powerups = [];
const particles = [];

let clouds = [];


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,min,max){
  return Math.max(
    min,
    Math.min(max,v)
  );
}

function rand(min,max){
  return min+
    Math.random()*
    (max-min);
}

function pick(arr){
  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];
}

function roundRectPath(
  ctx,
  x,y,w,h,r
){

  r=Math.min(
    r,
    w/2,
    h/2
  );

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(
    x+r,y+h
  );

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}

function rectsOverlap(a,b){

  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}


/* =========================================================
   RESIZE
========================================================= */

function floorY(){
  return H*.78;
}

function resize(){

  const rect =
    stage.getBoundingClientRect();

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    Math.max(
      320,
      rect.width
    );

  H =
    Math.max(
      260,
      rect.height
    );

  canvas.width =
    Math.floor(W*DPR);

  canvas.height =
    Math.floor(H*DPR);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  player.x =
    Math.max(
      68,
      W*.18
    );

  if(state!=="playing"){
    player.y =
      floorY()-player.r;
  }

  createClouds();
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   WORLD SPEED
========================================================= */

function getWorldSpeed(){

  const progress =
    clamp(
      score/1200,
      0,
      1
    );

  /*
    من 5.3 إلى 8.2
    تدريجيًا جدًا.
  */

  return (
    5.3+
    progress*2.9
  );
}


/* =========================================================
   BACKGROUND
========================================================= */

function createClouds(){

  clouds=[];

  const count =
    Math.max(
      4,
      Math.floor(W/190)
    );

  for(let i=0;i<count;i++){

    clouds.push({

      x:Math.random()*W,

      y:rand(
        H*.12,
        H*.34
      ),

      w:rand(
        70,
        135
      ),

      speed:rand(
        .10,
        .22
      ),

      alpha:rand(
        .32,
        .58
      )
    });
  }
}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

  score=0;
  starCount=0;

  elapsed=0;

  worldSpeed=5.3;
  targetSpeed=5.3;

  obstacleTimer=1.35;
  starTimer=.95;
  powerTimer=3.2;

  milestone=0;

  coyoteTime=0;
  jumpBuffer=0;

  shake=0;

  obstacles.length=0;
  stars.length=0;
  powerups.length=0;
  particles.length=0;

  player.shield=0;
  player.magnet=0;

  player.vy=0;
  player.grounded=true;

  player.squash=1;
  player.rotation=0;

  player.blink=0;
  player.blinkTimer=rand(
    2.5,
    5
  );

  player.expression="happy";

  player.x =
    Math.max(
      68,
      W*.18
    );

  player.y =
    floorY()-player.r;

  updateUI();
}


/* =========================================================
   START
========================================================= */

function startGame(){

  resetGame();

  state="playing";

  overlay.style.display="none";

  playSound("start");

  /*
    أول تعزيز يظهر بدري
    عشان اللاعب يشوف الميكانيزم.
  */

  spawnPowerup(true);

  /*
    أول نجوم تظهر بسرعة.
  */

  spawnStarArc();

  lastTime =
    performance.now();
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

  if(state!=="playing")
    return;

  state="paused";

  overlay.style.display="grid";

  panelEmoji.textContent="⏸️";

  panelTitle.textContent=
    "وقفة صغيرة";

  panelText.innerHTML=
    "خد نفس... ولما تكون جاهز نكمل من نفس المكان.";

  mainBtn.textContent=
    "كمّل اللعب";

  shareBtn.hidden=true;

  pauseBtn.textContent="▶";
}

function resumeGame(){

  if(state!=="paused")
    return;

  state="playing";

  overlay.style.display="none";

  pauseBtn.textContent="Ⅱ";

  lastTime =
    performance.now();
}


/* =========================================================
   INPUT
========================================================= */

function requestJump(){

  if(state!=="playing")
    return;

  jumpBuffer=.13;

  tryJump();
}

function tryJump(){

  if(state!=="playing")
    return;

  const canJump =
    player.grounded ||
    coyoteTime>0 ||
    player.y>=
    floorY()-player.r-2;

  if(!canJump)
    return;

  player.vy=
    JUMP_VELOCITY;

  player.grounded=false;

  coyoteTime=0;
  jumpBuffer=0;

  player.squash=.80;

  player.expression="excited";

  burst(
    player.x,
    player.y+player.r-2,
    5,
    "dust"
  );

  playSound("jump");
}

function handleTap(e){

  if(e)
    e.preventDefault();

  if(state==="playing"){

    requestJump();

    return;
  }

  if(state==="paused"){

    resumeGame();

    return;
  }

  if(
    state==="ready" ||
    state==="over"
  ){

    startGame();
  }
}

canvas.addEventListener(
  "pointerdown",
  handleTap,
  {passive:false}
);

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="Space" ||
      e.code==="ArrowUp" ||
      e.code==="KeyW"
    ){

      e.preventDefault();

      requestJump();
    }

    if(
      e.code==="KeyP" ||
      e.code==="Escape"
    ){

      if(state==="playing")
        pauseGame();

      else if(state==="paused")
        resumeGame();
    }
  }
);

mainBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    if(state==="paused")
      resumeGame();

    else
      startGame();
  }
);

pauseBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    if(state==="playing")
      pauseGame();

    else if(state==="paused")
      resumeGame();
  }
);

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function getAudio(){

  if(muted)
    return null;

  try{

    if(!audioCtx){

      const AC =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AC)
        return null;

      audioCtx=new AC();
    }

    if(
      audioCtx.state==="suspended"
    ){
      audioCtx.resume();
    }

    return audioCtx;

  }catch{

    return null;
  }
}

function tone(
  freq,
  duration,
  type="sine",
  volume=.03
){

  const ac=getAudio();

  if(!ac)
    return;

  const osc=
    ac.createOscillator();

  const gain=
    ac.createGain();

  osc.type=type;

  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    volume,
    ac.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ac.currentTime+duration
  );

  osc.connect(gain);

  gain.connect(
    ac.destination
  );

  osc.start();

  osc.stop(
    ac.currentTime+duration
  );
}

function playSound(name){

  if(muted)

/* =========================================================
   STARS
========================================================= */

function spawnStarArc(){

  const base=floorY();

  const startX=W+70;

  const high =
    Math.random()<.55;

  const y=
    high
      ? base-rand(125,175)
      : base-rand(65,105);

  const count =
    Math.random()<.5
      ? 3
      : 4;

  for(let i=0;i<count;i++){

    stars.push({

      x:
        startX+
        i*34,

      y:
        y-
        Math.sin(
          (i/(count-1))*
          Math.PI
        )*17,

      r:8,

      rotation:
        Math.random()*
        Math.PI
    });
  }
}


/* =========================================================
   POWERUPS
========================================================= */

function spawnPowerup(force=false){

  if(
    !force &&
    powerups.length>=1
  )
    return;

  const type =
    Math.random()<.55
      ? "shield"
      : "magnet";

  powerups.push({

    x:W+70,

    y:

      rand(105,160),

    r:15,

    type,

    bob:
      Math.random()*

  });
}


/* =========================================================
   PARTICLES
========================================================= */

function burst(
  x,
  y,
  count=8,
  type="normal"
){

  for(let i=0;i<count;i++){

    const angle =
      Math.random()*
      Math.PI*2;

    const speed =
      type==="dust"
        ? rand(25,75)
        : rand(50,160);

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:rand(.24,.52),

      maxLife:.52,

      size:
        type==="dust"
          ? rand(2,4.5)
          : rand(2,3.8),

      type
    });
  }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(state!=="playing")
    return;

  elapsed+=dt;

  targetSpeed=
    getWorldSpeed();

  worldSpeed +=
    (targetSpeed-worldSpeed)*
    Math.min(
      1,
      dt*2.8
    );

  score+=dt*12;

  if(
    score>=
    milestone+100
  ){

    milestone+=100;

    showToast(
      pick([
        "برافو يا ناوي! 🔥",
        "كمّل يا بطل!",
        "عينك على الرقم القياسي 👀",
        "ناوي مكمل!",
        "جامد جدًا 👏",
        "ولا غلطة!"
      ])
    );
  }

  updatePlayer(dt);

  updateObstacles(dt);

  updateStars(dt);

  updatePowerups(dt);

  updateParticles(dt);

  obstacleTimer-=dt;
  starTimer-=dt;
  powerTimer-=dt;

  if(obstacleTimer<=0){

    spawnObstacle();

    const difficulty=
      clamp(
        score/1200,
        0,
        1
      );

    /*
      يفضل وقت رد فعل جيد.
    */

    const reaction=
      1.18-
      difficulty*.16;

    obstacleTimer=
      reaction+
      rand(.18,.34);
  }

  if(starTimer<=0){

    spawnStarArc();

    starTimer=
      rand(
        2.25,
        3.25
      );
  }

  if(powerTimer<=0){

    spawnPowerup();

    powerTimer=
      rand(
        9,
        13
      );
  }

  updateUI();
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

  const floor=
    floorY();

  if(!player.grounded){

    coyoteTime-=dt;

  }else{

    coyoteTime=.10;
  }

  if(jumpBuffer>0){

    jumpBuffer-=dt;

    if(
      player.grounded ||
      coyoteTime>0
    ){

      tryJump();
    }
  }

  player.vy+=
    GRAVITY*dt;

  player.vy=
    Math.min(
      player.vy,
      1900
    );

  player.y+=
    player.vy*dt;

  if(
    player.y+
    player.r>=
    floor
  ){

    player.y=
      floor-
      player.r;

    if(player.vy>0){

      player.vy=0;

      if(!player.grounded){

        player.squash=.82;

        player.expression=
          "happy";

        burst(
          player.x,
          floor-2,
          5,
          "dust"
        );
      }

      player.grounded=true;

      coyoteTime=.10;

      if(jumpBuffer>0){

        tryJump();
      }
    }
  }

  player.squash +=
    (1-player.squash)*
    Math.min(
      1,
      dt*10
    );

  if(!player.grounded){

    player.rotation=
      clamp(
        player.vy/1850,
        -.28,
        .30
      );

    player.expression=
      "excited";

  }else{

    player.rotation *=
      Math.max(
        0,
        1-dt*8
      );

    if(
      player.expression!=="happy"
    ){

      player.expression=
        "happy";
    }
  }

  if(player.shield>0){

    player.shield-=dt;
  }

  if(player.magnet>0){

    player.magnet-=dt;
  }

  updateBlink(dt);
}


/* =========================================================
   BLINK
========================================================= */

function updateBlink(dt){

  player.blinkTimer-=dt;

  if(
    player.blinkTimer<=0 &&
    player.blink<=0
  ){

    player.blink=.11;

    player.blinkTimer=
      rand(
        2.8,
        5.5
      );
  }

  if(player.blink>0){

    player.blink-=dt;
  }
}


/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function updateObstacles(dt){

  const dx=
    worldSpeed*
    60*
    dt;

  /*
    Hitbox أصغر من الشكل.
    بصريًا العقبة تبدو طبيعية،
    لكن اللعبة مش ظالمة.
  */

  const playerBox={

    x:
      player.x-
      player.r*.56,

    y:
      player.y-
      player.r*.78,

    w:
      player.r*1.12,

    h:
      player.r*1.48
  };

  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    const o=
      obstacles[i];

    o.x-=dx;

    const hitbox={

      x:o.x+5,
      y:o.y+5,

      w:
        Math.max(
          1,
          o.w-10
        ),

      h:
        Math.max(
          1,
          o.h-6
        )
    };

    if(
      rectsOverlap(
        playerBox,
        hitbox
      )
    ){

      if(
        player.shield>0
      ){

        player.shield=0;

        player.expression=
          "happy";

        shake=.10;

        burst(
          player.x,
          player.y,
          14,
          "shield"
        );

        showToast(
          "🛡️ الحماية أنقذتك!"
        );

        playSound(
          "shield"
        );

        obstacles.splice(
          i,
          1
        );

        continue;

      }else{

        player.expression=
          "surprised";

        playSound("hit");

        burst(
          player.x,
          player.y,
          16,
          "hit"
        );

        gameOver();

        return;
      }
    }

    if(
      o.x+o.w<
      player.x
    ){

      o.passed=true;
    }

    if(
      o.x+o.w<
      -80
    ){

      obstacles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   STARS UPDATE
========================================================= */

function updateStars(dt){

  const dx=
    worldSpeed*
    60*
    dt;

  const px=
    player.x;

  const py=
    player.y;

  for(
    let i=stars.length-1;
    i>=0;
    i--
  ){

    const s=
      stars[i];

    s.x-=dx;

    s.rotation+=
      dt*4;

    if(
      player.magnet>0
    ){

      const ax=
        px-s.x;

      const ay=
        py-s.y;

      const dist=
        Math.hypot(
          ax,
          ay
        );

      if(
        dist<210 &&
        dist>1
      ){

        const pull=
          1-dist/210;

        s.x+=
          ax*
          dt*
          (4+pull*8);

        s.y+=
          ay*
          dt*
          (4+pull*8);
      }
    }

    const dist=
      Math.hypot(
        px-s.x,
        py-s.y
      );

    if(
      dist<
      player.r+
      s.r+
      7
    ){

      collectStar();

      stars.splice(
        i,
        1
      );

      continue;
    }

    if(
      s.x<
      -50
    ){

      stars.splice(
        i,
        1
      );
    }
  }
}

function collectStar(){

  starCount++;

  burst(
    player.x,
    player.y,
    8,
    "star"
  );

  playSound("star");

  if(
    starCount%5===0
  ){

    showToast(
      pick([
        "⭐ عاش يا ناوي!",
        "⭐ تجميع ممتاز!",
        "⭐ كمل يا بطل!",
        "⭐ عينك على الرقم!"
      ])
    );
  }
}


/* =========================================================
   POWERUPS UPDATE
========================================================= */

function updatePowerups(dt){

  const dx=
    worldSpeed*
    60*
    dt;

  for(
    let i=powerups.length-1;
    i>=0;
    i--
  ){

    const p=
      powerups[i];

    p.x-=dx;

    p.bob+=
      dt*4;

    const py=
      p.y+
      Math.sin(
        p.bob
      )*6;

    const dist=
      Math.hypot(
        player.x-p.x,
        player.y-py
      );

    if(
      dist<
      player.r+
      p.r+
      5
    ){

      if(
        p.type==="shield"
      ){

        player.shield=7;

        showToast(
          "🛡️ حماية شغالة!"
        );

      }else{

        player.magnet=7;

        showToast(
          "🧲 المغناطيس شغال!"
        );
      }

      burst(
        p.x,
        py,
        14,
        "power"
      );

      playSound("power");

      powerups.splice(
        i,
        1
      );

      continue;
    }

    if(
      p.x<
      -60
    ){

      powerups.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   PARTICLES UPDATE
========================================================= */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.life-=dt;

    if(
      p.life<=0
    ){

      particles.splice(
        i,
        1
      );

      continue;
    }

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      p.type==="dust"
        ? 100*dt
        : 280*dt;

    p.vx*=
      Math.pow(
        .08,
        dt
      );
  }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.save();

  if(shake>0){

    const amount=
      shake*8;

    ctx.translate(
      rand(
        -amount,
        amount
      ),
      rand(
        -amount,
        amount
      )
    );

    shake*=.86;

    if(shake<.01)
      shake=0;
  }

  drawSky();
  drawClouds();
  drawLandscape();
  drawGround();

  drawStars();
  drawPowerups();
  drawObstacles();
  drawParticles();
  drawPlayer();

  ctx.restore();
}


/* =========================================================
   SKY
========================================================= */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  g.addColorStop(
    0,
    "#f6fbff"
  );

  g.addColorStop(
    .55,
    "#ffffff"
  );

  g.addColorStop(
    1,
    "#f7fafc"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    شمس ناعمة.
  */

  const sunX=
    W*.83;

  const sunY=
    H*.19;

  const glow=
    ctx.createRadialGradient(
      sunX,
      sunY,
      0,
      sunX,
      sunY,
      95
    );

  glow.addColorStop(
    0,
    "rgba(255,216,94,.30)"
  );

  glow.addColorStop(
    1,
    "rgba(255,216,94,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    sunX-100,
    sunY-100,
    200,
    200
  );

  ctx.fillStyle="#ffd96d";

  ctx.beginPath();

  ctx.arc(
    sunX,
    sunY,
    21,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   CLOUDS
========================================================= */

function drawClouds(){

  for(
    const c of clouds
  ){

    c.x-=
      c.speed*
      worldSpeed*
      .34;

    if(
      c.x+c.w<
      -30
    ){

      c.x=
        W+40;
    }

    ctx.save();

    ctx.globalAlpha=
      c.alpha;

    ctx.fillStyle=
      "#ffffff";

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      c.w*.18,
      0,
      Math.PI*2
    );

    ctx.arc(
      c.x+c.w*.22,
      c.y-8,
      c.w*.25,
      0,
      Math.PI*2
    );

    ctx.arc(
      c.x+c.w*.46,
      c.y,
      c.w*.20,
      0,
      Math.PI*2
    );

    roundRectPath(
      ctx,
      c.x-c.w*.02,
      c.y,
      c.w*.48,
      c.w*.17,
      10
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   LANDSCAPE
========================================================= */

function drawLandscape(){

  const horizon=
    floorY();

  ctx.fillStyle=
    "#edf4f7";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+18
  );

  for(
    let x=0;
    x<=W+260;
    x+=100
  ){

    const y=
      horizon-
      42-
      Math.sin(
        x*.008
      )*18;

    ctx.quadraticCurveTo(
      x+50,
      y-28,
      x+100,
      horizon+18
    );
  }

  ctx.lineTo(
    W,
    H
  );

  ctx.lineTo(
    0,
    H
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle=
    "#f5f8fa";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+28
  );

  for(
    let x=0;
    x<=W+300;
    x+=120
  ){

    const y=
      horizon-
      18-
      Math.sin(
        x*.012+1
      )*11;

    ctx.quadraticCurveTo(
      x+60,
      y-17,
      x+120,
      horizon+28
    );
  }

  ctx.lineTo(
    W,
    H
  );

  ctx.lineTo(
    0,
    H
  );

  ctx.closePath();

  ctx.fill();
}


/* =========================================================
   GROUND
========================================================= */

function drawGround(){

  const y=
    floorY();

  ctx.fillStyle=
    "#edf2f5";

  ctx.fillRect(
    0,
    y,
    W,
    H-y
  );

  ctx.fillStyle=
    "#dbe3e9";

  ctx.fillRect(
    0,
    y,
    W,
    2
  );

  const offset=
    (
      elapsed*
      worldSpeed*
      45
    )%44;

  ctx.fillStyle=
    "#dfe6eb";

  for(
    let x=-60-offset;
    x<W+70;
    x+=44
  ){

    ctx.fillRect(
      x,
      y+20,
      15,
      2
    );
  }
}


/* =========================================================
   STARS DRAW
========================================================= */

function drawStars(){

  for(
    const s of stars
  ){

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      s.rotation
    );

    ctx.fillStyle=
      "#ffc928";

    ctx.beginPath();

    for(
      let i=0;
      i<10;
      i++
    ){

      const a=
        -Math.PI/2+
        i*Math.PI/5;

      const r=
        i%2===0
          ? s.r
          : s.r*.42;

      const x=
        Math.cos(a)*r;

      const y=
        Math.sin(a)*r;

      if(i===0)
        ctx.moveTo(x,y);

      else
        ctx.lineTo(x,y);
    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   POWERUPS DRAW
========================================================= */

function drawPowerups(){

  for(
    const p of powerups
  ){

    const y=
      p.y+
      Math.sin(
        p.bob
      )*6;

    ctx.save();

    ctx.shadowBlur=14;

    ctx.shadowColor=
      p.type==="shield"
        ? "rgba(49,154,255,.17)"
        : "rgba(241,184,47,.17)";

    ctx.fillStyle=
      "#ffffff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      y,
      p.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.lineWidth=2;

    ctx.strokeStyle=
      p.type==="shield"
        ? "#5bacff"
        : "#efba3b";

    ctx.stroke();

    ctx.font=
      "15px system-ui";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      p.type==="shield"
        ? "🛡️"
        : "🧲",
      p.x,
      y+1
    );

    ctx.restore();
  }
}


/* =========================================================
   OBSTACLES DRAW
========================================================= */

function drawObstacles(){

  for(
    const o of obstacles
  ){

    ctx.save();

    /*
      ظل بسيط.
    */

    ctx.fillStyle=
      "rgba(27,39,52,.08)";

    ctx.beginPath();

    ctx.ellipse(
      o.x+
      o.w/2,
      floorY()+3,
      o.w*.75,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    /*
      الجسم.
    */

    const g=
      ctx.createLinearGradient(
        o.x,
        o.y,
        o.x,
        o.y+o.h
      );

    g.addColorStop(
      0,
      "#455365"
    );

    g.addColorStop(
      1,
      "#2c3746"
    );

    ctx.fillStyle=g;

    roundRectPath(
      ctx,
      o.x,
      o.y,
      o.w,
      o.h,
      7
    );

    ctx.fill();

    /*
      highlight.
    */

    ctx.fillStyle=
      "rgba(255,255,255,.13)";

    roundRectPath(
      ctx,
      o.x+4,
      o.y+4,
      Math.max(
        4,
        o.w-8
      ),
      4,
      2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

  for(
    const p of particles
  ){

    const alpha=
      clamp(
        p.life/
        p.maxLife,
        0,
        1
      );

    ctx.save();

    ctx.globalAlpha=
      alpha;

    if(
      p.type==="dust"
    )
      ctx.fillStyle=
        "#b7c2cc";

    else if(
      p.type==="shield"
    )
      ctx.fillStyle=
        "#5eafff";

    else if(
      p.type==="star"
    )
      ctx.fillStyle=
        "#ffc928";

    else
      ctx.fillStyle=
        "#82c2ff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   NAWY CHARACTER
========================================================= */

function drawPlayer(){

  const x=
    player.x;

  const y=
    player.y;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    player.rotation
  );

  /*
    shadow
  */

  ctx.save();

  ctx.translate(
    0,
    player.r+6
  );

  ctx.scale(
    player.grounded
      ? 1
      : .70,
    .25
  );

  ctx.fillStyle=
    "rgba(25,40,60,.12)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    player.r*1.14,
    player.r*.52,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    Shield
  */

  if(
    player.shield>0
  ){

    const pulse=
      1+
      Math.sin(
        elapsed*7
      )*.035;

    ctx.save();

    ctx.scale(
      pulse,
      pulse
    );

    ctx.strokeStyle=
      "rgba(54,158,255,.46)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      player.r+8,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }

  /*
    Body
  */

  ctx.scale(
    1/player.squash,
    player.squash
  );

  const body=
    ctx.createLinearGradient(
      -player.r,
      -player.r,
      player.r,
      player.r
    );

  body.addColorStop(
    0,
    "#1b94ff"
  );

  body.addColorStop(
    .55,
    "#0a7cf0"
  );

  body.addColorStop(
    1,
    "#0065da"
  );

  ctx.fillStyle=
    body;

  ctx.shadowColor=
    "rgba(0,105,229,.16)";

  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    player.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    subtle inner shine
  */

  const shine=
    ctx.createRadialGradient(
      -7,
      -8,
      1,
      -7,
      -8,
      16
    );

  shine.addColorStop(
    0,
    "rgba(255,255,255,.28)"
  );

  shine.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=
    shine;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    player.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Face
  */

  drawNawyFace();

  ctx.restore();
}


/* =========================================================
   NAWY FACE
========================================================= */

function drawNawyFace(){

  const blink=
    player.blink>0;

  let eyeOpen=
    1;

  if(blink)
    eyeOpen=.16;

  /*
    Jump/excited:
    عين أوسع شوية.
  */

  if(
    player.expression==="excited"
  ){

    eyeOpen=
      blink
        ? .16
        : 1.08;
  }

  if(
    player.expression==="surprised"
  ){

    eyeOpen=
      blink
        ? .16
        : 1.22;
  }

  /*
    Eye whites
  */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.ellipse(
    -7,
    -5,
    4.5,
    5.3*eyeOpen,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    7,
    -5,
    4.5,
    5.3*eyeOpen,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Pupils
  */

  ctx.fillStyle=
    "#236fbd";

  const lookY=
    player.grounded
      ? -4.6
      : -5.3;

  ctx.beginPath();

  ctx.arc(
    -7,
    lookY,
    2.15,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    7,
    lookY,
    2.15,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Eye shine
  */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    -7.7,
    -5.8,
    .8,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    6.3,
    -5.8,
    .8,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Brows for surprise
  */

  if(
    player.expression==="surprised"
  ){

    ctx.strokeStyle=
      "rgba(255,255,255,.9)";

    ctx.lineWidth=1.7;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      -11,
      -11
    );

    ctx.lineTo(
      -4,
      -12.5
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      4,
      -12.5
    );

    ctx.lineTo(
      11,
      -11
    );

    ctx.stroke();
  }

  /*
    Smile — no teeth.
    This is intentionally small,
    soft and friendly.
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.96)";

  ctx.lineWidth=2.5;

  ctx.lineCap="round";

  ctx.beginPath();

  if(
    player.expression==="surprised"
  ){

    /*
      Small rounded "O"
      instead of scary impact face.
    */

    ctx.arc(
      0,
      5,
      3.5,
      0,
      Math.PI*2
    );

  }else if(
    player.expression==="excited"
  ){

    ctx.arc(
      0,
      1.5,
      7,
      .16*Math.PI,
      .84*Math.PI
    );

  }else{

    /*
      Signature Nawy smile.
    */

    ctx.arc(
      0,
      2,
      7,
      .18*Math.PI,
      .82*Math.PI
    );
  }

  ctx.stroke();

  /*
    Tiny "ن" mark integrated subtly.
    Not a giant letter on his face.
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.22)";

  ctx.lineWidth=1.3;

  ctx.beginPath();

  ctx.moveTo(
    -5,
    11
  );

  ctx.quadraticCurveTo(
    0,
    13,
    5,
    11
  );

  ctx.stroke();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  scoreEl.textContent=
    Math.floor(score);

  bestEl.textContent=
    Math.max(
      best,
      Math.floor(score)
    );

  starsEl.textContent=
    starCount;

  if(
    player.magnet>0
  ){

    powerChip.style.display=
      "block";

    powerChip.innerHTML=
      "🧲 مغناطيس <strong>"+
      Math.ceil(
        player.magnet
      )+
      "ث</strong>";

  }else{

    powerChip.style.display=
      "none";
  }

  if(
    player.shield>0
  ){

    shieldChip.style.display=
      "block";

    shieldChip.innerHTML=
      "🛡️ حماية <strong>"+
      Math.ceil(
        player.shield
      )+
      "ث</strong>";

  }else{

    shieldChip.style.display=
      "none";
  }
}


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent=
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1300
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  state="over";

  const finalScore=
    Math.floor(score);

  const isRecord=
    finalScore>best;

  if(isRecord){

    best=
      finalScore;

    saveNumber(
      BEST_KEY,
      best
    );

    playSound(
      "record"
    );

    burst(
      player.x,
      player.y,
      26,
      "star"
    );

  }

  updateUI();

  overlay.style.display=
    "grid";

  if(isRecord){

    panelEmoji.textContent=
      "🏆";

    panelTitle.textContent=
      "رقمك الجديد!";

    panelText.innerHTML=
      "حققت <b>"+
      finalScore+
      "</b> نقطة!<br>"+
      "كده عندك أفضل نتيجة جديدة. 🔥";

  }else{

    panelEmoji.textContent=
      "😄";

    panelTitle.textContent=
      "جولة حلوة!";

    panelText.innerHTML=
      "حققت <b>"+
      finalScore+
      "</b> نقطة<br>"+
      "أفضل نتيجة: <b>"+
      best+
      "</b><br>"+
      "جاهز تكسرها؟";
  }

  mainBtn.textContent=
    "يلا تاني";

  shareBtn.hidden=
    false;

  pauseBtn.textContent=
    "Ⅱ";
}


/* =========================================================
   SHARE
========================================================= */

async function shareScore(){

  const text=
    "حققت "+
    Math.floor(score)+
    " نقطة في لعبة ناوي! 🔥\n"+
    "هل تقدر تكسر رقمي؟";

  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:"العب مع ناوي",
        text
      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "📋 تم نسخ النتيجة"
      );

    }catch{

      showToast(
        "نتيجتي: "+
        Math.floor(score)+
        " نقطة 🔥"
      );
    }
  }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  if(!lastTime)
    lastTime=now;

  let dt=
    (now-lastTime)/1000;

  lastTime=now;

  /*
    يمنع انفجار الفيزياء
    عند الرجوع من الخلفية.
  */

  dt=
    clamp(
      dt,
      0,
      .033
    );

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}


/* =========================================================
   READY SCREEN
========================================================= */

function showReady(){

  state="ready";

  overlay.style.display=
    "grid";

  panelEmoji.textContent=
    "🏃";

  panelTitle.textContent=
    "ناوي جاهز؟";

  panelText.innerHTML=
    "اقفز فوق العقبات، اجمع النجوم،<br>"+
    "وحاول تكسر <b>أفضل نتيجة</b> ليك.";

  mainBtn.textContent=
    "يلا نبدأ";

  shareBtn.hidden=
    true;

  pauseBtn.textContent=
    "Ⅱ";

  updateUI();
}


/* =========================================================
   INIT
========================================================= */

resize();

resetGame();

showReady();

requestAnimationFrame(
  loop
);
</script>
