<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>العب مع ناوي 🎮</title>
<style>
  :root{
    --ink:#0f172a;
    --ink-muted:#64748b;
    --card-bg:rgba(255,255,255,.9);
    --card-border:#e8edf3;
    --btn-ink:#526174;
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0b1220;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
    position:fixed;inset:0;
  }
  .game{position:fixed;inset:0;overflow:hidden;}
  .stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;}
  canvas{width:100%;height:100%;display:block;touch-action:none;}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:50;
    padding:max(10px,env(safe-area-inset-top))
            max(14px,env(safe-area-inset-right))
            10px
            max(14px,env(safe-area-inset-left));
    display:flex;align-items:center;gap:10px;
    pointer-events:none;transition:color .4s ease;
  }
  .brand,.stats{pointer-events:auto;}
  .brand{
    font-size:17px;font-weight:900;white-space:nowrap;letter-spacing:-.3px;
    color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.06);
    transition:color .6s ease;
  }
  .brand em{font-style:normal;color:#2563eb;}
  .stats{margin-inline-start:auto;display:flex;gap:7px;align-items:center;white-space:nowrap;}
  .stat{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:52px;height:40px;padding:3px 9px;
    border:1px solid var(--card-border);border-radius:12px;
    background:var(--card-bg);
    box-shadow:0 4px 14px rgba(24,42,65,.06);
    line-height:1;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:background .6s ease,border-color .6s ease;
  }
  .stat span{font-size:9px;color:var(--ink-muted);font-weight:800;margin-bottom:2px;}
  .stat b{font-size:15px;color:var(--ink);font-weight:900;font-variant-numeric:tabular-nums;transition:color .6s ease;}
  .icon-btn{
    border:1px solid var(--card-border);background:var(--card-bg);
    font-size:16px;line-height:1;width:40px;height:40px;flex:0 0 40px;
    border-radius:12px;cursor:pointer;display:grid;place-items:center;
    transition:transform .12s,background .6s,border-color .6s;
    color:var(--btn-ink);
    box-shadow:0 4px 14px rgba(24,42,65,.06);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .icon-btn:active{transform:scale(.92);}

  .hud{
    position:absolute;
    top:max(70px,calc(env(safe-area-inset-top) + 60px));
    left:14px;right:14px;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;gap:8px;
  }
  .hud-side{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:5px 11px;border-radius:999px;
    background:var(--card-bg);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--card-border);
    box-shadow:0 4px 14px rgba(20,45,75,.06);
    font-size:11px;font-weight:800;color:var(--ink-muted);
    display:none;align-items:center;gap:5px;
    transition:background .6s,border-color .6s,color .6s;
  }
  .chip.show{display:inline-flex;}
  .chip.shield{color:#1f6feb;border-color:#c9dfff;}
  .chip.magnet{color:#b45309;border-color:#fde6b5;}
  .chip.stars{color:#b45309;border-color:#fde6b5;display:inline-flex;align-items:center;gap:5px;}
  .chip b{color:inherit;font-variant-numeric:tabular-nums;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:20px;z-index:10;
    background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .overlay.hidden{display:none;}
  .overlay-inner{
    padding:26px 26px 22px;border-radius:26px;
    background:rgba(255,255,255,.97);
    border:1px solid rgba(224,231,239,.9);
    box-shadow:0 24px 70px rgba(10,20,40,.28);
    max-width:min(400px,92vw);pointer-events:auto;
  }
  .overlay h1{margin:0 0 6px;font-size:25px;font-weight:950;letter-spacing:-.5px;color:#0f172a;}
  .overlay p{margin:0;color:#64748b;font-size:13px;font-weight:650;line-height:1.7;}
  .overlay p b{color:#0f172a;}
  .overlay .emoji{font-size:46px;line-height:1;margin-bottom:10px;}
  .badge{
    display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;
    background:#fef3c7;color:#92400e;font-weight:900;font-size:12px;
  }
  .button{
    margin-top:18px;border:0;border-radius:14px;padding:13px 28px;
    background:linear-gradient(135deg,#1489ff,#0069e5);color:#fff;
    font-size:15px;font-weight:900;letter-spacing:.2px;
    cursor:pointer;pointer-events:auto;font-family:inherit;
    box-shadow:0 8px 22px rgba(0,105,229,.32),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .12s;
  }
  .button:active{transform:scale(.96) translateY(1px);}

  .toast{
    position:absolute;top:15%;left:50%;transform:translate(-50%,12px);
    background:rgba(15,23,42,.94);color:#fff;padding:10px 20px;
    border-radius:999px;font-weight:850;font-size:13px;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
    white-space:nowrap;box-shadow:0 10px 30px rgba(10,20,40,.35);
    z-index:30;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .hint{
    position:absolute;left:0;right:0;
    bottom:max(10px,env(safe-area-inset-bottom));
    z-index:20;text-align:center;
    font-size:11px;font-weight:700;
    color:var(--ink-muted);opacity:.7;pointer-events:none;
    transition:color .6s ease,opacity .4s ease;
  }
  .hint.fade-out{opacity:0;}

  @media (max-width:520px){
    .brand{font-size:15px;}
    .stat{min-width:48px;height:38px;padding:3px 7px;}
    .stat b{font-size:14px;}
    .icon-btn{width:38px;height:38px;flex-basis:38px;}
  }
  @media (prefers-reduced-motion: reduce){
    .toast,.button,.icon-btn,.brand,.stat,.hint,.chip{transition:none;}
  }
</style>
</head>
<body>

<div class="game">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <div class="topbar">
      <div class="brand">🎮 العب مع <em>ناوي</em></div>
      <div class="stats">
        <div class="stat"><span>النقاط</span><b id="score">0</b></div>
        <div class="stat"><span>الأفضل</span><b id="best">0</b></div>
        <div class="stat"><span>سلسلة</span><b id="combo">0</b></div>
        <button class="icon-btn" id="muteBtn" aria-label="الصوت">🔊</button>
        <button class="icon-btn" id="pauseBtn" aria-label="إيقاف">Ⅱ</button>
      </div>
    </div>

    <div class="hud">
      <div class="hud-side">
        <div class="chip shield" id="shieldChip">🛡️ <b id="shieldTime">0</b></div>
        <div class="chip magnet" id="magnetChip">🧲 <b id="magnetTime">0</b></div>
      </div>
      <div class="hud-side">
        <div class="chip stars">⭐ <b id="stars">0</b></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <div class="emoji" id="ovEmoji">🔵</div>
        <h1 id="ovTitle">ناوي جاهز؟</h1>
        <p id="ovText">اضغط في أي مكان عشان تبدأ</p>
        <button class="button" id="ovBtn">يلا نبدأ</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="hint" id="hint">اضغط في أي مكان — أو Space على الكيبورد</div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   UTIL
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];

function roundRectPath(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw);
  const ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}
function lerpColor(a, b, t){
  return [
    Math.round(a[0] + (b[0]-a[0])*t),
    Math.round(a[1] + (b[1]-a[1])*t),
    Math.round(a[2] + (b[2]-a[2])*t)
  ];
}
function rgb(c, a){
  if (a === undefined) return `rgb(${c[0]},${c[1]},${c[2]})`;
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

/* ============================================================
   ELEMENTS
   ============================================================ */
const stage       = document.getElementById('stage');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('best');
const comboEl     = document.getElementById('combo');
const starsEl     = document.getElementById('stars');
const overlay     = document.getElementById('overlay');
const ovEmoji     = document.getElementById('ovEmoji');
const ovTitle     = document.getElementById('ovTitle');
const ovText      = document.getElementById('ovText');
const ovBtn       = document.getElementById('ovBtn');
const toastEl     = document.getElementById('toast');
const muteBtn     = document.getElementById('muteBtn');
const pauseBtn    = document.getElementById('pauseBtn');
const hintEl      = document.getElementById('hint');
const shieldChip  = document.getElementById('shieldChip');
const shieldTime  = document.getElementById('shieldTime');
const magnetChip  = document.getElementById('magnetChip');
const magnetTime  = document.getElementById('magnetTime');

/* ============================================================
   THEME
   ============================================================ */
const darkMQ   = window.matchMedia('(prefers-color-scheme: dark)');
const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion = reduceMQ.matches;
reduceMQ.addEventListener?.('change', e => { reduceMotion = e.matches; });

/* ============================================================
   CONSTANTS
   ============================================================ */
const GRAVITY   = 2300;
const JUMP_V    = -800;
const MAX_FALL  = 1900;
const BASE_SPEED = 6;
const MAX_SPEED  = 11.5;
const COYOTE    = 0.10;
const JUMP_BUF  = 0.13;

/* 🌅 دورة الليل والنهار — 120 ثانية (بطيئة وهادية) */
const DAY_CYCLE = 120;

const MILESTONES = [
  'برافو! 🔥','كمّل يا بطل! 💪','إيه الحلاوة دي! ✨',
  'ناوي مبسوط! 😄','ماشي صح! 🚀','تركيز عالي! 🎯'
];

/* ============================================================
   STATE
   ============================================================ */
let W=0, H=0, groundY=0;

let state = 'ready';
let score = 0, lastShown = -1, milestone = 0;
let starCount = 0, combo = 0;
let speed = BASE_SPEED;
let best = 0;
try { best = Number(localStorage.getItem('nawy.best.v7')) || 0; } catch(e){}

let shake = 0;
let obstacleTimer = 0, starTimer = 0, powerTimer = 0, cloudTimer = 0;
let hillOff1 = 0, hillOff2 = 0, groundOff = 0;
let lastT = 0, overAt = 0;

/* ابدأ الظهر — ناحية وسط النهار */
let worldTime = 0.42 * DAY_CYCLE;
let skyPhase  = 0.42;
let sunPos    = { x:0, y:0, visible:false };
let moonPos   = { x:0, y:0, visible:false };
let dayness   = 1;

const obstacles = [];
const stars     = [];
const powerups  = [];
const clouds    = [];
const particles = [];
const skyStars  = [];

for (let i = 0; i < 90; i++){
  skyStars.push({
    x: Math.random(),
    y: Math.random() * 0.72,
    size: rand(0.5, 1.7),
    twinkle: Math.random() * TAU,
    speed: rand(0.4, 1.6),
    depth: rand(0.4, 1)
  });
}

/* ============================================================
   PLAYER
   ============================================================ */
const player = {
  x: 80, y: 0, size: 40,
  vy: 0, grounded: true, coyote: 0, jumpBuf: 0,
  squash: 1, rotation: 0,
  blinkTimer: 2, blinking: 0,
  mood: 'idle', moodTimer: 0,
  shield: 0, magnet: 0,
  pupilX: 0, pupilY: 0,
  pupilTargetX: 0.3, pupilTargetY: 0
};
function setMood(m, d){ player.mood = m; player.moodTimer = d || 0; }

/* ============================================================
   SOUND
   ============================================================ */
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem('nawy.muted.v7') === '1'; } catch(e){}

function unlockAudio(){
  if (muted) return;
  try {
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function beep(f, dur, type, vol, slideTo, delay){
  if (muted) return;
  try {
    unlockAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
function sfx(name){
  switch(name){
    case 'jump':      beep(430,0.13,'square',0.045,720); break;
    case 'land':      beep(160,0.07,'sine',0.035,110); break;
    case 'coin':      beep(1000,0.09,'sine',0.055,1500);
                      beep(1500,0.09,'sine',0.030,1900,0.06); break;
    case 'hit':       beep(220,0.40,'sawtooth',0.070,55); break;
    case 'power':     beep(500,0.09,'sine',0.045,800); break;
    case 'shield':    beep(360,0.10,'triangle',0.055,560); break;
    case 'milestone': beep(660,0.12,'triangle',0.050,660);
                      beep(880,0.16,'triangle',0.050,880,0.11); break;
    case 'record':    beep(660,0.10,'sine',0.055,660);
                      beep(880,0.10,'sine',0.055,880,0.10);
                      beep(1200,0.16,'sine',0.045,1200,0.20); break;
  }
}
function vibrate(ms){
  if (muted) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

/* ============================================================
   PARTICLES
   ============================================================ */
function addP(p){
  if (particles.length > 260) return;
  p.rot = p.rot || 0; p.rotSpd = p.rotSpd || 0;
  p.g = p.g || 0; p.drag = p.drag || 0;
  p.maxLife = p.life;
  particles.push(p);
}
function burstDust(x, y, n){
  if (reduceMotion) n = Math.ceil(n/2);
  for (let i=0;i<n;i++){
    addP({
      type:'dust', x: x + rand(-8,8), y: y + rand(-4,2),
      vx: rand(-90,-20), vy: rand(-70,-8),
      g: 220, drag: 2.4, size: rand(2,4.5),
      life: rand(0.3,0.6),
      color: dayness > 0.5 ? '#cbd5e1' : '#475569'
    });
  }
}
function burstSparkle(x, y, n){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU), sp = rand(40,150);
    addP({
      type:'spark', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
      g: 260, drag: 1.8, size: rand(2,4),
      life: rand(0.3,0.55),
      color: pick(['#fbbf24','#fcd34d','#f59e0b','#fff7cc'])
    });
  }
}
function burstConfetti(x, y, n){
  const colors = ['#2563eb','#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa'];
  for (let i=0;i<n;i++){
    const a = rand(-Math.PI, 0), sp = rand(120, 380);
    addP({
      type:'confetti', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      g: 700, drag: 0.6, size: rand(6,11),
      rot: rand(0,TAU), rotSpd: rand(-12,12),
      life: rand(0.8,1.6),
      color: pick(colors)
    });
  }
}
function spawnText(x, y, text, color){
  addP({ type:'text', x, y, vx:0, vy:-58, life:0.85, size:15,
         color: color || '#f59e0b', text });
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.vy += p.g * dt;
    if (p.drag){ const d = Math.max(0, 1 - p.drag*dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotSpd * dt;
  }
}

/* ============================================================
   RESIZE
   ============================================================ */
function resize(){
  const rect = canvas.getBoundingClientRect();
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const nw = Math.max(1, Math.round(rect.width));
  const nh = Math.max(1, Math.round(rect.height));

  canvas.width  = Math.round(nw * dpr);
  canvas.height = Math.round(nh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const oldGround = groundY;
  W = nw; H = nh;
  groundY = Math.round(H - Math.max(60, H * 0.16));

  player.size = clamp(Math.round(H * 0.082), 26, 42);

  if (!oldGround){
    player.y = groundY - player.size;
  } else if (oldGround !== groundY){
    const dy = groundY - oldGround;
    for (const o of obstacles) o.y += dy;
    for (const s of stars)     s.y += dy;
    for (const p of powerups)  p.y += dy;
    if (state === 'playing') player.y += dy;
    else player.y = groundY - player.size;
  }

  player.x = Math.max(46, W * 0.14);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ============================================================
   SKY CYCLE — ألوان أهدى وأكثر شفافية
   ============================================================ */
const skyKeyframes = [
  { t:0.00, top:[12,18,40],    mid:[22,32,60],   bot:[40,50,80]   },  // ليل عميق
  { t:0.08, top:[20,28,60],    mid:[38,48,88],   bot:[85,85,120]  },  // قبل الفجر
  { t:0.15, top:[60,90,150],   mid:[130,140,185],bot:[230,175,155]},  // فجر
  { t:0.24, top:[110,165,225], mid:[175,205,240],bot:[240,225,205]},  // صباح
  { t:0.40, top:[130,190,245], mid:[190,215,245],bot:[235,240,250]},  // ظهر
  { t:0.60, top:[130,190,245], mid:[190,215,245],bot:[235,240,250]},  // بعد الظهر
  { t:0.70, top:[145,185,235], mid:[210,205,220],bot:[248,215,185]},  // مساء
  { t:0.78, top:[215,145,130], mid:[240,175,145],bot:[250,210,175]},  // غروب
  { t:0.86, top:[115,85,140],  mid:[145,105,145],bot:[195,125,135]},  // شفق
  { t:0.94, top:[35,42,85],    mid:[45,55,100],  bot:[65,75,115]},    // ليل
  { t:1.00, top:[12,18,40],    mid:[22,32,60],   bot:[40,50,80]   }
];

function getSkyColors(phase){
  for (let i = 0; i < skyKeyframes.length - 1; i++){
    const a = skyKeyframes[i], b = skyKeyframes[i+1];
    if (phase >= a.t && phase <= b.t){
      const t = (phase - a.t) / (b.t - a.t);
      return {
        top: lerpColor(a.top, b.top, t),
        mid: lerpColor(a.mid, b.mid, t),
        bot: lerpColor(a.bot, b.bot, t)
      };
    }
  }
  return { top: skyKeyframes[0].top, mid: skyKeyframes[0].mid, bot: skyKeyframes[0].bot };
}

function updateSkyPhase(){
  skyPhase = (worldTime % DAY_CYCLE) / DAY_CYCLE;

  /* ☀️ الشمس: من 0.10 لـ 0.80 → من الشرق (يمين) للغرب (شمال) */
  const dayStart = 0.10, dayEnd = 0.80;

  if (skyPhase >= dayStart && skyPhase <= dayEnd){
    const t = (skyPhase - dayStart) / (dayEnd - dayStart);

    // قوس: x من 0.96W (شرق) لـ 0.04W (غرب)
    sunPos.x = W * (0.96 - t * 0.92);

    // y: قوس ناعم — يطلع وينزل
    sunPos.y = groundY - Math.sin(t * Math.PI) * H * 0.62;
    sunPos.visible = true;

    dayness = Math.sin(t * Math.PI);
  } else {
    sunPos.visible = false;
    dayness = 0;
  }

  /* 🌙 القمر: من 0.86 لـ 1.10 (يلتف) — نفس الاتجاه */
  let nightPhase = skyPhase - 0.86;
  if (nightPhase < 0) nightPhase += 1;
  const nightLen = 0.24;

  if (nightPhase < nightLen){
    const t = nightPhase / nightLen;

    moonPos.x = W * (0.96 - t * 0.92);
    moonPos.y = groundY - Math.sin(t * Math.PI) * H * 0.55;
    moonPos.visible = true;
  } else {
    moonPos.visible = false;
  }

  /* 🌅 UI tinting — بيتغير حسب الوقت */
  const isDaytime = dayness > 0.42;
  const root = document.documentElement.style;
  root.setProperty('--ink',         isDaytime ? '#0f172a' : '#f1f5f9');
  root.setProperty('--ink-muted',   isDaytime ? '#64748b' : '#94a3b8');
  root.setProperty('--card-bg',     isDaytime ? 'rgba(255,255,255,.9)' : 'rgba(15,23,42,.65)');
  root.setProperty('--card-border', isDaytime ? '#e8edf3' : 'rgba(100,116,139,.35)');
  root.setProperty('--btn-ink',     isDaytime ? '#526174' : '#94a3b8');
}

/* ============================================================
   DRAW — SKY
   ============================================================ */
function drawSky(){
  const sky = getSkyColors(skyPhase);
  const g = ctx.createLinearGradient(0, 0, 0, groundY + 1);
  g.addColorStop(0,    rgb(sky.top));
  g.addColorStop(0.55, rgb(sky.mid));
  g.addColorStop(1,    rgb(sky.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, groundY + 1);
}

function drawNightStars(){
  const nightness = 1 - dayness;
  if (nightness < 0.08) return;

  const starsAlpha = (nightness - 0.08) / 0.92 * 0.55;   // max 0.55 (أهدى)
  ctx.save();
  for (const s of skyStars){
    const tw = 0.55 + Math.sin(worldTime * s.speed + s.twinkle) * 0.45;
    ctx.globalAlpha = starsAlpha * tw * s.depth;
    ctx.fillStyle = '#ffffff';
    const size = s.size * (1 + Math.sin(worldTime + s.twinkle) * 0.15);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * groundY, size, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawSun(){
  if (!sunPos.visible) return;

  // الحجم — أصغر وأشف عشان ميشتتش اللاعب
  const sunR = Math.max(14, W * 0.018);
  const warm = 1 - dayness * 0.6;   // 1 عند الشروق والغروب، 0.4 عند الظهر

  const sr = 255;
  const sg = Math.round(255 - warm * 55);
  const sb = Math.round(255 - warm * 120);

  // هالة ناعمة
  const haloR = sunR * 3.5;
  const halo = ctx.createRadialGradient(sunPos.x, sunPos.y, 0, sunPos.x, sunPos.y, haloR);
  halo.addColorStop(0, `rgba(${sr},${sg},${sb},0.28)`);
  halo.addColorStop(0.5, `rgba(${sr},${sg},${sb},0.10)`);
  halo.addColorStop(1, `rgba(${sr},${sg},${sb},0)`);
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(sunPos.x, sunPos.y, haloR, 0, TAU);
  ctx.fill();
  ctx.restore();

  // القرص
  ctx.save();
  ctx.globalAlpha = 0.85;
  const sunG = ctx.createRadialGradient(
    sunPos.x - sunR*0.2, sunPos.y - sunR*0.2, 0,
    sunPos.x, sunPos.y, sunR
  );
  sunG.addColorStop(0,  '#ffffff');
  sunG.addColorStop(.55, `rgb(${sr},${sg},${sb})`);
  sunG.addColorStop(1,  `rgb(${Math.max(220, sr-30)},${Math.max(180, sg-60)},${Math.max(120, sb-100)})`);
  ctx.fillStyle = sunG;
  ctx.beginPath();
  ctx.arc(sunPos.x, sunPos.y, sunR, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawMoon(){
  if (!moonPos.visible) return;

  const moonR = Math.max(12, W * 0.015);

  // هالة باهتة
  const haloR = moonR * 3;
  const halo = ctx.createRadialGradient(moonPos.x, moonPos.y, 0, moonPos.x, moonPos.y, haloR);
  halo.addColorStop(0, 'rgba(220,230,255,.22)');
  halo.addColorStop(1, 'rgba(220,230,255,0)');
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(moonPos.x, moonPos.y, haloR, 0, TAU);
  ctx.fill();
  ctx.restore();

  // القرص
  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = '#eef2ff';
  ctx.beginPath();
  ctx.arc(moonPos.x, moonPos.y, moonR, 0, TAU);
  ctx.fill();

  // فوهات
  ctx.fillStyle = 'rgba(180,195,225,.5)';
  ctx.beginPath();
  ctx.arc(moonPos.x - moonR*0.35, moonPos.y - moonR*0.20, moonR*0.18, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(moonPos.x + moonR*0.22, moonPos.y + moonR*0.30, moonR*0.14, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(moonPos.x + moonR*0.32, moonPos.y - moonR*0.28, moonR*0.11, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ============================================================
   🏔️ الجبال الشرقية والغربية
   ============================================================ */
function drawMountainPath(points, color){
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++){
    ctx.lineTo(points[i][0], points[i][1]);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawMountains(){
  const sky = getSkyColors(skyPhase);

  // لون الجبل: مزيج من لون السماء مع أزرق داكن (منظور جوي)
  const mountainBase = lerpColor(sky.mid, [25, 40, 70], 0.45);
  const mountainTip  = lerpColor(mountainBase, [255, 255, 255], 0.10);

  // تدرج خفيف — القمة أفتح (منظور جوي)
  const grad = ctx.createLinearGradient(0, groundY - H * 0.42, 0, groundY);
  grad.addColorStop(0, rgb(mountainTip, 0.88));
  grad.addColorStop(1, rgb(mountainBase, 0.88));

  // 🏔️ الجبل الشرقي (يمين)
  drawMountainPath([
    [W * 0.58, groundY + 4],
    [W * 0.66, groundY - H * 0.08],
    [W * 0.73, groundY - H * 0.20],
    [W * 0.80, groundY - H * 0.17],
    [W * 0.86, groundY - H * 0.32],
    [W * 0.90, groundY - H * 0.42],
    [W * 0.94, groundY - H * 0.38],
    [W * 1.00, groundY - H * 0.30],
    [W + 20, groundY - H * 0.22],
    [W + 20, groundY + 4]
  ], grad);

  // 🏔️ الجبل الغربي (شمال) — مشابه لكن معكوس
  drawMountainPath([
    [-20, groundY + 4],
    [-20, groundY - H * 0.22],
    [W * 0.00, groundY - H * 0.30],
    [W * 0.06, groundY - H * 0.38],
    [W * 0.10, groundY - H * 0.42],
    [W * 0.14, groundY - H * 0.32],
    [W * 0.20, groundY - H * 0.17],
    [W * 0.27, groundY - H * 0.20],
    [W * 0.34, groundY - H * 0.08],
    [W * 0.42, groundY + 4]
  ], grad);
}

/* ============================================================
   CLOUDS
   ============================================================ */
function drawClouds(){
  const sky = getSkyColors(skyPhase);
  const cloudCol = lerpColor(sky.mid, [255,255,255], dayness * 0.70 + 0.20);
  const cloudAlpha = 0.28 + dayness * 0.35;   // أشف من قبل

  ctx.save();
  for (const c of clouds){
    const r = c.w * 0.30;

    // ظل سفلي خفيف جدًا
    ctx.fillStyle = rgb(lerpColor(cloudCol, [0,0,0], 0.10), cloudAlpha * 0.5);
    ctx.beginPath();
    ctx.arc(c.x, c.y + 2, r * 0.9, 0, TAU);
    ctx.arc(c.x + r*1.10, c.y + 1, r * 1.05, 0, TAU);
    ctx.arc(c.x + r*2.30, c.y + 2, r * 0.8, 0, TAU);
    ctx.fill();

    // الجسم الأساسي
    ctx.fillStyle = rgb(cloudCol, cloudAlpha);
    ctx.beginPath();
    ctx.arc(c.x,           c.y,          r,      0, TAU);
    ctx.arc(c.x + r*1.10,  c.y - r*0.50, r*1.25, 0, TAU);
    ctx.arc(c.x + r*2.30,  c.y,          r*0.95, 0, TAU);
    ctx.fill();

    // لمعة علوية خفيفة
    ctx.fillStyle = rgb([255,255,255], cloudAlpha * 0.42);
    ctx.beginPath();
    ctx.arc(c.x + r*1.10, c.y - r*0.65, r*0.7, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   HILLS
   ============================================================ */
function drawHills(){
  const sky = getSkyColors(skyPhase);
  const hill1Col = lerpColor(sky.bot, [255,255,255], 0.55 + dayness * 0.10);
  const hill2Col = lerpColor(sky.bot, [255,255,255], 0.30 + dayness * 0.15);

  ctx.save();

  ctx.fillStyle = rgb(hill1Col, 0.85);
  ctx.beginPath();
  ctx.moveTo(-2, groundY + 2);
  for (let x = -2; x <= W + 2; x += 14){
    const y = groundY - 40
      - Math.sin((x + hillOff1) / 145) * 26
      - Math.sin((x + hillOff1) / 62) * 9;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 2, groundY + 2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = rgb(hill2Col, 0.85);
  ctx.beginPath();
  ctx.moveTo(-2, groundY + 2);
  for (let x = -2; x <= W + 2; x += 14){
    const y = groundY - 22
      - Math.sin((x + hillOff2) / 108) * 18
      - Math.sin((x + hillOff2) / 48) * 7;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 2, groundY + 2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ============================================================
   GROUND
   ============================================================ */
function drawGround(){
  const groundCol = lerpColor([15,22,42], [255,255,255], dayness * 0.94 + 0.03);
  const lineCol   = lerpColor([45,58,85],  [30,41,59],   dayness * 0.85);
  const dotCol    = lerpColor([40,55,85],  [226,232,240],dayness * 0.9);

  ctx.fillStyle = rgb(groundCol);
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.strokeStyle = rgb(lineCol);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY + 1);
  ctx.lineTo(W, groundY + 1);
  ctx.stroke();

  const gap = 44;
  const start = -((groundOff % gap) + gap) % gap;
  ctx.strokeStyle = rgb(dotCol);
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = start; x < W + gap; x += gap){
    ctx.moveTo(x, groundY + 20);
    ctx.lineTo(x + 20, groundY + 20);
  }
  ctx.stroke();
  ctx.lineCap = 'butt';
}

/* ============================================================
   OBSTACLES
   ============================================================ */
function drawObstacles(){
  const isNight = dayness < 0.4;

  for (const o of obstacles){
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w/2, groundY + 4, o.w*0.55, 4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = isNight ? '#1a2538' : '#1e293b';
    roundRectPath(ctx, o.x, o.y, o.w, o.h, 7);
    ctx.fill();

    ctx.fillStyle = isNight ? '#2c3a55' : '#334155';
    roundRectPath(ctx, o.x, o.y, o.w, Math.min(9, o.h*0.22), 7);
    ctx.fill();

    const winCol = isNight ? '#fbbf24' : (dayness > 0.6 ? '#bfdbfe' : '#93c5fd');
    ctx.fillStyle = winCol;
    if (isNight){
      ctx.shadowColor = 'rgba(251,191,36,.6)';
      ctx.shadowBlur = 8;
    }
    const cols = o.w >= 46 ? 3 : 2;
    const rows = o.h >= 46 ? 2 : 1;
    const bw = 5, bh = 5;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const px = o.x + (o.w/(cols+1))*(c+1) - bw/2;
        const py = o.y + (rows === 1 ? o.h*0.55 : o.h*(0.38 + r*0.34)) - bh/2;
        roundRectPath(ctx, px, py, bw, bh, 1.5);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }
}

/* ============================================================
   COLLECTIBLE STARS
   ============================================================ */
function drawCollectibleStars(){
  for (const s of stars){
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    ctx.globalAlpha = 0.22 + (1 - dayness) * 0.28;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, s.r * 1.6, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a  = -Math.PI/2 + i * Math.PI/5;
      const rr = (i % 2) ? s.r * 0.45 : s.r;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#f59e0b';
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   POWERUPS
   ============================================================ */
function drawPowerups(){
  for (const p of powerups){
    const y = p.y + Math.sin(p.bob) * 6;
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = p.type === 'shield'
      ? 'rgba(31,139,255,.5)'
      : 'rgba(255,177,40,.5)';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, y, p.r, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = p.type === 'shield' ? '#55a9ff' : '#f1b72f';
    ctx.stroke();
    ctx.font = '900 15px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'shield' ? '🛡️' : '🧲', p.x, y + 1);
    ctx.restore();
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

/* ============================================================
   NAWY
   ============================================================ */
function drawPlayer(){
  const s  = player.size;
  const cx = player.x + s/2;
  const cy = player.y + s/2;
  const R  = s/2;

  const airH = clamp((groundY - player.y - s) / 170, 0, 1);
  ctx.save();
  ctx.globalAlpha = (dayness > 0.5 ? 0.13 : 0.30) * (1 - airH*0.7);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, groundY + 5,
              s*0.42*(1-airH*0.4),
              5*(1-airH*0.4),
              0, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (player.magnet > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(worldTime * 7) * 0.15;
    ctx.strokeStyle = '#f1b72f';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.arc(cx, cy, R + 9, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  if (player.shield > 0){
    const pulse = 1 + Math.sin(worldTime * 8) * 0.05;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    const sGrad = ctx.createRadialGradient(0,0,R-2, 0,0,R+16);
    sGrad.addColorStop(0,   'rgba(49,154,255,0)');
    sGrad.addColorStop(.65, 'rgba(49,154,255,.30)');
    sGrad.addColorStop(1,   'rgba(49,154,255,0)');
    ctx.fillStyle = sGrad;
    ctx.beginPath(); ctx.arc(0, 0, R + 16, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(90,175,255,.75)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, R + 10, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);

  const squashClamped = clamp(player.squash, 0.85, 1.15);
  const sqX = 1 / Math.sqrt(squashClamped);
  const sqY = squashClamped;
  ctx.scale(sqX, sqY);
  ctx.rotate(player.rotation * 0.4);

  ctx.save();
  ctx.shadowColor = 'rgba(20,90,200,.30)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 3;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = '#2563eb';
  ctx.fill();
  ctx.restore();

  const g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0,   '#4A96F0');
  g.addColorStop(.55, '#2563EB');
  g.addColorStop(1,   '#1A4FBF');
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-R*0.32, -R*0.44, R*0.30, R*0.15, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  const blinkingNow = player.blinking > 0;
  player.pupilX += (player.pupilTargetX - player.pupilX) * 0.18;
  player.pupilY += (player.pupilTargetY - player.pupilY) * 0.18;

  const mood = player.mood;

  if (mood === 'hit'){
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.13);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.05, er = R*0.22;
    ctx.beginPath();
    ctx.moveTo(-ex-er, ey-er); ctx.lineTo(-ex+er, ey+er);
    ctx.moveTo(-ex+er, ey-er); ctx.lineTo(-ex-er, ey+er);
    ctx.moveTo( ex-er, ey-er); ctx.lineTo( ex+er, ey+er);
    ctx.moveTo( ex+er, ey-er); ctx.lineTo( ex-er, ey+er);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-R*0.28, R*0.32);
    ctx.lineTo(-R*0.14, R*0.22);
    ctx.lineTo( 0,      R*0.32);
    ctx.lineTo( R*0.14, R*0.22);
    ctx.lineTo( R*0.28, R*0.32);
    ctx.stroke();
  } else if (mood === 'happy'){
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.12);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.10, er = R*0.22;
    ctx.beginPath();
    ctx.arc(-ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc( ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.stroke();
  } else if (mood === 'record'){
    ctx.fillStyle = '#fbbf24';
    for (const dir of [-1, 1]){
      ctx.save();
      ctx.translate(dir * R*0.40, -R*0.08);
      ctx.beginPath();
      for (let i = 0; i < 10; i++){
        const a  = -Math.PI/2 + i * Math.PI/5;
        const rr = (i%2) ? R*0.10 : R*0.22;
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.stroke();
  } else if (mood === 'focus'){
    const eyeW = R*0.28, eyeH = R*0.10;
    const ex = R*0.40, ey = -R*0.06;
    ctx.fillStyle = '#fff';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(dir*ex, ey, eyeW, eyeH, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#0f172a';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.arc(dir*ex + player.pupilX*R*0.4, ey + player.pupilY*R*0.3, R*0.07, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.22, R*0.30);
    ctx.lineTo( R*0.22, R*0.30);
    ctx.stroke();
  } else {
    const eyeR = R*0.30;
    const eyeX = R*0.38;
    const baseEyeY = -R*0.08;

    if (blinkingNow){
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = Math.max(2, R*0.10);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo(-eyeX + eyeR*0.8, baseEyeY);
      ctx.moveTo( eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo( eyeX + eyeR*0.8, baseEyeY);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.arc( eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.fill();
      const pupilR = eyeR * 0.55;
      ctx.fillStyle = '#0f172a';
      for (const dir of [-1, 1]){
        ctx.beginPath();
        ctx.arc(dir*eyeX + player.pupilX*eyeR*0.5,
                baseEyeY + player.pupilY*eyeR*0.5,
                pupilR, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (const dir of [-1, 1]){
        ctx.beginPath();
        ctx.arc(dir*eyeX + player.pupilX*eyeR*0.5 - pupilR*0.35,
                baseEyeY + player.pupilY*eyeR*0.5 - pupilR*0.35,
                pupilR*0.35, 0, TAU);
        ctx.fill();
      }
    }

    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';

    if (mood === 'jump'){
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.10, R*0.13, 0, 0, TAU);
      ctx.stroke();
    } else if (mood === 'fall'){
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.14, R*0.16, 0, 0, TAU);
      ctx.stroke();
    } else {
      ctx.beginPath();
      if (player.grounded){
        ctx.arc(0, R*0.10, R*0.30, Math.PI*0.25, Math.PI*0.75);
      } else {
        ctx.arc(0, R*0.28, R*0.14, 0, TAU);
      }
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#fb7185';
  ctx.beginPath();
  ctx.arc(-R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.arc( R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

/* ============================================================
   PARTICLES DRAW
   ============================================================ */
function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;

    if (p.type === 'text'){
      ctx.font = '900 ' + p.size + 'px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    } else if (p.type === 'confetti'){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    } else if (p.type === 'spark'){
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.2 && !reduceMotion){
    ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);
  }

  drawSky();
  drawNightStars();
  drawSun();
  drawMoon();
  drawMountains();     // 🏔️ الجبال تحجب الشمس عند الشروق والغروب
  drawClouds();
  drawHills();
  drawGround();
  drawCollectibleStars();
  drawPowerups();
  drawObstacles();
  drawParticles();
  if (state !== 'over') drawPlayer();

  ctx.restore();
}

/* ============================================================
   SPAWNERS + PROGRESSIVE DIFFICULTY
   ============================================================ */
function getDifficulty(){
  return clamp(score / 1200, 0, 1);
}
function spawnObstacle(){
  const d = getDifficulty();
  const r = Math.random();
  let w, h;
  if (d < 0.30){
    w = 24; h = rand(28, 40);
  } else if (d < 0.60){
    if (r < 0.55){ w = 24; h = rand(32, 46); }
    else         { w = 22; h = rand(44, 56); }
  } else if (d < 0.85){
    if (r < 0.40){ w = 24; h = rand(34, 46); }
    else if (r < 0.75){ w = 22; h = rand(46, 60); }
    else { w = rand(44, 54); h = rand(28, 34); }
  } else {
    if (r < 0.30){ w = 24; h = rand(36, 48); }
    else if (r < 0.60){ w = 22; h = rand(48, 62); }
    else if (r < 0.85){ w = rand(46, 56); h = rand(28, 34); }
    else { w = 20; h = rand(56, 66); }
  }
  obstacles.push({ x: W + 40, w, h, y: groundY - h, passed:false });
}
function spawnStarArc(){
  const startX = W + 90;
  for (const o of obstacles){
    if (o.x < startX + 130 && o.x + o.w > startX - 30) return;
  }
  const d = getDifficulty();
  const n = d > 0.5 ? (Math.random() < 0.5 ? 4 : 5) : 3;
  const baseY = groundY - rand(95, 140);
  for (let i = 0; i < n; i++){
    stars.push({
      x: startX + i*34,
      y: baseY - Math.sin((i/(n-1)) * Math.PI) * 22,
      r: 10,
      rot: rand(0, TAU)
    });
  }
}
function spawnCloud(){
  const w = rand(60, 130);
  clouds.push({ x: W + w, y: rand(H*0.05, groundY*0.42), w, spd: rand(4, 14) });
}
function spawnPowerup(force){
  if (powerups.length >= 1 && !force) return;
  const type = Math.random() < 0.55 ? 'shield' : 'magnet';
  powerups.push({
    x: W + 60,
    y: groundY - rand(100, 165),
    r: 15, type,
    bob: Math.random() * TAU
  });
}

/* ============================================================
   AMBIENT / MOOD
   ============================================================ */
function updateAmbient(dt){
  const worldSpeed = (state === 'playing') ? speed * 60 : 70;
  hillOff1  += worldSpeed * 0.06 * dt;
  hillOff2  += worldSpeed * 0.14 * dt;
  groundOff += worldSpeed * dt;

  cloudTimer -= dt;
  if (cloudTimer <= 0){ spawnCloud(); cloudTimer = rand(2.5, 6); }

  for (let i = clouds.length-1; i >= 0; i--){
    const c = clouds[i];
    c.x -= (c.spd + worldSpeed * 0.05) * dt;
    if (c.x + c.w < -40) clouds.splice(i, 1);
  }
}

function updatePlayerMood(dt){
  if (player.moodTimer > 0){
    player.moodTimer -= dt;
    if (player.moodTimer <= 0){
      player.mood = player.grounded ? 'idle' : (player.vy < 0 ? 'jump' : 'fall');
    }
  } else {
    if (!player.grounded){
      player.mood = player.vy < 0 ? 'jump' : 'fall';
    } else {
      player.mood = 'idle';
    }
  }
  if (player.mood === 'jump'){
    player.pupilTargetX = 0.4; player.pupilTargetY = -0.7;
  } else if (player.mood === 'fall'){
    player.pupilTargetX = 0.4; player.pupilTargetY = 0.7;
  } else if (player.mood === 'focus'){
    player.pupilTargetX = 0.6; player.pupilTargetY = 0;
  } else {
    player.pupilTargetX = 0.35; player.pupilTargetY = 0;
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  player.y += player.vy * dt;

  const floor = groundY - player.size;
  if (player.y >= floor){
    if (!player.grounded){
      player.squash = 0.82;
      if (!reduceMotion) shake = Math.min(shake + 2, 4);
      burstDust(player.x + player.size/2, groundY, 7);
      sfx('land');
    }
    player.y = floor;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  player.squash += (1 - player.squash) * 12 * dt;
  if (Math.abs(player.squash - 1) < 0.002) player.squash = 1;

  if (player.grounded) player.coyote = COYOTE;
  else player.coyote = Math.max(0, player.coyote - dt);
  player.jumpBuf = Math.max(0, player.jumpBuf - dt);

  /* رمش */
  player.blinkTimer -= dt;
  if (player.blinkTimer <= 0){
    player.blinking = 0.13;
    player.blinkTimer = rand(2.2, 5.5);
  }
  if (player.blinking > 0) player.blinking -= dt;

  updatePlayerMood(dt);

  /* نقاط + صعوبة */
  score += dt * (11 + getDifficulty() * 6);
  const shown = Math.floor(score);
  if (shown !== lastShown){ lastShown = shown; scoreEl.textContent = shown; }
  speed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.018);

  const ms = Math.floor(score / 100);
  if (ms > milestone){
    milestone = ms;
    showToast(pick(MILESTONES));
    sfx('milestone');
    setMood('happy', 0.6);
  }

  obstacleTimer -= dt;
  if (obstacleTimer <= 0){
    spawnObstacle();
    const d = getDifficulty();
    const base = 1.5 - d * 0.72;
    obstacleTimer = base * rand(0.88, 1.12);
  }

  const dx = speed * 60 * dt;

  for (let i = obstacles.length-1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= dx;
    if (o.x + o.w < -30){ obstacles.splice(i,1); continue; }
    if (circleRect(
      player.x + player.size/2,
      player.y + player.size/2,
      player.size * 0.38,
      o.x, o.y, o.w, o.h
    )){
      if (player.shield > 0){
        player.shield = 0;
        burstSparkle(player.x + player.size/2, player.y + player.size/2, 16);
        showToast('🛡️ الحماية أنقذتك!');
        sfx('shield');
        obstacles.splice(i,1);
        setMood('happy', 0.5);
        continue;
      }
      gameOver();
      return;
    }
    if (!o.passed && o.x + o.w < player.x){
      o.passed = true;
      combo++;
      comboEl.textContent = combo;
      if (combo % 3 === 0){
        showToast('🔥 سلسلة ' + combo);
        setMood('focus', 0.4);
      }
    }
  }

  starTimer -= dt;
  if (starTimer <= 0){
    spawnStarArc();
    const d = getDifficulty();
    starTimer = rand(2.4, 4.8) * (1 - d * 0.3);
  }

  const pcx = player.x + player.size/2;
  const pcy = player.y + player.size/2;
  const pickupR = player.size * 0.48;

  for (let i = stars.length-1; i >= 0; i--){
    const s = stars[i];
    s.x   -= dx;
    s.rot += dt * 2.2;
    if (s.x < -30){ stars.splice(i,1); continue; }
    if (player.magnet > 0){
      const ddx = pcx - s.x;
      const ddy = pcy - s.y;
      const d = Math.hypot(ddx, ddy);
      if (d < 200 && d > 1){
        const f = 1 - d/200;
        s.x += ddx * dt * (5 + f*8);
        s.y += ddy * dt * (5 + f*8);
      }
    }
    const ddx = pcx - s.x, ddy = pcy - s.y;
    const rr  = s.r + pickupR;
    if (ddx*ddx + ddy*ddy < rr*rr){
      stars.splice(i,1);
      score += 10;
      starCount++;
      starsEl.textContent = starCount;
      combo++;
      comboEl.textContent = combo;
      burstSparkle(s.x, s.y, 8);
      spawnText(s.x, s.y - 10, '+10', '#f59e0b');
      sfx('coin');
      setMood('happy', 0.45);
    }
  }

  powerTimer -= dt;
  if (powerTimer <= 0){
    spawnPowerup();
    powerTimer = rand(9, 13);
  }

  for (let i = powerups.length-1; i >= 0; i--){
    const p = powerups[i];
    p.x -= dx;
    p.bob += dt * 4;
    const py = p.y + Math.sin(p.bob) * 6;
    const d = Math.hypot(pcx - p.x, pcy - py);
    if (d < player.size * 0.7 + p.r){
      if (p.type === 'shield'){
        player.shield = 7;
        showToast('🛡️ حماية 7 ثواني');
        sfx('shield');
      } else {
        player.magnet = 7;
        showToast('🧲 المغناطيس شغال!');
        sfx('power');
      }
      burstSparkle(p.x, py, 14);
      powerups.splice(i,1);
      setMood('happy', 0.5);
      continue;
    }
    if (p.x < -60) powerups.splice(i,1);
  }

  if (player.shield > 0){
    player.shield -= dt;
    if (player.shield < 0) player.shield = 0;
    shieldChip.classList.add('show');
    shieldTime.textContent = Math.ceil(player.shield) + 'ث';
  } else {
    shieldChip.classList.remove('show');
  }
  if (player.magnet > 0){
    player.magnet -= dt;
    if (player.magnet < 0) player.magnet = 0;
    magnetChip.classList.add('show');
    magnetTime.textContent = Math.ceil(player.magnet) + 'ث';
  } else {
    magnetChip.classList.remove('show');
  }
}

/* ============================================================
   INPUT
   ============================================================ */
function jump(){
  if (state !== 'playing') return;
  if (player.grounded || player.coyote > 0){
    player.vy = JUMP_V;
    player.grounded = false;
    player.squash = 1.18;
    player.coyote = 0;
    player.jumpBuf = 0;
    burstDust(player.x + player.size/2, groundY, 5);
    sfx('jump');
    setMood('jump', 0.25);
    hintEl.classList.add('fade-out');
  } else {
    player.jumpBuf = JUMP_BUF;
  }
}
function onTap(e){
  if (e && e.preventDefault) e.preventDefault();
  if (state === 'playing'){ jump(); return; }
  if (state === 'paused'){ resumeGame(); return; }
  if (state === 'over' && performance.now() - overAt < 500) return;
  startGame();
}
canvas.addEventListener('pointerdown', onTap, { passive:false });
ovBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
    e.preventDefault();
    if (e.repeat) return;
    onTap(null);
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});
muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('nawy.muted.v7', muted ? '1' : '0'); } catch(err){}
  if (!muted) sfx('coin');
});
pauseBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (state === 'playing') pauseGame();
  else if (state === 'paused') resumeGame();
});

/* ============================================================
   UI
   ============================================================ */
let toastTimeout = null;
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1300);
}
function showOverlay(opt){
  ovEmoji.textContent = opt.emoji;
  ovTitle.textContent = opt.title;
  ovText.innerHTML    = opt.text;
  ovBtn.textContent   = opt.btn;
  let badge = overlay.querySelector('.badge');
  if (opt.badge){
    if (!badge){
      badge = document.createElement('div');
      badge.className = 'badge';
      overlay.querySelector('.overlay-inner').appendChild(badge);
    }
    badge.textContent = opt.badge;
  } else if (badge){
    badge.remove();
  }
  overlay.classList.remove('hidden');
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(){
  score = 0; lastShown = -1; milestone = 0;
  starCount = 0; combo = 0;
  speed = BASE_SPEED;
  obstacleTimer = 1.1;
  starTimer = rand(1.5, 3);
  powerTimer = 3;
  shake = 0;

  obstacles.length = 0;
  stars.length = 0;
  powerups.length = 0;
  particles.length = 0;

  player.x = Math.max(46, W * 0.14);
  player.y = groundY - player.size;
  player.vy = 0;
  player.grounded = true;
  player.squash = 1;
  player.blinking = 0;
  player.blinkTimer = rand(1, 3);
  player.coyote = COYOTE;
  player.jumpBuf = 0;
  player.shield = 0;
  player.magnet = 0;
  player.mood = 'idle';
  player.moodTimer = 0;
  player.pupilX = 0; player.pupilY = 0;
  player.pupilTargetX = 0.3; player.pupilTargetY = 0;

  scoreEl.textContent = '0';
  comboEl.textContent = '0';
  starsEl.textContent = '0';
  shieldChip.classList.remove('show');
  magnetChip.classList.remove('show');
  hintEl.classList.remove('fade-out');

  overlay.classList.add('hidden');
  pauseBtn.textContent = 'Ⅱ';

  unlockAudio();
  state = 'playing';
  spawnPowerup(true);
}
function pauseGame(){
  if (state !== 'playing') return;
  state = 'paused';
  showOverlay({
    emoji: '⏸️',
    title: 'وقفة صغيرة',
    text : 'خد نفس... ولما تكون جاهز نكمل.',
    btn  : 'كمّل اللعب'
  });
  pauseBtn.textContent = '▶';
}
function resumeGame(){
  if (state !== 'paused') return;
  state = 'playing';
  overlay.classList.add('hidden');
  pauseBtn.textContent = 'Ⅱ';
}
function gameOver(){
  state = 'over';
  overAt = performance.now();
  score = Math.floor(score);
  if (!reduceMotion) shake = 12;
  sfx('hit');
  vibrate(80);
  setMood('hit', 5);
  burstConfetti(
    player.x + player.size/2,
    player.y + player.size/2,
    reduceMotion ? 10 : 24
  );
  let record = false;
  if (score > best){
    best = score;
    record = true;
    try { localStorage.setItem('nawy.best.v7', String(best)); } catch(e){}
    bestEl.textContent = best;
    sfx('record');
    setMood('record', 5);
  }
  showOverlay({
    emoji: record ? '🏆' : '😵',
    title: record ? 'رقم قياسي جديد!' : 'ناوي خبط! 😅',
    text : 'نتيجتك: <b>' + score + '</b> — الأفضل: <b>' + best + '</b>',
    btn  : 'حاول تاني',
    badge: record ? 'أحسنت! 🎉' : null
  });
  if (record && !reduceMotion) burstConfetti(W/2, H*0.35, 28);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastFrameTime = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!lastFrameTime) lastFrameTime = t;
  let dt = (t - lastFrameTime) / 1000;
  lastFrameTime = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1/30);

  worldTime += dt;

  if (state === 'playing') update(dt);
  updateAmbient(dt);
  updateParticles(dt);
  updateSkyPhase();

  shake *= Math.exp(-9 * dt);
  if (shake < 0.15) shake = 0;

  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') pauseGame();
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  bestEl.textContent = best;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  resize();
  updateSkyPhase();
  for (let i = 0; i < 4; i++) spawnCloud();
  requestAnimationFrame(frame);
}
init();

})();
</script>
