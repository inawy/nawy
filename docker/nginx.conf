# إعداد nginx لموقع ناوي الثابت. نفس سلوك التخزين المؤقت المتوقع من Pages، مع ضمان إن الـ service worker
# وصفحة البداية بيتجددوا دايمًا (باقي الملفات بتتنسخ بالإصدار في ?v= وبتتجدد بالـ ETag).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # لازم المتصفح يسأل عن نسخة جديدة كل مرة، وإلا التحديثات تتأخر.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
