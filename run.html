<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c5e0f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>العب مع ناوي 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1e293b;
    --ink-muted:#64748b;
    --card-bg:rgba(255,255,255,.9);
    --card-border:rgba(203,213,225,.7);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#c5e0f7;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
    position:fixed;inset:0;
  }
  .game{position:fixed;inset:0;overflow:hidden;}
  .stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;}
  canvas{
    width:100%;height:100%;display:block;touch-action:none;
    image-rendering:auto;
  }

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:50;
    padding:max(10px,env(safe-area-inset-top))
            max(14px,env(safe-area-inset-right))
            10px max(14px,env(safe-area-inset-left));
    display:flex;align-items:center;gap:10px;pointer-events:none;
  }
  .brand{
    font-size:17px;font-weight:900;white-space:nowrap;letter-spacing:-.3px;
    color:var(--ink);text-shadow:0 1px 2px rgba(255,255,255,.6);
  }
  .brand em{font-style:normal;color:#2563eb;}
  .stats{margin-inline-start:auto;display:flex;gap:16px;align-items:baseline;white-space:nowrap;}
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1;}
  .stat.combo{
    opacity:0;transform:translateY(-4px);
    transition:opacity .22s ease,transform .22s ease;
  }
  .stat.combo.show{opacity:1;transform:translateY(0);}
  .stat span{
    font-size:9px;color:rgba(30,41,59,.5);font-weight:800;
    letter-spacing:.2px;margin-bottom:2px;
    text-shadow:0 1px 2px rgba(255,255,255,.55);
  }
  .stat b{
    font-size:17px;color:var(--ink);font-weight:900;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(255,255,255,.6);
  }

  .control-bar{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:max(14px, env(safe-area-inset-bottom));
    z-index:50;
    display:flex;align-items:center;gap:2px;
    padding:6px;border-radius:999px;
    background:rgba(255,255,255,.52);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 10px 28px rgba(20,40,70,.16), inset 0 1px 0 rgba(255,255,255,.7);
    pointer-events:auto;
  }
  .ctrl-btn{
    width:42px;height:42px;
    border:none;background:transparent;
    border-radius:50%;
    display:grid;place-items:center;cursor:pointer;
    color:var(--ink);
    transition:transform .14s ease, background .16s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ctrl-btn svg{ width:20px;height:20px;display:block; }
  .ctrl-btn:active{ transform:scale(.86); background:rgba(255,255,255,.55); }
  .ctrl-btn.exit{ color:#dc2626; }
  .ctrl-sep{
    width:1px;height:22px;
    background:rgba(30,41,59,.14);
    margin:0 2px;
  }
  @media (orientation:landscape) and (max-height:480px){
    .control-bar{ bottom:max(8px, env(safe-area-inset-bottom)); padding:4px; gap:0; }
    .ctrl-btn{ width:36px;height:36px; }
    .ctrl-btn svg{ width:18px;height:18px; }
  }

  .hud{
    position:absolute;
    top:max(72px,calc(env(safe-area-inset-top) + 62px));
    left:14px;right:14px;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;gap:8px;
  }
  .hud-side{display:flex;gap:14px;flex-wrap:wrap;}
  .chip{
    font-size:14px;font-weight:900;color:var(--ink);
    display:none;align-items:center;gap:4px;
    text-shadow:0 1px 3px rgba(255,255,255,.65);
  }
  .chip.show{display:inline-flex;}
  .chip.shield{color:#1f6feb;}
  .chip.magnet{color:#b45309;}
  .chip.stars{color:#b45309;display:inline-flex;}
  .chip b{color:inherit;font-variant-numeric:tabular-nums;font-weight:900;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:20px;z-index:10;
    background:rgba(255,255,255,.35);
  }
  .overlay.hidden{display:none;}
  .overlay-inner{
    padding:26px 26px 22px;border-radius:24px;
    background:#ffffff;
    border:1px solid rgba(224,231,239,.9);
    box-shadow:0 20px 50px rgba(20,50,90,.12);
    max-width:min(400px,92vw);pointer-events:auto;
  }
  .overlay h1{margin:0 0 6px;font-size:25px;font-weight:950;letter-spacing:-.5px;color:#0f172a;}
  .overlay p{margin:0;color:#64748b;font-size:13px;font-weight:650;line-height:1.7;}
  .overlay p b{color:#0f172a;}
  .overlay .ov-nawy{width:84px;height:84px;display:block;margin:0 auto 10px;}
  .badge{
    display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;
    background:#fef3c7;color:#92400e;font-weight:900;font-size:12px;
  }
  .button{
    margin-top:16px;border:0;border-radius:14px;padding:13px 28px;
    background:linear-gradient(135deg,#1489ff,#0069e5);color:#fff;
    font-size:15px;font-weight:900;letter-spacing:.2px;
    cursor:pointer;pointer-events:auto;font-family:inherit;
    box-shadow:0 6px 18px rgba(0,105,229,.28);
    transition:transform .12s;
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .button:active{transform:scale(.97) translateY(1px);}
  .button.secondary{background:#f1f5f9;color:#334155;box-shadow:0 3px 10px rgba(15,23,42,.06);}

  .toast{
    position:absolute;
    top:max(72px,calc(env(safe-area-inset-top) + 62px));
    left:50%;transform:translate(-50%,-6px) scale(.94);
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
    color:#0f172a;padding:8px 18px;
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;font-weight:800;font-size:12.5px;
    opacity:0;pointer-events:none;
    transition:opacity .32s ease,transform .32s cubic-bezier(.22,.9,.32,1);
    white-space:nowrap;
    box-shadow:0 10px 26px rgba(20,45,80,.14), inset 0 1px 0 rgba(255,255,255,.7);
    z-index:45;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1);}

  .thought{
    position:absolute;
    transform:translate(-50%,-100%) scale(.85);
    transform-origin:bottom center;
    background:#ffffff;
    border:2.5px solid #0f172a;
    border-radius:16px;
    padding:6px 13px;
    font-weight:800;font-size:12px;color:#0f172a;
    white-space:nowrap;
    box-shadow:2px 3px 0 rgba(15,23,42,.85);
    opacity:0;pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
    z-index:40;
  }
  .thought.show{ opacity:1; transform:translate(-50%,-118%) scale(1); }
  .thought .tdot{
    position:absolute;
    background:#ffffff;
    border-radius:50%;
  }
  .thought .tdot.d1{ width:11px;height:11px; border:2.2px solid #0f172a; bottom:-16px; left:44%; margin-left:-5.5px; }
  .thought .tdot.d2{ width:6px;height:6px; border:1.6px solid #0f172a; bottom:-25px; left:37%; margin-left:-3px; }

  .hint{
    position:absolute;left:0;right:0;
    bottom:max(80px,calc(env(safe-area-inset-bottom) + 72px));
    z-index:20;text-align:center;
    font-size:11px;font-weight:700;
    color:var(--ink-muted);opacity:.55;pointer-events:none;
    transition:opacity .4s ease;
  }
  .hint.fade-out{opacity:0;}

  .share-modal{
    position:absolute;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:16px;
    background:rgba(10,20,40,.72);
  }
  .share-modal.open{display:flex;}
  .share-card{
    position:relative;
    width:min(430px, 94vw);
    max-height:96vh;
    background:#ffffff;
    border-radius:28px;
    padding:20px;
    box-shadow:0 30px 80px rgba(10,20,40,.4);
    display:flex;flex-direction:column;
    gap:14px;
    overflow:hidden;
  }
  .share-close{
    position:absolute;
    top:14px;inset-inline-end:14px;
    width:34px;height:34px;border-radius:50%;
    background:#f1f5f9;border:0;color:#64748b;
    font-size:16px;font-weight:900;
    display:grid;place-items:center;cursor:pointer;
    z-index:5;
  }
  .share-close:active{transform:scale(.9);}
  .share-header{text-align:center;padding:0 34px;}
  .share-header h2{margin:0 0 4px;font-size:20px;font-weight:950;color:#0f172a;}
  .share-header p{margin:0;font-size:12px;font-weight:700;color:#64748b;}
  .share-preview{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    padding:8px;border-radius:18px;
    background:linear-gradient(135deg, #eef5ff 0%, #dceaff 100%);
    overflow:hidden;
  }
  #shareCanvas{
    display:block;width:auto;height:auto;
    max-height:min(50vh, 420px);
    max-width:100%;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(10,30,70,.22);
  }
  .share-actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;}
  .share-btn{
    width:100%;border:0;border-radius:14px;
    padding:13px 18px;font-family:inherit;
    font-size:14px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s;
  }
  .share-btn:active{transform:scale(.97);}
  .share-btn.primary{
    background:linear-gradient(135deg,#1489ff,#0069e5);color:#fff;
    box-shadow:0 8px 20px rgba(0,105,229,.28);
  }
  .share-btn.ghost{background:#f1f5f9;color:#334155;font-size:13px;}

  @media (max-width:520px){
    .brand{font-size:15px;}
    .stats{gap:12px;}
    .stat b{font-size:15px;}
    .ctrl-btn{width:38px;height:38px;}
    .ctrl-btn svg{width:18px;height:18px;}
  }
  @media (max-height:680px){
    .share-header h2{font-size:17px;}
    #shareCanvas{max-height:44vh;}
    .share-btn{padding:11px 16px;font-size:13px;}
    .share-card{padding:16px;gap:10px;}
  }
</style>
</head>
<body>

<div class="game">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <div class="topbar">
      <div class="brand">🎮 العب مع <em>ناوي</em></div>
      <div class="stats">
        <div class="stat"><span>النقاط</span><b id="score">0</b></div>
        <div class="stat"><span>الأفضل</span><b id="best">0</b></div>
        <div class="stat combo" id="comboStat"><span>سلسلة</span><b id="combo">0</b></div>
      </div>
    </div>

    <div class="hud">
      <div class="hud-side">
        <div class="chip shield" id="shieldChip">🛡️ <b id="shieldTime">0</b></div>
        <div class="chip magnet" id="magnetChip">🧲 <b id="magnetTime">0</b></div>
      </div>
      <div class="hud-side">
        <div class="chip stars" id="starsChip">⭐ <b id="stars">0</b></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <canvas class="ov-nawy" id="ovNawy" width="168" height="168"></canvas>
        <h1 id="ovTitle">ناوي جاهز؟</h1>
        <p id="ovText">اضغط في أي مكان عشان تبدأ</p>
        <button type="button" class="button" id="ovBtn">يلا نبدأ</button>
        <button type="button" class="button secondary" id="ovShareBtn" style="display:none;margin-top:8px;">📤 شارك نتيجتك</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="thought" id="thought">
      <span id="thoughtText"></span>
      <i class="tdot d1"></i>
      <i class="tdot d2"></i>
    </div>
    <div class="hint" id="hint">اضغط للنط — Space / ↑</div>

    <div class="control-bar">
      <button type="button" class="ctrl-btn exit" id="exitBtn" aria-label="رجوع"></button>
      <div class="ctrl-sep"></div>
      <button type="button" class="ctrl-btn" id="muteBtn" aria-label="الصوت"></button>
      <button type="button" class="ctrl-btn" id="pauseBtn" aria-label="إيقاف"></button>
    </div>

    <div class="share-modal" id="shareModal">
      <div class="share-card" role="dialog" aria-modal="true">
        <button type="button" class="share-close" id="shareClose" aria-label="إغلاق">✕</button>
        <div class="share-header">
          <h2>شارك نتيجتك 🎉</h2>
          <p>خلّي أصحابك يجربوا يكسرون رقمك</p>
        </div>
        <div class="share-preview">
          <canvas id="shareCanvas" width="1080" height="1920"></canvas>
        </div>
        <div class="share-actions">
          <button type="button" class="share-btn primary" id="shareStoryBtn">📸 شارك على ستوري</button>
          <button type="button" class="share-btn ghost" id="shareTextBtn">💬 شارك كرسالة</button>
          <button type="button" class="share-btn ghost" id="shareDownloadBtn">⬇️ احفظ الصورة</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   UTIL
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];

function roundRectPath(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ============================================================
   ELEMENTS
   ============================================================ */
const stage       = document.getElementById('stage');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d', { alpha: false });
const scoreEl     = document.getElementById('score');
const bestEl      = document.getElementById('best');
const comboEl     = document.getElementById('combo');
const comboStat   = document.getElementById('comboStat');
const starsEl     = document.getElementById('stars');
const overlay     = document.getElementById('overlay');
const ovNawy      = document.getElementById('ovNawy');
const ovTitle     = document.getElementById('ovTitle');
const ovText      = document.getElementById('ovText');
const ovBtn       = document.getElementById('ovBtn');
const ovShareBtn  = document.getElementById('ovShareBtn');
const toastEl     = document.getElementById('toast');
const thoughtEl   = document.getElementById('thought');
const thoughtText = document.getElementById('thoughtText');
const muteBtn     = document.getElementById('muteBtn');
const pauseBtn    = document.getElementById('pauseBtn');
const exitBtn       = document.getElementById('exitBtn');
const hintEl      = document.getElementById('hint');
const shieldChip  = document.getElementById('shieldChip');
const shieldTime  = document.getElementById('shieldTime');
const magnetChip  = document.getElementById('magnetChip');
const magnetTime  = document.getElementById('magnetTime');

const shareModal      = document.getElementById('shareModal');
const shareClose      = document.getElementById('shareClose');
const shareCanvas     = document.getElementById('shareCanvas');
const shareStoryBtn   = document.getElementById('shareStoryBtn');
const shareTextBtn    = document.getElementById('shareTextBtn');
const shareDownloadBtn= document.getElementById('shareDownloadBtn');

/* ============================================================
   CONSTANTS
   ============================================================ */
const GRAVITY    = 2300;
const JUMP_V     = -820;
const MAX_FALL   = 1900;
const BASE_SPEED = 6.2;
const MAX_SPEED  = 14.2;
const COYOTE     = 0.12;
const JUMP_BUF   = 0.14;
const SUN_CYCLE  = 240;
const DEATH_DUR  = 0.85;

const RENDER_MAX_W = 800;
const MAX_PARTICLES = 60;
const FPS_CAP = 60;
const FRAME_MIN_MS = 1000 / FPS_CAP - 2;

const MILESTONES = [
  'برافو! 🔥','كمّل يا بطل! 💪','إيه الحلاوة دي! ✨',
  'ناوي مبسوط! 😄','ماشي صح! 🚀','تركيز عالي! 🎯',
  'يلا كمان! ⚡','أنت نجم! 🌟','مستمر! 💥'
];
let lastMilestoneIdx = -1;
function pickMilestone(){
  if (MILESTONES.length < 2) return MILESTONES[0];
  let i;
  do { i = (Math.random() * MILESTONES.length) | 0; } while (i === lastMilestoneIdx);
  lastMilestoneIdx = i;
  return MILESTONES[i];
}

/* ============================================================
   STATE
   ============================================================ */
let W=0, H=0, groundY=0;
let state = 'ready';
let ovAction = 'start';
let score = 0, lastShown = -1, milestone = 0;
let starCount = 0, combo = 0;
let speed = BASE_SPEED;
let best = 0;
try { best = Number(localStorage.getItem('nawy.best.v14')) || 0; } catch(e){}

let shake = 0;
let hitStop = 0;
let obstacleTimer = 0, starTimer = 0, powerTimer = 0, cloudTimer = 0;
let hillOff1 = 0, hillOff2 = 0, groundOff = 0;
let lastT = 0, overAt = 0;
let worldTime = 0;
let lastRunRecord = false;

let sunPos = { x: 0, y: 0 };

const obstacles = [];
const stars     = [];
const powerups  = [];
const clouds    = [];
const particles = [];

/* ============================================================
   🎨 SPRITES
   ============================================================ */
let skySprite = null;
let sunSprite = null;
let cloudSprites = [];
let farHillsSprite = null;
let nearHillsSprite = null;
let groundSprite = null;
let groundTop = 0;

function drawBushOnSprite(c, x, baseY){
  c.fillStyle = '#a8d5a8';
  c.beginPath();
  c.arc(x,      baseY - 4, 6, 0, TAU);
  c.arc(x + 8,  baseY - 6, 8, 0, TAU);
  c.arc(x + 18, baseY - 4, 6, 0, TAU);
  c.fill();
}

function buildSprites(){
  skySprite = document.createElement('canvas');
  skySprite.width = Math.max(1, W);
  skySprite.height = Math.max(1, groundY + 1);
  {
    const c = skySprite.getContext('2d');
    const g = c.createLinearGradient(0, 0, 0, groundY + 1);
    g.addColorStop(0,    '#bfddf5');
    g.addColorStop(0.55, '#d8ebfa');
    g.addColorStop(1,    '#ecf5fc');
    c.fillStyle = g;
    c.fillRect(0, 0, W, groundY + 1);
  }

  const sunR = Math.max(20, W * 0.020);
  const haloR = sunR * 3.2;
  const sz = Math.ceil(haloR * 2 + 4);
  sunSprite = document.createElement('canvas');
  sunSprite.width = sz;
  sunSprite.height = sz;
  sunSprite.cx = sz / 2;
  {
    const c = sunSprite.getContext('2d');
    const cx = sz / 2;
    const halo = c.createRadialGradient(cx, cx, 0, cx, cx, haloR);
    halo.addColorStop(0,   'rgba(255,240,180,.42)');
    halo.addColorStop(0.4, 'rgba(255,240,180,.16)');
    halo.addColorStop(1,   'rgba(255,240,180,0)');
    c.fillStyle = halo;
    c.beginPath(); c.arc(cx, cx, haloR, 0, TAU); c.fill();

    const sunG = c.createRadialGradient(cx - sunR*0.2, cx - sunR*0.2, 0, cx, cx, sunR);
    sunG.addColorStop(0,  '#fffbe8');
    sunG.addColorStop(.6, '#ffeaa7');
    sunG.addColorStop(1,  '#fdd97a');
    c.fillStyle = sunG;
    c.beginPath(); c.arc(cx, cx, sunR, 0, TAU); c.fill();
  }

  cloudSprites = [];
  for (let v = 0; v < 2; v++){
    const cw = 100 + v * 35;
    const ch = Math.round(cw * 0.55);
    const cv = document.createElement('canvas');
    cv.width = cw;
    cv.height = ch;
    const c = cv.getContext('2d');
    c.fillStyle = 'rgba(255,255,255,.82)';
    const r = cw * 0.20;
    const bx = cw * 0.18;
    const by = ch * 0.62;
    c.beginPath();
    c.arc(bx,             by,           r,        0, TAU);
    c.arc(bx + r*1.15,    by - r*0.55,  r*1.20,   0, TAU);
    c.arc(bx + r*2.30,    by,           r*0.92,   0, TAU);
    c.arc(bx + r*1.20,    by + r*0.35,  r*0.85,   0, TAU);
    c.fill();
    cloudSprites.push(cv);
  }

  const farH = 60;
  farHillsSprite = document.createElement('canvas');
  farHillsSprite.width = Math.max(1, W);
  farHillsSprite.height = farH;
  {
    const c = farHillsSprite.getContext('2d');
    c.fillStyle = 'rgba(190,215,240,.55)';
    c.beginPath();
    c.moveTo(0, farH);
    for (let x = 0; x <= W; x += 12){
      const y = farH - 26 - Math.sin(x / W * TAU * 2) * 15 - Math.sin(x / W * TAU * 5) * 5;
      c.lineTo(x, y);
    }
    c.lineTo(W, farH);
    c.closePath();
    c.fill();
  }

  const nearH = 46;
  nearHillsSprite = document.createElement('canvas');
  nearHillsSprite.width = Math.max(1, W);
  nearHillsSprite.height = nearH;
  {
    const c = nearHillsSprite.getContext('2d');
    c.fillStyle = 'rgba(210,228,245,.7)';
    c.beginPath();
    c.moveTo(0, nearH);
    for (let x = 0; x <= W; x += 12){
      const y = nearH - 12 - Math.sin(x / W * TAU * 3) * 10 - Math.sin(x / W * TAU * 7) * 4;
      c.lineTo(x, y);
    }
    c.lineTo(W, nearH);
    c.closePath();
    c.fill();
  }

  groundTop = groundY - 14;
  const gH = H - groundTop;
  groundSprite = document.createElement('canvas');
  groundSprite.width = Math.max(1, W);
  groundSprite.height = Math.max(1, gH);
  {
    const c = groundSprite.getContext('2d');
    const lineY = 14;
    c.fillStyle = '#f5f9fc';
    c.fillRect(0, lineY, W, gH - lineY);
    c.fillStyle = '#334155';
    c.fillRect(0, lineY, W, 2);

    const dashCount = Math.max(2, Math.round(W / 56));
    const dashGap = W / dashCount;
    c.fillStyle = '#cbd5e1';
    for (let i = 0; i < dashCount; i++){
      const x = i * dashGap;
      c.beginPath(); c.arc(x, lineY + 20, 1.6, 0, TAU); c.fill();
    }

    const bushCount = Math.max(1, Math.round(W / 340));
    const bushGap = W / bushCount;
    for (let i = 0; i < bushCount; i++){
      drawBushOnSprite(c, i * bushGap + bushGap * 0.3, lineY);
    }
  }
}

let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem('nawy.muted.v14') === '1'; } catch(e){}

function unlockAudio(){
  if (muted) return;
  try {
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function beep(f, dur, type, vol, slideTo, delay){
  if (muted) return;
  try {
    unlockAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
function sfx(name){
  switch(name){
    case 'jump':      beep(430,0.11,'square',0.038,720); break;
    case 'land':      beep(160,0.06,'sine',0.028,110); break;
    case 'coin':      beep(1000,0.08,'sine',0.045,1500);
                      beep(1500,0.08,'sine',0.025,1900,0.06); break;
    case 'hit':       beep(220,0.35,'sawtooth',0.055,55); break;
    case 'power':     beep(500,0.08,'sine',0.038,800); break;
    case 'shield':    beep(360,0.09,'triangle',0.045,560); break;
    case 'milestone': beep(660,0.11,'triangle',0.042,660);
                      beep(880,0.14,'triangle',0.042,880,0.10); break;
    case 'record':    beep(660,0.09,'sine',0.045,660);
                      beep(880,0.09,'sine',0.045,880,0.09);
                      beep(1200,0.14,'sine',0.038,1200,0.18); break;
  }
}
function sfxCoin(tier){
  const base = 1000 + Math.min(tier, 6) * 60;
  beep(base,     0.08, 'sine', 0.045, base * 1.5);
  beep(base*1.5, 0.08, 'sine', 0.025, base * 1.9, 0.06);
}
function vibrate(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

function addP(p){
  if (particles.length > MAX_PARTICLES) return;
  p.rot = p.rot || 0; p.rotSpd = p.rotSpd || 0;
  p.g = p.g || 0; p.drag = p.drag || 0;
  p.maxLife = p.life;
  particles.push(p);
}
function burstDust(x, y, n){
  for (let i=0;i<n;i++){
    addP({
      type:'dust', x: x + rand(-6,6), y: y + rand(-3,2),
      vx: rand(-90,-20), vy: rand(-65,-10),
      g: 220, drag: 2.8, size: rand(1.8,3.6),
      life: rand(0.28,0.50), color: '#b0bcc9'
    });
  }
}
function burstSparkle(x, y, n){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU), sp = rand(45,150);
    addP({
      type:'spark', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
      g: 260, drag: 2.1, size: rand(1.8,3.2),
      life: rand(0.30,0.52),
      color: pick(['#fbbf24','#fcd34d','#f59e0b','#fde68a'])
    });
  }
}
function burstConfetti(x, y, n){
  const colors = ['#2563eb','#60a5fa','#fbbf24','#34d399','#f472b6'];
  for (let i=0;i<n;i++){
    const a = rand(-Math.PI, 0), sp = rand(120, 300);
    addP({
      type:'confetti', x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      g: 700, drag: 0.65, size: rand(5,9),
      rot: rand(0,TAU), rotSpd: rand(-12,12),
      life: rand(0.65,1.2),
      color: pick(colors)
    });
  }
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.vy += p.g * dt;
    if (p.drag){ const d = Math.max(0, 1 - p.drag*dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotSpd * dt;
  }
}

/* ============================================================
   RESIZE
   ============================================================ */
let lastResizeW = 0, lastResizeH = 0;

function resize(){
  const rect = canvas.getBoundingClientRect();
  const nW = Math.max(1, Math.round(rect.width));
  const nH = Math.max(1, Math.round(rect.height));

  if (nW === lastResizeW && nH === lastResizeH && groundY) return;
  lastResizeW = nW;
  lastResizeH = nH;

  W = nW;
  H = nH;

  let rw = W, rh = H;
  if (rw > RENDER_MAX_W){
    const s = RENDER_MAX_W / rw;
    rw = RENDER_MAX_W;
    rh = Math.max(1, Math.round(rh * s));
  }

  canvas.width  = rw;
  canvas.height = rh;

  const sx = rw / W;
  const sy = rh / H;
  ctx.setTransform(sx, 0, 0, sy, 0, 0);

  const oldGround = groundY;
  groundY = Math.round(H - Math.max(60, H * 0.18));
  player.size = clamp(Math.round(H * 0.082), 26, 42);

  if (!oldGround){
    player.y = groundY - player.size;
  } else if (oldGround !== groundY){
    const dy = groundY - oldGround;
    for (const o of obstacles) o.y += dy;
    for (const s of stars)     s.y += dy;
    for (const p of powerups)  p.y += dy;
    if (state === 'playing') player.y += dy;
    else player.y = groundY - player.size;
  }
  player.x = Math.max(46, W * 0.14);

  buildSprites();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

function updateSunPos(){
  const t = (worldTime % SUN_CYCLE) / SUN_CYCLE;
  sunPos.x = W * (0.82 - t * 0.64);
  sunPos.y = H * 0.10 + Math.sin(t * Math.PI) * H * 0.10;
}

function spawnCloud(){
  const variant = (Math.random() * cloudSprites.length) | 0;
  const spr = cloudSprites[variant];
  clouds.push({
    x: W + 40,
    y: rand(H * 0.08, groundY * 0.32),
    w: spr.width, h: spr.height, variant,
    spd: rand(5, 11)
  });
}
function updateClouds(dt){
  const worldSpeed = (state === 'playing') ? speed * 60 : 60;
  cloudTimer -= dt;
  if (cloudTimer <= 0){ spawnCloud(); cloudTimer = rand(6, 12); }
  for (let i = clouds.length-1; i >= 0; i--){
    const c = clouds[i];
    c.x -= (c.spd + worldSpeed * 0.04) * dt;
    if (c.x + c.w < -40) clouds.splice(i, 1);
  }
}

/* ============================================================
   DRAW
   ============================================================ */
function drawStars(){
  for (const s of stars){
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a  = -Math.PI/2 + i * Math.PI/5;
      const rr = (i % 2) ? s.r * 0.45 : s.r;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
    ctx.restore();
  }
}

function drawPowerups(){
  for (const p of powerups){
    const y = p.y + Math.sin(p.bob) * 5;
    ctx.beginPath();
    ctx.arc(p.x, y, p.r, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = p.type === 'shield' ? '#55a9ff' : '#f1b72f';
    ctx.stroke();
    ctx.font = '900 15px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'shield' ? '🛡️' : '🧲', p.x, y + 1);
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function drawObstacles(){
  for (const o of obstacles){
    // ظل خفيف
    ctx.fillStyle = 'rgba(30,41,59,.12)';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w/2, groundY + 3, o.w*0.45, 3.5, 0, 0, TAU);
    ctx.fill();

    if (o.wide){
      // عقبة عريضة
      ctx.fillStyle = '#1e293b';
      roundRectPath(ctx, o.x, o.y, o.w, o.h, 7);
      ctx.fill();
      // شريط تحذيري
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(o.x + 4, o.y + 4, o.w - 8, 4);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      for (let gx = o.x + 8; gx < o.x + o.w - 6; gx += 10){
        ctx.fillRect(gx, o.y + 12, 3, o.h - 20);
      }
    } else {
      ctx.fillStyle = '#334155';
      roundRectPath(ctx, o.x, o.y, o.w, o.h, 6);
      ctx.fill();
      // تفاصيل بسيطة
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(o.x + 4, o.y + 5, 3, o.h - 12);
    }
  }
}

function drawPlayer(){
  const s  = player.size;
  const cx = player.x + s/2;
  const cy = player.y + s/2;
  const R  = s/2;

  const dying = player.deathT >= 0;
  const airH = clamp((groundY - player.y - s) / 170, 0, 1);

  if (!dying || player.deathT < DEATH_DUR * 0.5){
    ctx.globalAlpha = 0.14 * (1 - airH*0.7);
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 4, s*0.42*(1-airH*0.4), 4.5*(1-airH*0.4), 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (player.shield > 0 && !dying){
    const pulse = 1 + Math.sin(worldTime * 8) * 0.05;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#55a9ff';
    ctx.beginPath(); ctx.arc(0, 0, R + 10, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);

  const sq = clamp(player.squash, 0.82, 1.18);
  ctx.scale(1 / Math.sqrt(sq), sq);
  ctx.rotate(player.rotation * 0.4);

  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fill();

  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-R*0.30, -R*0.42, R*0.28, R*0.14, -0.5, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  const blinkingNow = player.blinking > 0;
  player.pupilX += (player.pupilTargetX - player.pupilX) * 0.18;
  player.pupilY += (player.pupilTargetY - player.pupilY) * 0.18;
  const mood = player.mood;

  if (mood === 'hit'){
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.13);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.05, er = R*0.22;
    ctx.beginPath();
    ctx.moveTo(-ex-er, ey-er); ctx.lineTo(-ex+er, ey+er);
    ctx.moveTo(-ex+er, ey-er); ctx.lineTo(-ex-er, ey+er);
    ctx.moveTo( ex-er, ey-er); ctx.lineTo( ex+er, ey+er);
    ctx.moveTo( ex+er, ey-er); ctx.lineTo( ex-er, ey+er);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-R*0.28, R*0.32); ctx.lineTo(-R*0.14, R*0.22);
    ctx.lineTo( 0,      R*0.32); ctx.lineTo( R*0.14, R*0.22);
    ctx.lineTo( R*0.28, R*0.32); ctx.stroke();
  } else if (mood === 'happy'){
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.2, R*0.12);
    ctx.lineCap = 'round';
    const ex = R*0.40, ey = -R*0.10, er = R*0.22;
    ctx.beginPath();
    ctx.arc(-ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc( ex, ey+R*0.05, er, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.stroke();
  } else if (mood === 'record'){
    ctx.fillStyle = '#fbbf24';
    for (const dir of [-1, 1]){
      ctx.save();
      ctx.translate(dir * R*0.40, -R*0.08);
      ctx.beginPath();
      for (let i = 0; i < 10; i++){
        const a  = -Math.PI/2 + i * Math.PI/5;
        const rr = (i%2) ? R*0.10 : R*0.22;
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2.4, R*0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, R*0.05, R*0.40, Math.PI*0.20, Math.PI*0.80);
    ctx.stroke();
  } else if (mood === 'focus'){
    const eyeW = R*0.28, eyeH = R*0.10;
    const ex = R*0.40, ey = -R*0.06;
    ctx.fillStyle = '#fff';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(dir*ex, ey, eyeW, eyeH, 0, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#0f172a';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.arc(dir*ex + player.pupilX*R*0.4, ey + player.pupilY*R*0.3, R*0.07, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R*0.22, R*0.30);
    ctx.lineTo( R*0.22, R*0.30);
    ctx.stroke();
  } else {
    const eyeR = R*0.30;
    const eyeX = R*0.38;
    const baseEyeY = -R*0.08;

    if (blinkingNow){
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = Math.max(2, R*0.10);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo(-eyeX + eyeR*0.8, baseEyeY);
      ctx.moveTo( eyeX - eyeR*0.8, baseEyeY);
      ctx.lineTo( eyeX + eyeR*0.8, baseEyeY);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.arc( eyeX, baseEyeY, eyeR, 0, TAU);
      ctx.fill();
      const pupilR = eyeR * 0.55;
      ctx.fillStyle = '#0f172a';
      for (const dir of [-1, 1]){
        ctx.beginPath();
        ctx.arc(dir*eyeX + player.pupilX*eyeR*0.5,
                baseEyeY + player.pupilY*eyeR*0.5,
                pupilR, 0, TAU);
        ctx.fill();
      }
    }

    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(2, R*0.10);
    ctx.lineCap = 'round';

    if (mood === 'jump'){
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.10, R*0.13, 0, 0, TAU);
      ctx.stroke();
    } else if (mood === 'fall'){
      ctx.beginPath();
      ctx.ellipse(0, R*0.30, R*0.14, R*0.16, 0, 0, TAU);
      ctx.stroke();
    } else {
      ctx.beginPath();
      if (player.grounded){
        ctx.arc(0, R*0.10, R*0.30, Math.PI*0.25, Math.PI*0.75);
      } else {
        ctx.arc(0, R*0.28, R*0.14, 0, TAU);
      }
      ctx.stroke();
    }
  }

  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#fb7185';
  ctx.beginPath();
  ctx.arc(-R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.arc( R*0.62, R*0.18, R*0.14, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.type === 'confetti'){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  ctx.save();
  if (shake > 0.2){
    ctx.translate(rand(-shake,shake)*0.4, rand(-shake,shake)*0.4);
  }

  ctx.drawImage(skySprite, 0, 0);

  ctx.drawImage(
    sunSprite,
    sunPos.x - sunSprite.cx,
    sunPos.y - sunSprite.cx
  );

  for (const c of clouds){
    const spr = cloudSprites[c.variant];
    if (spr) ctx.drawImage(spr, c.x, c.y);
  }

  const farY = groundY - farHillsSprite.height + 2;
  const farOff = hillOff1 % W;
  ctx.drawImage(farHillsSprite, -farOff, farY);
  ctx.drawImage(farHillsSprite, W - farOff, farY);

  const nearY = groundY - nearHillsSprite.height + 2;
  const nearOff = hillOff2 % W;
  ctx.drawImage(nearHillsSprite, -nearOff, nearY);
  ctx.drawImage(nearHillsSprite, W - nearOff, nearY);

  const gOff = groundOff % W;
  ctx.drawImage(groundSprite, -gOff, groundTop);
  ctx.drawImage(groundSprite, W - gOff, groundTop);

  drawStars();
  drawPowerups();
  drawObstacles();
  drawParticles();

  if (state !== 'over' || player.deathT >= 0) drawPlayer();

  ctx.restore();
}

/* ============================================================
   SPAWNERS
   ============================================================ */
function getDifficulty(){
  // منحنى أنعم وأعدل
  return 1 - Math.exp(-score / 1600);
}

function spawnObstacle(){
  const d = getDifficulty();
  const r = Math.random();

  // فرصة لعقبة مزدوجة (اثنين قريبين)
  if (d > 0.25 && r < 0.18){
    const h1 = rand(30, 48);
    const h2 = rand(28, 52);
    obstacles.push({
      x: W + 40, w: 22, h: h1,
      y: groundY - h1, wide: false, passed: false, minGap: Infinity
    });
    obstacles.push({
      x: W + 40 + rand(55, 78), w: 22, h: h2,
      y: groundY - h2, wide: false, passed: false, minGap: Infinity
    });
    return;
  }

  // عقبة عريضة
  if (d > 0.35 && r < 0.28){
    const w = rand(48, 68);
    const h = rand(26, 36);
    obstacles.push({
      x: W + 40, w, h,
      y: groundY - h, wide: true, passed: false, minGap: Infinity
    });
    return;
  }

  // عقبات عادية متنوعة حسب الصعوبة
  let w, h;
  if (d < 0.25){
    w = 24; h = rand(28, 40);
  } else if (d < 0.50){
    if (r < 0.55){ w = 24; h = rand(32, 46); }
    else         { w = 22; h = rand(40, 54); }
  } else if (d < 0.75){
    if (r < 0.40){ w = 24; h = rand(34, 48); }
    else if (r < 0.75){ w = 22; h = rand(44, 58); }
    else { w = 20; h = rand(52, 64); }
  } else {
    if (r < 0.30){ w = 24; h = rand(36, 50); }
    else if (r < 0.60){ w = 22; h = rand(46, 62); }
    else if (r < 0.85){ w = 20; h = rand(54, 68); }
    else { w = 18; h = rand(58, 72); }
  }
  obstacles.push({ x: W + 40, w, h, y: groundY - h, wide: false, passed:false, minGap: Infinity });
}

function spawnStarArc(){
  const startX = W + 90;
  for (const o of obstacles){
    if (o.x < startX + 140 && o.x + o.w > startX - 40) return;
  }
  const d = getDifficulty();
  const n = d > 0.45 ? (Math.random() < 0.55 ? 4 : 5) : 3;
  const baseY = groundY - rand(100, 145);
  for (let i = 0; i < n; i++){
    stars.push({
      x: startX + i*34,
      y: baseY - Math.sin((i/(n-1 || 1)) * Math.PI) * 26,
      r: 10, rot: rand(0, TAU)
    });
  }
}

function spawnPowerup(force){
  if (powerups.length >= 1 && !force) return;
  const type = Math.random() < 0.55 ? 'shield' : 'magnet';
  powerups.push({
    x: W + 60, y: groundY - rand(105, 170),
    r: 15, type, bob: Math.random() * TAU
  });
}

/* ============================================================
   AMBIENT
   ============================================================ */
function updateAmbient(dt){
  const worldSpeed = (state === 'playing') ? speed * 60 : 60;
  hillOff1  += worldSpeed * 0.04 * dt;
  hillOff2  += worldSpeed * 0.10 * dt;
  groundOff += worldSpeed * dt;
}
function updatePlayerMood(dt){
  if (player.moodTimer > 0){
    player.moodTimer -= dt;
    if (player.moodTimer <= 0){
      player.mood = player.grounded ? 'idle' : (player.vy < 0 ? 'jump' : 'fall');
    }
  } else {
    if (!player.grounded) player.mood = player.vy < 0 ? 'jump' : 'fall';
    else player.mood = 'idle';
  }
  if (player.mood === 'jump'){ player.pupilTargetX = 0.4; player.pupilTargetY = -0.7; }
  else if (player.mood === 'fall'){ player.pupilTargetX = 0.4; player.pupilTargetY = 0.7; }
  else if (player.mood === 'focus'){ player.pupilTargetX = 0.6; player.pupilTargetY = 0; }
  else { player.pupilTargetX = 0.35; player.pupilTargetY = 0; }
}

/* ============================================================
   DEATH ANIMATION
   ============================================================ */
function updateDeath(dt){
  if (player.deathT < 0) return;
  player.deathT += dt;
  if (player.deathT >= DEATH_DUR){
    player.deathT = -1;
    return;
  }
  player.deathVy += GRAVITY * dt;
  player.y += player.deathVy * dt;
  player.rotation += 18 * dt;
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  player.y += player.vy * dt;

  const floor = groundY - player.size;
  if (player.y >= floor){
    if (!player.grounded){
      player.squash = 0.82;
      burstDust(player.x + player.size/2, groundY, 4);
      sfx('land');
    }
    player.y = floor; player.vy = 0; player.grounded = true;
  } else player.grounded = false;

  player.squash += (1 - player.squash) * 13 * dt;
  if (Math.abs(player.squash - 1) < 0.002) player.squash = 1;

  if (player.grounded) player.coyote = COYOTE;
  else player.coyote = Math.max(0, player.coyote - dt);

  if (player.grounded && player.jumpBuf > 0){
    player.jumpBuf = 0;
    doJump();
  } else {
    player.jumpBuf = Math.max(0, player.jumpBuf - dt);
  }

  player.blinkTimer -= dt;
  if (player.blinkTimer <= 0){ player.blinking = 0.13; player.blinkTimer = rand(2.2, 5.5); }
  if (player.blinking > 0) player.blinking -= dt;

  updatePlayerMood(dt);

  score += dt * (12 + getDifficulty() * 7);
  const shown = Math.floor(score);
  if (shown !== lastShown){ lastShown = shown; scoreEl.textContent = shown; }

  // منحنى سرعة أكثر سلاسة
  speed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.0115);

  const ms = Math.floor(score / 100);
  if (ms > milestone){
    milestone = ms;
    showThought(pickMilestone());
    sfx('milestone');
    setMood('happy', 0.65);
  }

  obstacleTimer -= dt;
  if (obstacleTimer <= 0){
    spawnObstacle();
    const d = getDifficulty();
    const base = 1.55 - d * 0.68;
    obstacleTimer = base * rand(0.86, 1.14);
  }

  const dx = speed * 60 * dt;

  // hitbox أصغر شوية وأكثر عدلًا مع اللاعب
  const pHit = {
    x: player.x + player.size * 0.22,
    y: player.y + player.size * 0.20,
    w: player.size * 0.58,
    h: player.size * 0.68
  };

  for (let i = obstacles.length-1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= dx;
    if (o.x + o.w < -30){ obstacles.splice(i,1); continue; }

    // تتبع أقرب مسافة عمودية وقت التداخل الأفقي — لإحساس "نجا بالزق"
    if (o.x < player.x + player.size && o.x + o.w > player.x){
      const gap = o.y - (player.y + player.size);
      if (gap < o.minGap) o.minGap = gap;
    }

    if (pHit.x < o.x + o.w && pHit.x + pHit.w > o.x &&
        pHit.y < o.y + o.h && pHit.y + pHit.h > o.y){
      if (player.shield > 0){
        player.shield = 0;
        burstSparkle(player.x + player.size/2, player.y + player.size/2, 12);
        sfx('shield');
        obstacles.splice(i,1);
        setMood('happy', 0.55);
        continue;
      }
      gameOver();
      return;
    }
    if (!o.passed && o.x + o.w < player.x){
      o.passed = true;
      combo++;
      comboEl.textContent = combo;
      if (combo >= 2) comboStat.classList.add('show');
      if (combo % 10 === 0){
        setMood('focus', 0.45);
      }
      if (o.minGap < player.size * 0.3){
        burstSparkle(player.x + player.size/2, player.y + player.size*0.2, 4);
      }
    }
  }

  starTimer -= dt;
  if (starTimer <= 0){
    spawnStarArc();
    const d = getDifficulty();
    starTimer = rand(2.2, 4.5) * (1 - d * 0.28);
  }

  const pcx = player.x + player.size/2;
  const pcy = player.y + player.size/2;
  const pickupR = player.size * 0.48;

  for (let i = stars.length-1; i >= 0; i--){
    const s = stars[i];
    s.x -= dx; s.rot += dt * 2.2;
    if (s.x < -30){ stars.splice(i,1); continue; }

    if (player.magnet > 0){
      const ddx = pcx - s.x, ddy = pcy - s.y;
      const d = Math.hypot(ddx, ddy);
      if (d < 210 && d > 1){
        const f = 1 - d/210;
        s.x += ddx * dt * (5.5 + f*9);
        s.y += ddy * dt * (5.5 + f*9);
      }
    }

    const ddx = pcx - s.x, ddy = pcy - s.y;
    const rr  = s.r + pickupR;
    if (ddx*ddx + ddy*ddy < rr*rr){
      stars.splice(i,1);
      // الكومبو يؤثر على قيمة النجمة
      score += 10 * (1 + Math.floor(combo / 4) * 0.35);
      starCount++;
      starsEl.textContent = starCount;
      burstSparkle(s.x, s.y, 6);
      sfxCoin(Math.floor(combo / 4)); setMood('happy', 0.45);
    }
  }

  powerTimer -= dt;
  if (powerTimer <= 0){ spawnPowerup(); powerTimer = rand(8.5, 12.5); }

  for (let i = powerups.length-1; i >= 0; i--){
    const p = powerups[i];
    p.x -= dx; p.bob += dt * 4;
    const py = p.y + Math.sin(p.bob) * 5;
    const d = Math.hypot(pcx - p.x, pcy - py);
    if (d < player.size * 0.7 + p.r){
      if (p.type === 'shield'){
        player.shield = 10; sfx('shield');
      } else {
        player.magnet = 10; sfx('power');
      }
      burstSparkle(p.x, py, 9);
      powerups.splice(i,1); setMood('happy', 0.55);
      continue;
    }
    if (p.x < -60) powerups.splice(i,1);
  }

  if (player.shield > 0){
    player.shield -= dt;
    if (player.shield < 0) player.shield = 0;
    shieldChip.classList.add('show');
    shieldTime.textContent = Math.ceil(player.shield) + 'ث';
  } else shieldChip.classList.remove('show');

  if (player.magnet > 0){
    player.magnet -= dt;
    if (player.magnet < 0) player.magnet = 0;
    magnetChip.classList.add('show');
    magnetTime.textContent = Math.ceil(player.magnet) + 'ث';
  } else magnetChip.classList.remove('show');
}

function doJump(){
  player.vy = JUMP_V;
  player.grounded = false;
  player.squash = 1.18;
  player.coyote = 0; player.jumpBuf = 0;
  burstDust(player.x + player.size/2, groundY, 4);
  sfx('jump'); setMood('jump', 0.28);
  hintEl.classList.add('fade-out');
}

function jump(){
  if (state !== 'playing') return;
  if (player.grounded || player.coyote > 0){
    doJump();
  } else {
    player.jumpBuf = JUMP_BUF;
  }
}

function onTap(e){
  if (e && e.preventDefault) e.preventDefault();
  if (state === 'playing'){
    jump();
    return;
  }
  if (state === 'paused'){ resumeGame(); return; }
  if (state === 'over' && performance.now() - overAt < 500) return;
  startGame();
}
canvas.addEventListener('pointerdown', onTap, { passive:false });

ovBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
});
ovBtn.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  if (ovAction === 'resume'){
    resumeGame();
  } else {
    startGame();
  }
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'playing') jump(); else onTap(null);
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});

   UI
   ============================================================ */
let toastQueue = [];
let toastBusy = false;
function processToastQueue(){
  if (toastBusy || toastQueue.length === 0) return;
  toastBusy = true;
  const text = toastQueue.shift();
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(() => {
    toastEl.classList.remove('show');
    setTimeout(() => { toastBusy = false; processToastQueue(); }, 180);
  }, 1300);
}
function showToast(text){
  // لو في رسالة ظاهرة وواحدة منتظرة بالفعل، ما نزودش الزحمة
  if (toastBusy && toastQueue.length >= 1) return;
  toastQueue.push(text);
  processToastQueue();
}

let thoughtTimeout = null;
let thoughtVisible = false;
function showThought(text){
  thoughtText.textContent = text;
  thoughtVisible = true;
  thoughtEl.classList.add('show');
  clearTimeout(thoughtTimeout);
  thoughtTimeout = setTimeout(() => { thoughtVisible = false; thoughtEl.classList.remove('show'); }, 1900);
  updateThoughtPos();
}
function updateThoughtPos(){
  if (!thoughtVisible) return;
  // بيتابع مكان ناوي الفعلي كل فريم (بما فيه وقت القفز) — نفس نظام إحداثيات اللعب
  thoughtEl.style.left = (player.x + player.size * 0.55) + 'px';
  thoughtEl.style.top  = (player.y - 6) + 'px';
}
/* ============================================================
   NAWY MINI PORTRAIT (overlay)
   ============================================================ */
function drawNawyPortrait(canvas, mood){
  const c  = canvas.getContext('2d');
  const w  = canvas.width, h = canvas.height;
  c.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 * 0.86;

  // جسم ناوي
  c.fillStyle = '#2563eb';
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();

  // لمعة
  c.globalAlpha = 0.32;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.ellipse(cx - R*0.32, cy - R*0.44, R*0.30, R*0.15, -0.5, 0, TAU);
  c.fill();
  c.globalAlpha = 1;

  // عيون أعلى شوية وأصغر عشان تسيب مساحة كافية للفم من غير ما يتلامسوا
  const eyeR = R*0.26, eyeX = R*0.36, eyeY = cy - R*0.20;

  if (mood === 'sad'){
    // خبط — عيون X رفيعة وفم مموج ناعم (مش زاويّ) وبينهم مسافة واضحة
    c.strokeStyle = '#0f172a';
    c.lineWidth = Math.max(2.4, R*0.065);
    c.lineCap = 'round';
    const er = eyeR*0.62;
    c.beginPath();
    c.moveTo(cx-eyeX-er, eyeY-er); c.lineTo(cx-eyeX+er, eyeY+er);
    c.moveTo(cx-eyeX+er, eyeY-er); c.lineTo(cx-eyeX-er, eyeY+er);
    c.moveTo(cx+eyeX-er, eyeY-er); c.lineTo(cx+eyeX+er, eyeY+er);
    c.moveTo(cx+eyeX+er, eyeY-er); c.lineTo(cx+eyeX-er, eyeY+er);
    c.stroke();

    c.lineWidth = Math.max(2.6, R*0.07);
    c.beginPath();
    c.moveTo(cx-R*0.22, cy+R*0.36);
    c.quadraticCurveTo(cx-R*0.11, cy+R*0.27, cx, cy+R*0.36);
    c.quadraticCurveTo(cx+R*0.11, cy+R*0.45, cx+R*0.22, cy+R*0.36);
    c.stroke();
  } else if (mood === 'record'){
    // رقم قياسي — نجوم صغيرة بدل العيون وابتسامة كبيرة هادية
    c.fillStyle = '#fbbf24';
    for (const dir of [-1, 1]){
      c.save();
      c.translate(cx + dir*eyeX, eyeY);
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const a  = -Math.PI/2 + i * Math.PI/5;
        const rr = (i%2) ? eyeR*0.30 : eyeR*0.66;
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        i ? c.lineTo(px,py) : c.moveTo(px,py);
      }
      c.closePath(); c.fill();
      c.restore();
    }
    c.strokeStyle = '#0f172a';
    c.lineWidth = Math.max(2.8, R*0.09);
    c.lineCap = 'round';
    c.beginPath();
    c.arc(cx, cy+R*0.10, R*0.36, Math.PI*0.20, Math.PI*0.80);
    c.stroke();
  } else if (mood === 'paused'){
    // بياخد نفس — عيون مغمضة ناعمة وابتسامة صغيرة هادية
    c.strokeStyle = '#0f172a';
    c.lineWidth = Math.max(2.4, R*0.065);
    c.lineCap = 'round';
    c.beginPath();
    c.arc(cx-eyeX, eyeY+eyeR*0.15, eyeR*0.62, Math.PI*1.08, Math.PI*1.92);
    c.stroke();
    c.beginPath();
    c.arc(cx+eyeX, eyeY+eyeR*0.15, eyeR*0.62, Math.PI*1.08, Math.PI*1.92);
    c.stroke();

    c.lineWidth = Math.max(2.6, R*0.07);
    c.beginPath();
    c.arc(cx, cy+R*0.24, R*0.16, Math.PI*0.18, Math.PI*0.82);
    c.stroke();
  } else {
    // جاهز — عيون مفتوحة وابتسامة هادئة
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(cx-eyeX, eyeY, eyeR, 0, TAU);
    c.arc(cx+eyeX, eyeY, eyeR, 0, TAU);
    c.fill();
    c.fillStyle = '#0f172a';
    c.beginPath();
    c.arc(cx-eyeX+eyeR*0.16, eyeY, eyeR*0.5, 0, TAU);
    c.arc(cx+eyeX+eyeR*0.16, eyeY, eyeR*0.5, 0, TAU);
    c.fill();
    c.strokeStyle = '#0f172a';
    c.lineWidth = Math.max(2.6, R*0.07);
    c.lineCap = 'round';
    c.beginPath();
    c.arc(cx, cy+R*0.18, R*0.28, Math.PI*0.22, Math.PI*0.78);
    c.stroke();
  }

  // خدود
  c.globalAlpha = 0.28;
  c.fillStyle = '#fb7185';
  c.beginPath();
  c.arc(cx-R*0.62, cy+R*0.18, R*0.13, 0, TAU);
  c.arc(cx+R*0.62, cy+R*0.18, R*0.13, 0, TAU);
  c.fill();
  c.globalAlpha = 1;
}

function showOverlay(opt){
  drawNawyPortrait(ovNawy, opt.mood || 'idle');
  ovTitle.textContent = opt.title;
  ovText.innerHTML    = opt.text;
  ovBtn.textContent   = opt.btn;
  ovAction = opt.action || 'start';

      badge.className = 'badge';
      overlay.querySelector('.overlay-inner').appendChild(badge);
    }
    badge.textContent = opt.badge;
  } else if (badge) badge.remove();
  overlay.classList.remove('hidden');
}

function drawNawyForShare(c, cx, cy, R){

  c.fill();

  c.globalAlpha = 0.38;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.ellipse(cx - R*0.32, cy - R*0.44, R*0.32, R*0.16, -0.5, 0, TAU);
  c.fill();
  c.globalAlpha = 1;

  const eyeR = R * 0.30;
  const eyeX = R * 0.38;
  const baseEyeY = cy - R * 0.08;

  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(cx - eyeX, baseEyeY, eyeR, 0, TAU);
  c.arc(cx + eyeX, baseEyeY, eyeR, 0, TAU);
  c.fill();

  const pupilR = eyeR * 0.55;
  c.fillStyle = '#0f172a';

  c.arc(cx - eyeX + eyeR*0.15, baseEyeY, pupilR, 0, TAU);
  c.arc(cx + eyeX + eyeR*0.15, baseEyeY, pupilR, 0, TAU);
  c.fill();

  c.strokeStyle = '#0f172a';
  c.lineWidth = Math.max(4, R * 0.10);
  c.lineCap = 'round';
  c.beginPath();
  c.arc(cx, cy + R*0.10, R*0.32, Math.PI*0.22, Math.PI*0.78);
  c.stroke();

  c.globalAlpha = 0.32;
  c.fillStyle = '#fb7185';
  c.beginPath();
  c.arc(cx - R*0.62, cy + R*0.18, R*0.13, 0, TAU);
  c.arc(cx + R*0.62, cy + R*0.18, R*0.13, 0, TAU);
  c.fill();
  c.globalAlpha = 1;
}

function drawSceneStar(c, x, y, r, alpha){
  c.globalAlpha = alpha;
  c.translate(x, y);
  c.beginPath();
  for (let i = 0; i < 10; i++){
    const a  = -Math.PI/2 + i * Math.PI/5;
    const rr = (i % 2) ? r * 0.45 : r;
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fillStyle = '#fbbf24';
  c.fill();
  c.globalAlpha = 1;
  c.translate(-x, -y);
}

function generateShareCard(){
  const CW = 1080, CH = 1920;
  shareCanvas.width = CW;
  shareCanvas.height = CH;
  const c = shareCanvas.getContext('2d');

  const finalScore = Math.floor(score);
  const isRecord = lastRunRecord;

  const bg = c.createLinearGradient(0, 0, 0, CH);
  bg.addColorStop(0,    '#c9e4f8');
  bg.addColorStop(0.45, '#dceeff');
  bg.addColorStop(1,    '#eaf4fd');
  c.fillStyle = bg;
  c.fillRect(0, 0, CW, CH);

  c.fillStyle = '#1e293b';
  c.font = "900 46px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('🎮 العب مع ناوي', CW/2, 130);

  const sceneX = 90, sceneY = 220;
  const sceneW = CW - 180, sceneH = 620;
  const sceneR = 44;

  c.save();
  roundRectPath(c, sceneX, sceneY, sceneW, sceneH, sceneR);
  c.clip();

  const skyGrad = c.createLinearGradient(sceneX, sceneY, sceneX, sceneY + sceneH);
  skyGrad.addColorStop(0,    '#bfddf5');
  skyGrad.addColorStop(0.55, '#d8ebfa');
  skyGrad.addColorStop(1,    '#ecf5fc');
  c.fillStyle = skyGrad;
  c.fillRect(sceneX, sceneY, sceneW, sceneH);

  const sunX = sceneX + sceneW * 0.78;
  const sunY = sceneY + sceneH * 0.22;
  const sunR = 46;
  const sunGrad = c.createRadialGradient(sunX - sunR*0.2, sunY - sunR*0.2, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0, '#fffbe8');
  sunGrad.addColorStop(.6, '#ffeaa7');
  sunGrad.addColorStop(1, '#fdd97a');
  c.fillStyle = sunGrad;
  c.beginPath(); c.arc(sunX, sunY, sunR, 0, TAU); c.fill();

  function drawCloudScene(x, y, s, alpha){
    c.globalAlpha = alpha;
    c.fillStyle = '#ffffff';
    const r = 32 * s;
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
    c.arc(x + r*1.15, y - r*0.55, r*1.20, 0, TAU);
    c.arc(x + r*2.30, y, r*0.92, 0, TAU);
    c.arc(x + r*1.20, y + r*0.35, r*0.85, 0, TAU);
    c.fill();
    c.globalAlpha = 1;
  }
  drawCloudScene(sceneX + 130, sceneY + 120, 1.05, 0.85);
  drawCloudScene(sceneX + 480, sceneY + 90, 0.80, 0.65);

  c.fillStyle = 'rgba(190,215,240,.60)';
  c.beginPath();
  c.moveTo(sceneX - 5, sceneY + sceneH * 0.70);
  for (let x = -5; x <= sceneW + 5; x += 30){
    const y = sceneY + sceneH * 0.70 - Math.sin(x / 140) * 18 - Math.sin(x / 70) * 7;
    c.lineTo(sceneX + x, y);
  }
  c.lineTo(sceneX + sceneW + 5, sceneY + sceneH + 5);
  c.lineTo(sceneX - 5, sceneY + sceneH + 5);
  c.closePath();
  c.fill();

  c.fillStyle = 'rgba(210,228,245,.82)';
  c.beginPath();
  c.moveTo(sceneX - 5, sceneY + sceneH * 0.82);
  for (let x = -5; x <= sceneW + 5; x += 30){
    const y = sceneY + sceneH * 0.82 - Math.sin(x / 110) * 13 - Math.sin(x / 55) * 5;
    c.lineTo(sceneX + x, y);
  }
  c.lineTo(sceneX + sceneW + 5, sceneY + sceneH + 5);
  c.lineTo(sceneX - 5, sceneY + sceneH + 5);
  c.closePath();
  c.fill();

  const groundLine = sceneY + sceneH * 0.87;
  c.fillStyle = '#f5f9fc';
  c.fillRect(sceneX, groundLine, sceneW, sceneY + sceneH - groundLine + 5);
  c.fillStyle = '#334155';
  c.fillRect(sceneX, groundLine, sceneW, 3);

  c.save();
  drawSceneStar(c, sceneX + 230, sceneY + 330, 18, 0.95);
  drawSceneStar(c, sceneX + 730, sceneY + 280, 15, 0.85);
  drawSceneStar(c, sceneX + 480, sceneY + 200, 13, 0.75);
  c.restore();

  const nawyX = sceneX + sceneW * 0.62;
  const nawyY = groundLine - 70;
  const nawyR = 85;
  drawNawyForShare(c, nawyX, nawyY, nawyR);

  c.globalAlpha = 0.16;
  c.fillStyle = '#1e293b';
  c.beginPath();
  c.ellipse(nawyX, groundLine + 6, nawyR * 0.85, 7, 0, 0, TAU);
  c.fill();
  c.globalAlpha = 1;

  c.restore();

  c.strokeStyle = 'rgba(120,160,200,.32)';
  c.lineWidth = 2;
  roundRectPath(c, sceneX, sceneY, sceneW, sceneH, sceneR);
  c.stroke();

  let yCursor = sceneY + sceneH + 70;

  if (isRecord){
    const badgeW = 380, badgeH = 78;
    const badgeX = CW/2 - badgeW/2;
    c.fillStyle = '#fbbf24';
    roundRectPath(c, badgeX, yCursor, badgeW, badgeH, badgeH/2);
    c.fill();
    c.fillStyle = '#7c2d12';
    c.font = "900 36px Cairo, system-ui, sans-serif";
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.direction = 'rtl';
    c.fillText('🏆 رقم قياسي جديد', CW/2, yCursor + badgeH/2 + 2);
    yCursor += badgeH + 32;
  }

  c.fillStyle = '#64748b';
  c.font = "800 32px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('نتيجتك', CW/2, yCursor + 10);

  c.fillStyle = '#0f172a';
  c.font = "900 200px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'ltr';
  c.fillText(String(finalScore), CW/2, yCursor + 150);

  c.fillStyle = '#2563eb';
  c.font = "900 42px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('نقطة', CW/2, yCursor + 290);

  const statsY = yCursor + 380;
  const pillW = 220, pillH = 86, pillGap = 40;
  const totalW = pillW * 2 + pillGap;
  const startX = CW/2 - totalW/2;

  c.fillStyle = 'rgba(251,191,36,.16)';
  roundRectPath(c, startX, statsY, pillW, pillH, pillH/2);
  c.fill();
  c.strokeStyle = 'rgba(251,191,36,.55)';
  c.lineWidth = 2;
  roundRectPath(c, startX, statsY, pillW, pillH, pillH/2);
  c.stroke();
  c.fillStyle = '#92400e';
  c.font = "900 38px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('⭐ ' + starCount, startX + pillW/2, statsY + pillH/2 + 2);

  const pill2X = startX + pillW + pillGap;
  c.fillStyle = 'rgba(96,165,250,.14)';
  roundRectPath(c, pill2X, statsY, pillW, pillH, pillH/2);
  c.fill();
  c.strokeStyle = 'rgba(96,165,250,.55)';
  c.lineWidth = 2;
  roundRectPath(c, pill2X, statsY, pillW, pillH, pillH/2);
  c.stroke();
  c.fillStyle = '#1e40af';
  c.font = "900 38px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('🔥 ' + combo, pill2X + pillW/2, statsY + pillH/2 + 2);

  const ctaBoxY = statsY + pillH + 90;
  const ctaBoxW = CW - 220;
  const ctaBoxH = 150;
  const ctaBoxX = CW/2 - ctaBoxW/2;

  c.fillStyle = '#ffffff';
  roundRectPath(c, ctaBoxX, ctaBoxY, ctaBoxW, ctaBoxH, 30);
  c.fill();
  c.strokeStyle = 'rgba(37,99,235,.18)';
  c.lineWidth = 2;
  roundRectPath(c, ctaBoxX, ctaBoxY, ctaBoxW, ctaBoxH, 30);
  c.stroke();

  c.fillStyle = '#0f172a';
  c.font = "900 40px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('هل تقدر تكسر رقمي؟ 💪', CW/2, ctaBoxY + 58);

  c.fillStyle = '#2563eb';
  c.font = "800 30px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('العب مع ناوي دلوقتي', CW/2, ctaBoxY + 108);

  c.fillStyle = 'rgba(100,116,139,.75)';
  c.font = "700 26px Cairo, system-ui, sans-serif";
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';
  c.fillText('ناوي · العب وارفع رقمك', CW/2, CH - 80);

  return shareCanvas;
}

/* ============================================================
   SHARE MODAL
   ============================================================ */
let cachedShareBlob = null;
let shareBlobToken = 0;

function canvasToBlob(){
  return new Promise((resolve) => {
    try {
      if (shareCanvas.toBlob){
        shareCanvas.toBlob(b => resolve(b), 'image/png', 0.92);
      } else {
        const dataUrl = shareCanvas.toDataURL('image/png');
        const bin = atob(dataUrl.split(',')[1]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        resolve(new Blob([arr], {type: 'image/png'}));
      }
    } catch(e){ resolve(null); }
  });
}

function openShareModal(){
  const draw = () => {
    generateShareCard();
    shareModal.classList.add('open');

    const token = ++shareBlobToken;
    cachedShareBlob = null;
    canvasToBlob().then(b => {
      if (token === shareBlobToken) cachedShareBlob = b;
    });
  };
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(draw).catch(draw);
  } else {
    draw();
  }
}
function closeShareModal(){
  shareModal.classList.remove('open');
}
ovShareBtn.addEventListener('click', e => { e.stopPropagation(); openShareModal(); });
shareClose.addEventListener('click', e => { e.stopPropagation(); closeShareModal(); });
shareModal.addEventListener('click', e => {
  if (e.target === shareModal) closeShareModal();
});

function downloadShareImage(){
  try {
    const url = shareCanvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nawy-score-' + Math.floor(score) + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e){}
}

shareStoryBtn.addEventListener('click', e => {
  e.stopPropagation();

  if (cachedShareBlob){
    const file = new File([cachedShareBlob], 'nawy-score.png', { type: 'image/png' });
    const shareUrl = 'https://nawy.app/run';
    const shareText = 'وصلت لـ ' + Math.floor(score) + ' نقطة! هل تقدر تكسر رقمي؟ 🔥\n' + shareUrl;

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({
        files: [file],
        title: 'العب مع ناوي',
        text: shareText
      })
      .then(() => showToast('✅ تمت المشاركة'))
      .catch(err => { if (err && err.name !== 'AbortError') showToast('⚠️ تعذّر المشاركة'); });
      return;
    }
    if (navigator.share){
      navigator.share({
        title: 'العب مع ناوي',
        text: shareText
      })
      .then(() => showToast('✅ تمت المشاركة'))
      .catch(err => { if (err && err.name !== 'AbortError') showToast('⚠️ تعذّر المشاركة'); });
      return;
    }
  }

  downloadShareImage();
  showToast('⬇️ تم تحميل الصورة');
});

shareTextBtn.addEventListener('click', e => {
  e.stopPropagation();
  const shareUrl = 'https://nawy.app/run';
  const text =
    '🎮 العب مع ناوي\n' +
    'أنا وصلت لـ ' + Math.floor(score) + ' نقطة!\n' +
    '⭐ نجوم: ' + starCount + '  🔥 سلسلة: ' + combo + '\n' +
    'هل تقدر تكسر رقمي؟ 💪\n' +
    shareUrl;
  if (navigator.share){
    navigator.share({ title: 'العب مع ناوي', text })
      .then(() => showToast('✅ تمت المشاركة'))
      .catch(err => {
        if (err && err.name === 'AbortError') return;
        try {
          navigator.clipboard.writeText(text);
          showToast('📋 تم نسخ النتيجة');
        } catch(e2){ showToast('⚠️ تعذّر النسخ'); }
      });
  } else {
    try {
      navigator.clipboard.writeText(text);
      showToast('📋 تم نسخ النتيجة');
    } catch(e2){ showToast('⚠️ تعذّر النسخ'); }
  }
});

shareDownloadBtn.addEventListener('click', e => {
  e.stopPropagation();
  downloadShareImage();
  showToast('⬇️ تم تحميل الصورة');
});

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(){
  if (state === 'paused'){
    resumeGame();
    return;
  }

  score = 0; lastShown = -1; milestone = 0;
  starCount = 0; combo = 0;
  speed = BASE_SPEED;
  obstacleTimer = 1.05;
  starTimer = rand(1.4, 2.8);
  powerTimer = 2.8;
  shake = 0;
  lastRunRecord = false;
  lastMilestoneIdx = -1;

  obstacles.length = 0;
  stars.length = 0;
  powerups.length = 0;
  particles.length = 0;

  player.x = Math.max(46, W * 0.14);
  player.y = groundY - player.size;
  player.vy = 0; player.grounded = true;
  player.squash = 1; player.blinking = 0; player.blinkTimer = rand(1, 3);
  player.coyote = COYOTE; player.jumpBuf = 0;
  player.shield = 0; player.magnet = 0;
  player.mood = 'idle'; player.moodTimer = 0;
  player.pupilX = 0; player.pupilY = 0;
  player.pupilTargetX = 0.3; player.pupilTargetY = 0;
  player.rotation = 0;
  player.deathT = -1; player.deathVy = 0;

  scoreEl.textContent = '0';
  comboEl.textContent = '0';
  comboStat.classList.remove('show');
  starsEl.textContent = '0';
  shieldChip.classList.remove('show');
  magnetChip.classList.remove('show');
  hintEl.classList.remove('fade-out');
  clearTimeout(thoughtTimeout);
  thoughtVisible = false;
  thoughtEl.classList.remove('show');

  overlay.classList.add('hidden');
  pauseBtn.innerHTML = ICONS.pause;

  unlockAudio();
  state = 'playing';
  spawnPowerup(true);
}
function pauseGame(){
  if (state !== 'playing') return;
  state = 'paused';
  showOverlay({
    mood: 'paused', title: 'وقفة صغيرة',
    text : 'خد نفس... ولما تكون جاهز نكمل.',
    btn  : 'كمّل اللعب',
    action: 'resume',
    showShare: false
  });
  pauseBtn.innerHTML = ICONS.play;
}
function resumeGame(){
  if (state !== 'paused') return;
  state = 'playing';
  overlay.classList.add('hidden');
  pauseBtn.innerHTML = ICONS.pause;
}
function gameOver(){
  state = 'over';
  overAt = performance.now();
  score = Math.floor(score);
  shake = 3.5;
  hitStop = 0.08;
  sfx('hit'); vibrate(50);
  setMood('hit', 5);

  player.deathT = 0;
  player.deathVy = -620;

  burstConfetti(player.x + player.size/2, player.y + player.size/2, 12);

  let record = false;
  if (score > best){
    best = score; record = true;
    try { localStorage.setItem('nawy.best.v14', String(best)); } catch(e){}
    bestEl.textContent = best;
    sfx('record');
    setMood('record', 5);
  }
  lastRunRecord = record;

  showOverlay({
    mood: record ? 'record' : 'sad',
    title: record ? 'رقم قياسي جديد!' : 'ناوي خبط!',
    text : 'نتيجتك: <b>' + score + '</b> — الأفضل: <b>' + best + '</b>',
    btn  : 'حاول تاني',
    action: 'start',
    showShare: true,
    badge: record ? 'أحسنت! 🎉' : null
  });

  if (record) burstConfetti(W * 0.5, H * 0.35, 14);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastFrameTime = 0;

function frame(t){
  requestAnimationFrame(frame);

  if (!lastFrameTime){ lastFrameTime = t; return; }

  const elapsed = t - lastFrameTime;
  if (elapsed < FRAME_MIN_MS) return;

  let dt = elapsed / 1000;
  lastFrameTime = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1/30);

  if (hitStop > 0){
    hitStop -= dt;
    render();
    return;
  }

  worldTime += dt;

  if (state === 'playing') update(dt);
  else if (state === 'over') updateDeath(dt);

  updateAmbient(dt);
  updateClouds(dt);
  updateParticles(dt);
  updateSunPos();
  updateThoughtPos();

  shake *= Math.exp(-10 * dt);
  if (shake < 0.15) shake = 0;

  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') pauseGame();
  if (document.hidden) lastFrameTime = 0;
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  bestEl.textContent = best;
  drawNawyPortrait(ovNawy, 'idle');

  resize();
  updateSunPos();
  for (let i = 0; i < 2; i++) spawnCloud();
  requestAnimationFrame(frame);
}
init();

})();
