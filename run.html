<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>خد استراحة</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b20;
      --surface-2: #1f2329;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(255,255,255,0.12);
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .run-shell {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .back-btn {
      align-self: flex-start;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }
    .run-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 20px 24px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.18);
      text-align: center;
    }
    .dot {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.85;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 32px);
    }
    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="run-shell">
    <button id="backBtn" class="back-btn" type="button">رجوع</button>
    <main class="run-card" aria-label="صفحة استراحة">
      <div class="dot" aria-hidden="true"></div>
      <h1>خد استراحة</h1>
      <p>خذ دقيقة للراحة، ثم عد إلى نواياك.</p>
    </main>
  </div>

  <script>
    const goHome = () => {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.assign('./index.html');
    };

    document.getElementById('backBtn').addEventListener('click', goHome);
  </script>
</body>
</html>
