<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c5e0f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>العب مع ناوي 🎮</title>
<!-- خطوط محلية (OFL): fonts/OFL.txt و fonts/OFL-PressStart2P.txt -->
<link rel="preload" href="./fonts/cairo-ar-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Cairo';font-style:normal;font-weight:400 1000;font-display:swap;src:url("./fonts/cairo-ar-latin.woff2") format("woff2");}
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/press-start-2p.woff2") format("woff2");}
@font-face{font-family:'Handjet';font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/handjet-ar.woff") format("woff");}
@font-face{font-family:'Px Digits';font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/press-start-2p.woff2") format("woff2");unicode-range:U+0030-0039,U+0025;}
@font-face{font-family:'Px Latin';font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/press-start-2p.woff2") format("woff2");unicode-range:U+0041-005A,U+0061-007A;}
  :root{
    --ink:#1e293b;
    --ink-muted:#64748b;
    --card-bg:rgba(255,255,255,.9);
    --card-border:rgba(203,213,225,.7);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    font-family:'Px Digits','Cairo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#c5e0f7;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;
    position:fixed;inset:0;
  }
  .game{position:fixed;inset:0;overflow:hidden;}
  .stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;}
  canvas{
    width:100%;height:100%;display:block;touch-action:none;
    image-rendering:auto;
  }

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:50;
    padding:max(10px,env(safe-area-inset-top))
            max(14px,env(safe-area-inset-right))
            10px max(14px,env(safe-area-inset-left));
    display:flex;align-items:center;gap:10px;pointer-events:none;
  }
  .brand{
    font-size:17px;font-weight:900;white-space:nowrap;letter-spacing:-.3px;
    color:var(--ink);text-shadow:0 1px 2px rgba(255,255,255,.6);
  }
  .brand em{font-style:normal;color:#3D7BFF;}
  .stats{margin-inline-start:auto;display:flex;gap:16px;align-items:baseline;white-space:nowrap;}
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1;}
  .stat.combo{
    opacity:0;transform:translateY(-4px);
    transition:opacity .22s ease,transform .22s ease;
  }
  .stat.combo.show{opacity:1;transform:translateY(0);}
  .stat span{
    font-size:9px;color:rgba(30,41,59,.5);font-weight:800;
    letter-spacing:.2px;margin-bottom:2px;
    text-shadow:0 1px 2px rgba(255,255,255,.55);
  }
  .stat b{
    font-family:'Press Start 2P',system-ui,monospace;
    font-size:13px;color:var(--ink);font-weight:400;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(255,255,255,.6);
  }

  .control-bar{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:max(14px, env(safe-area-inset-bottom));
    z-index:50;
    display:flex;align-items:center;gap:2px;
    padding:6px;border-radius:999px;
    background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 6px 16px rgba(20,40,70,.14);
    pointer-events:auto;
  }
  .ctrl-btn{
    width:42px;height:42px;
    border:none;background:transparent;
    border-radius:50%;
    display:grid;place-items:center;cursor:pointer;
    color:var(--ink);
    transition:transform .14s ease, background .16s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ctrl-btn svg{ width:20px;height:20px;display:block; }
  .ctrl-btn:active{ transform:scale(.86); background:rgba(255,255,255,.55); }
  .ctrl-btn.exit{ color:#dc2626; }
  .ctrl-sep{
    width:1px;height:22px;
    background:rgba(30,41,59,.14);
    margin:0 2px;
  }
  @media (orientation:landscape) and (max-height:480px){
    .control-bar{ bottom:max(8px, env(safe-area-inset-bottom)); padding:4px; gap:0; }
    .ctrl-btn{ width:36px;height:36px; }
    .ctrl-btn svg{ width:18px;height:18px; }
  }

  .hud{
    position:absolute;
    top:max(72px,calc(env(safe-area-inset-top) + 62px));
    left:14px;right:14px;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;gap:8px;
  }
  .hud-side{display:flex;gap:14px;flex-wrap:wrap;}
  .chip{
    font-size:14px;font-weight:900;color:var(--ink);
    display:none;align-items:center;gap:4px;
    text-shadow:0 1px 3px rgba(255,255,255,.65);
  }
  .chip.show{display:inline-flex;}
  .chip.shield{color:#3D7BFF;}
  .chip.magnet{color:#b45309;}
  .chip.stars{color:#b45309;display:inline-flex;}
  .chip b{color:inherit;font-family:'Press Start 2P',system-ui,monospace;font-size:.9em;font-variant-numeric:tabular-nums;font-weight:400;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:20px;z-index:10;
    background:rgba(255,255,255,.35);
  }
  .overlay.hidden{display:none;}
  .overlay-inner{
    position:relative;
    padding:58px 24px 22px;border-radius:28px;
    background:#ffffff;
    border:3px solid #0f172a;
    box-shadow:0 7px 0 #0f172a, 0 16px 34px rgba(15,23,42,.20);
    max-width:min(380px,92vw);pointer-events:auto;
  }
  .overlay h1{margin:0 0 6px;font-family:'Handjet','Cairo',system-ui,sans-serif;font-size:34px;line-height:1.1;font-weight:400;letter-spacing:0;color:#0f172a;}
  .overlay p{margin:0;color:#5b6b82;font-size:13px;font-weight:750;line-height:1.7;}
  .overlay p b{color:#0f172a;font-family:'Press Start 2P',system-ui,monospace;font-size:.95em;font-variant-numeric:tabular-nums;}
  .overlay .ov-nawy{
    position:absolute;top:-50px;left:50%;transform:translateX(-50%);
    width:96px;height:96px;border-radius:50%;
    background:#ffffff;border:4px solid #0f172a;
    box-shadow:0 5px 0 #0f172a;
  }
  .overlay .ov-star{
    position:absolute;top:-24px;color:#fbbf24;font-size:16px;
    filter:drop-shadow(0 1px 0 #92400e);
  }
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    margin-top:10px;padding:5px 14px;border-radius:999px;
    background:#fff7e6;color:#7a4a08;font-weight:900;font-size:12px;
    border:2px solid #0f172a;box-shadow:0 3px 0 #0f172a;
  }
  .button{
    margin-top:16px;border:2.5px solid #0f172a;border-radius:16px;padding:13px 28px;
    background:#3D7BFF;color:#fff;
    font-size:15px;font-weight:900;letter-spacing:.2px;
    cursor:pointer;pointer-events:auto;font-family:inherit;
    box-shadow:0 5px 0 #21438c;
    transition:transform .08s ease, box-shadow .08s ease;
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .button:active{transform:translateY(4px);box-shadow:0 1px 0 #21438c;}
  .button.secondary{background:#ffffff;color:#0f172a;box-shadow:0 5px 0 #0f172a;}
  .button.secondary:active{box-shadow:0 1px 0 #0f172a;}

  .toast{
    position:absolute;
    top:max(72px,calc(env(safe-area-inset-top) + 62px));
    left:50%;transform:translate(-50%,-6px) scale(.94);
    background:rgba(255,255,255,.92);
    color:#0f172a;padding:8px 18px;
    border:1px solid rgba(255,255,255,.9);
    border-radius:999px;font-weight:800;font-size:12.5px;
    opacity:0;pointer-events:none;
    transition:opacity .32s ease,transform .32s cubic-bezier(.22,.9,.32,1);
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(20,45,80,.14);
    z-index:45;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1);}

  .thought{
    position:absolute;
    transform:translate(-50%,-100%) scale(.85);
    transform-origin:bottom center;
    background:#ffffff;
    border:2.5px solid #0f172a;
    border-radius:16px;
    padding:6px 13px;
    font-weight:800;font-size:12px;color:#0f172a;
    white-space:nowrap;
    box-shadow:2px 3px 0 rgba(15,23,42,.85);
    opacity:0;pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
    z-index:40;
  }
  .thought.show{ opacity:1; transform:translate(-50%,-118%) scale(1); }
  .thought .tdot{
    position:absolute;
    background:#ffffff;
    border-radius:50%;
  }
  .thought .tdot.d1{ width:11px;height:11px; border:2.2px solid #0f172a; bottom:-16px; left:44%; margin-left:-5.5px; }
  .thought .tdot.d2{ width:6px;height:6px; border:1.6px solid #0f172a; bottom:-25px; left:37%; margin-left:-3px; }

  .hint{
    position:absolute;left:0;right:0;
    bottom:max(80px,calc(env(safe-area-inset-bottom) + 72px));
    z-index:20;text-align:center;
    font-size:11px;font-weight:700;
    color:var(--ink-muted);opacity:.55;pointer-events:none;
    transition:opacity .4s ease;
  }
  .hint.fade-out{opacity:0;}

  .share-modal{
    position:absolute;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:16px;
    background:rgba(10,20,40,.72);
  }
  .share-modal.open{display:flex;}
  .share-card{
    position:relative;
    width:min(430px, 94vw);
    max-height:96vh;
    background:#ffffff;
    border-radius:28px;
    padding:20px;
    box-shadow:0 30px 80px rgba(10,20,40,.4);
    display:flex;flex-direction:column;
    gap:14px;
    overflow:hidden;
  }
  .share-close{
    position:absolute;
    top:14px;inset-inline-end:14px;
    width:34px;height:34px;border-radius:50%;
    background:#f1f5f9;border:0;color:#64748b;
    font-size:16px;font-weight:900;
    display:grid;place-items:center;cursor:pointer;
    z-index:5;
  }
  .share-close:active{transform:scale(.9);}
  .share-header{text-align:center;padding:0 34px;}
  .share-header h2{margin:0 0 4px;font-size:20px;font-weight:950;color:#0f172a;}
  .share-header p{margin:0;font-size:12px;font-weight:700;color:#64748b;}
  .share-preview{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    padding:8px;border-radius:18px;
    background:linear-gradient(135deg, #eef5ff 0%, #dceaff 100%);
    overflow:hidden;
  }
  #shareCanvas{
    display:block;width:auto;height:auto;
    max-height:min(50vh, 420px);
    max-width:100%;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(10,30,70,.22);
  }
  .share-actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;}
  .share-btn{
    width:100%;border:0;border-radius:14px;
    padding:13px 18px;font-family:inherit;
    font-size:14px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s;
  }
  .share-btn:active{transform:scale(.97);}
  .share-btn.primary{
    background:#3D7BFF;color:#fff;
    box-shadow:0 8px 20px rgba(61,123,255,.32);
  }
  .share-btn.ghost{background:#f1f5f9;color:#334155;font-size:13px;}

  @media (max-width:520px){
    .brand{font-size:15px;}
    .stats{gap:12px;}
    .stat b{font-size:15px;}
    .ctrl-btn{width:38px;height:38px;}
    .ctrl-btn svg{width:18px;height:18px;}
  }
  @media (max-height:680px){
    .share-header h2{font-size:17px;}
    #shareCanvas{max-height:44vh;}
    .share-btn{padding:11px 16px;font-size:13px;}
    .share-card{padding:16px;gap:10px;}
  }
</style>
</head>
<body>

<div class="game">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <div class="topbar">
      <div class="brand">🎮 العب مع <em>ناوي</em></div>
      <div class="stats">
        <div class="stat"><span>النقاط</span><b id="score">0</b></div>
        <div class="stat"><span>الأفضل</span><b id="best">0</b></div>
        <div class="stat combo" id="comboStat"><span>سلسلة</span><b id="combo">0</b></div>
      </div>
    </div>

    <div class="hud">
      <div class="hud-side">
        <div class="chip shield" id="shieldChip">🛡️ <b id="shieldTime">0</b></div>
        <div class="chip magnet" id="magnetChip">🧲 <b id="magnetTime">0</b></div>
      </div>
      <div class="hud-side">
        <div class="chip stars" id="starsChip">⭐ <b id="stars">0</b></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <canvas class="ov-nawy" id="ovNawy" width="168" height="168"></canvas>
        <span class="ov-star" style="left:18px;">★</span>
        <span class="ov-star" style="right:18px;">★</span>
        <h1 id="ovTitle">ناوي جاهز؟</h1>
        <p id="ovText">اضغط في أي مكان عشان تبدأ</p>
        <button type="button" class="button" id="ovBtn">يلا نبدأ</button>
        <button type="button" class="button secondary" id="ovShareBtn" style="display:none;margin-top:8px;">📤 شارك نتيجتك</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="thought" id="thought">
      <span id="thoughtText"></span>
      <i class="tdot d1"></i>
      <i class="tdot d2"></i>
    </div>
    <div class="hint" id="hint">اضغط للنط — Space / ↑</div>

    <div class="control-bar">
      <button type="button" class="ctrl-btn exit" id="exitBtn" aria-label="رجوع"></button>
      <div class="ctrl-sep"></div>
      <button type="button" class="ctrl-btn" id="muteBtn" aria-label="الصوت"></button>
      <button type="button" class="ctrl-btn" id="pauseBtn" aria-label="إيقاف"></button>
    </div>

    <div class="share-modal" id="shareModal">
      <div class="share-card" role="dialog" aria-modal="true">
        <button type="button" class="share-close" id="shareClose" aria-label="إغلاق">✕</button>
        <div class="share-header">
          <h2>شارك نتيجتك 🎉</h2>
          <p>خلّي أصحابك يجربوا يكسرون رقمك</p>
        </div>
        <div class="share-preview">
          <canvas id="shareCanvas" width="1080" height="1920"></canvas>
        </div>
        <div class="share-actions">
          <button type="button" class="share-btn primary" id="shareStoryBtn">📸 شارك على ستوري</button>
          <button type="button" class="share-btn ghost" id="shareTextBtn">💬 شارك كرسالة</button>
          <button type="button" class="share-btn ghost" id="shareDownloadBtn">⬇️ احفظ الصورة</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="importmap">
{ "imports": { "nawy-game/util": "./game/util.js?v=1.59.51", "nawy-game/sound": "./game/sound.js?v=1.59.51", "nawy-game/particles": "./game/particles.js?v=1.59.51", "nawy-game/share-card": "./game/share-card.js?v=1.59.51", "nawy-game/sprites": "./game/sprites.js?v=1.59.51", "nawy-game/state": "./game/state.js?v=1.59.51", "nawy-game/render": "./game/render.js?v=1.59.51", "nawy-game/spawn": "./game/spawn.js?v=1.59.51", "nawy-game/constants": "./game/constants.js?v=1.59.51", "nawy-game/update": "./game/update.js?v=1.59.51", "nawy-game/clouds": "./game/clouds.js?v=1.59.51", "nawy-game/portrait": "./game/portrait.js?v=1.59.51", "nawy-game/share-modal": "./game/share-modal.js?v=1.59.51", "nawy-game/ui": "./game/ui.js?v=1.59.51", "nawy-game/loop": "./game/loop.js?v=1.59.51", "nawy-game/resize": "./game/resize.js?v=1.59.51", "nawy-game/flow": "./game/flow.js?v=1.59.51", "nawy-game/hud": "./game/hud.js?v=1.59.51", "nawy-game/overlay": "./game/overlay.js?v=1.59.51", "nawy-game/input": "./game/input.js?v=1.59.51" } }
</script>
<script type="module" src="./game.js?v=1.59.51"></script>
</body>
</html>
