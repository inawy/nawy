name: Test and deploy

# الاختبارات بتشتغل على كل push على main وكل pull request: أنواع TypeScript،
# تطابق الملفات المولَّدة مع src/core، الاختبارات السريعة، البناء، واختبارات
# المتصفح على الموقع المبني. النشر على GitHub Pages بيتم من main بس وبعد ما
# كل ده ينجح؛ لو أي حاجة فشلت النسخة المنشورة حاليًا بتفضل زي ما هي.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dev tools
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Generated core files match src/core
        run: npm run check:core
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests on the built site
        run: |
          npm run test:browser 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then node scripts/annotate-log.mjs browser.log; fi
          exit "$code"
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
