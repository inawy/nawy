name: Update dependencies (lockfile)

# يدوي فقط: بيثبّت أحدث إصدارات أدوات التطوير،
# وبيسجّل package.json و package-lock.json على نفس الفرع. التطبيق نفسه ما عندوش
# أي dependency وقت التشغيل — دي أدوات بناء واختبار بس.
on:
  workflow_dispatch:
  # تشغيل من فرع: تعديل الملف .github/triggers/update-deps (يغيّر رقم داخله) بيشغّله
  push:
    branches-ignore: [main]
    paths:
      - ".github/triggers/update-deps"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dev tools and write the lockfile
        run: npm install --save-dev --package-lock-only --no-audit --no-fund vite typescript playwright react react-dom preact @types/react @types/react-dom @vitejs/plugin-react eslint @eslint/js globals prettier
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: dev tools and lockfile (vite, typescript, playwright)"
          git push
