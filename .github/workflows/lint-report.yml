name: Lint report (branch only)

# أداة مؤقتة لتشخيص ESLint: بتشغّل ESLint على الفرع وبتسجّل التقرير في lint-report.txt
# على نفس الفرع (عشان أقراه من غير ما أحتاج npm محلي). بتتشغّل من تغيير
# .github/triggers/lint-report. ماشتغلش على main.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/triggers/lint-report"
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npx eslint . -f json -o eslint.json || true
      - name: Summarize
        run: |
          node -e '
            const r = require("./eslint.json");
            const byRule = {}; let errors = 0, warnings = 0;
            const lines = [];
            for (const f of r) for (const m of f.messages) {
              const rule = m.ruleId || "parse";
              byRule[rule] = (byRule[rule] || 0) + 1;
              if (m.severity === 2) errors++; else warnings++;
              lines.push(`${f.filePath.replace(process.cwd() + "/", "")}:${m.line}:${m.column} ${m.severity === 2 ? "error" : "warn"} ${rule} ${m.message}`);
            }
            const out = [`errors=${errors} warnings=${warnings}`, JSON.stringify(byRule), "", ...lines].join("\n");
            require("fs").writeFileSync("lint-report.txt", out + "\n");
          '
      - name: Commit report
        run: |
          rm -f eslint.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.txt
          git diff --cached --quiet || git commit -m "chore: eslint report"
          git push
